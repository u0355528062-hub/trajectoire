      tours: def.tours.map((t, i) => ({ ...t, index: i, joue: false })),
    });
  }
  return coupes;
}

function coupeById(state, id) {
  return (state.coupes || []).find(c => c.id === id) || (state.coupesHisto || []).find(c => c.id === id);
}

/* Adversaire d'un tour : sa réputation cible monte à chaque tour. */
function adversaireCoupe(state, coupe, tourIndex) {
  const rng = rngFrom(state.seed, 'advc', state.season, coupe.k, tourIndex);
  const cible = coupe.tours[tourIndex].rep;
  /* En Coupe d'Europe, les adversaires viennent des autres pays. */
  const monPays = clubById(state.clubId).pays;
  const pool = coupe.europe
    ? CLUBS.filter(c => c.pays !== monPays && c.div && divDef(c.div).statut === 'pro')
    : CLUBS.filter(c => c.id !== state.clubId && c.pays === monPays &&
        (coupe.k !== 'reg' || CFG.COUPE_REGIONALE_DIVISIONS.includes(c.div)));
  /* Plus le tour est avancé, plus le tirage se resserre autour du
     niveau attendu : en finale on n'affronte pas un club de district. */
  /* À partir des tours nationaux, seuls les clubs d'un niveau
     comparable restent en lice : le tirage est filtré, pas seulement
     pondéré. */
  const tolerance = tourIndex >= 6 ? 12 : tourIndex >= 4 ? 18 : 26;
  const eligibles = pool.filter(c => Math.abs(c.rep - cible) <= tolerance);
  /* Le repli reste national : on n'affronte jamais un club d'un autre
     pays dans une coupe nationale, quitte à élargir la fourchette. */
  const base = eligibles.length >= 3 ? eligibles : pool;
  if (!base.length) {
    const secours = CLUBS.filter(c => c.id !== state.clubId && c.pays === clubById(state.clubId).pays);
    return secours.length ? pick(rng, secours) : CLUBS.find(c => c.id !== state.clubId);
  }
  const scored = base.map(c => ({ c, w: 1 / (1 + Math.pow(Math.abs(c.rep - cible), 1.5) * 0.8) }));
  const choisi = weightedPick(rng, scored, 'w');
  return (choisi && choisi.c) || base[0];
}

/* Adversaire du prochain tour, connu à l'avance (tirage effectué). */
function prochainAdversaire(state, coupe) {
  if (!coupe || coupe.elimine || coupe.vainqueur) return null;
  const i = coupe.tours.findIndex((t, k) => k >= coupe.depart && !t.joue);
  if (i < 0) return null;
  return { tour: coupe.tours[i], index: i, club: adversaireCoupe(state, coupe, i) };
}

function jouerTourCoupe(state, coupe, tourIndex, out) {
  const tour = coupe.tours[tourIndex];
  if (!tour || coupe.elimine || tour.joue) return coupe;
  const rng = rngFrom(state.seed, 'coupe', state.season, coupe.k, tourIndex);
  const adv = adversaireCoupe(state, coupe, tourIndex);
  /* Le club le moins bien classé reçoit, comme dans le règlement réel. */
  const recoit = clubById(state.clubId).rep <= adv.rep;
  const fixture = recoit ? { h: state.clubId, a: adv.id } : { h: adv.id, a: state.clubId };

  const res = simMatch(state, fixture, { tag: 'coupe', label: `${coupe.nom} — ${tour.n}`,
    tag2: coupe.k + tourIndex, date: fmtDate(currentDate(state)) });
  applyMatch(state, res);
  res.primes = verserPrimes(state, res);
  out.matchs.push(res);

  const reg_h = res.home ? res.gPour : res.gContre;
  const reg_a = res.home ? res.gContre : res.gPour;
  let gh = reg_h, ga = reg_a;
  let tab = false, tabScore = null;
  if (gh === ga) {
    tab = true;
    const a = ri(rng, 3, 5), b = a === 5 ? ri(rng, 2, 4) : ri(rng, 2, a - 1 < 2 ? 2 : a - 1);
    const moiGagne = rng() < 0.5;
    tabScore = res.home ? (moiGagne ? `${a}-${b}` : `${b}-${a}`) : (moiGagne ? `${b}-${a}` : `${a}-${b}`);
    if (moiGagne === res.home) gh++; else ga++;
  }
  const gagne = (res.home && gh > ga) || (!res.home && ga > gh);

  tour.joue = true;
  tour.adversaire = adv.id;
  tour.gh = gh; tour.ga = ga; tour.reg_h = reg_h; tour.reg_a = reg_a;
  tour.tab = tab; tour.tabScore = tabScore; tour.home = res.home;
  tour.note = res.note; tour.minutes = res.minutes; tour.gagne = gagne; tour.date = fmtDate(currentDate(state));
  coupe.matchs.push({ tour: tour.n, adversaire: adv.id, gh: reg_h, ga: reg_a, tab, tabScore, note: res.note, minutes: res.minutes });
  res.tabScore = tabScore;

  /* En phase de ligue, une défaite n'élimine pas : on cumule des
     points sur l'ensemble des journées. */
  if (tour.prelim) {
    if (!gagne) {
      coupe.elimine = true;
      coupe.rangAtteint = `Éliminé au ${tour.n.toLowerCase()}`;
      log(state, `${coupe.nom} : élimination dès le ${tour.n.toLowerCase()}.`, 'coupe');
    } else log(state, `${coupe.nom} : qualification acquise au ${tour.n.toLowerCase()}.`, 'coupe');
    coupe.tourCourant = tourIndex + 1;
    out.coupe = coupe; out.tourJoue = tourIndex;
    return coupe;
  }
  if (tour.ligue) {
    const table = journeeLigueEurope(state, coupe, { gPour: res.home ? reg_h : reg_a, gContre: res.home ? reg_a : reg_h });
    const maLigne = table.find(x => x.moi);
    coupe.rangLigue = maLigne ? maLigne.rang : null;
    coupe.pointsLigue = maLigne ? maLigne.pts : 0;
    coupe.tourCourant = tourIndex + 1;
    tour.gagne = gagne;
    const derniereLigue = !coupe.tours[tourIndex + 1] || !coupe.tours[tourIndex + 1].ligue;
    if (derniereLigue) {
      if (coupe.rangLigue > 24) {
        coupe.elimine = true;
        coupe.rangAtteint = `Éliminé en phase de ligue (${coupe.rangLigue}e)`;
        log(state, `${coupe.nom} : élimination en phase de ligue, ${coupe.pointsLigue} points.`, 'coupe');
      } else log(state, `${coupe.nom} : phase de ligue terminée, ${coupe.pointsLigue} points (${coupe.rangLigue}e).`, 'coupe');
    }
    out.coupe = coupe; out.tourJoue = tourIndex;
    return coupe;
  }
  if (gagne) {
    coupe.tourCourant = tourIndex + 1;
    if (tourIndex === coupe.tours.length - 1) {
      coupe.vainqueur = true; coupe.rangAtteint = 'Vainqueur';
      state.palmares.push({ saison: state.season, titre: `Vainqueur — ${coupe.nom}`, club: clubById(state.clubId).n });
      log(state, `${clubById(state.clubId).n} remporte la ${coupe.nom}.`, 'trophee');
    } else log(state, `${coupe.nom} : qualification acquise au ${tour.n.toLowerCase()}.`, 'coupe');
  } else {
    coupe.elimine = true;
    coupe.rangAtteint = `Éliminé au ${tour.n.toLowerCase()}`;
    log(state, `${coupe.nom} : élimination au ${tour.n.toLowerCase()} face à ${adv.n}.`, 'coupe');
  }
  out.coupe = coupe;
  out.tourJoue = tourIndex;
  return coupe;
}

/* ---------- Âge ----------
   L'expérience rentre moins bien en vieillissant, et la générale
   commence à reculer passé un certain âge, même sans rien faire de
   mal : c'est le corps qui décide.                                 */
function facteurAge(age) {
  if (age <= CFG.AGE.xpPic) return 1;
  if (age >= CFG.AGE.xpFin) return 0.18;
  const t = (age - CFG.AGE.xpPic) / (CFG.AGE.xpFin - CFG.AGE.xpPic);
  return round2(1 - t * 0.82);
}

/* Déclin appliqué en fin de saison. Retire aussi des points aux
   attributs physiques, pas seulement à la générale. */
function appliquerDeclin(state) {
  const p = state.player;
  const age = ageAt(p.naissance, currentDate(state));
  if (age < CFG.AGE.declinDebut) return null;
  /* Le déclin s'accentue avec l'âge mais reste plafonné : une saison
     ne fait pas passer de titulaire à inapte. */
  const perte = round1(Math.min(3.2, (age - CFG.AGE.declinDebut + 1) * CFG.AGE.declinParAn));
  const rng = rngFrom(state.seed, 'declin', state.season);
  const avant = p.niveau;
  p.ovFrac -= perte;
  while (p.ovFrac < 0 && p.niveau > 20) { p.ovFrac += 1; p.niveau--; }
  /* Ce qui part en premier : la vitesse, la détente, l'endurance. */
  const physiques = ['acceleration', 'vitesse_pointe', 'saut', 'endurance', 'agilite', 'force', 'equilibre',
    'gb_vitesse', 'gb_reflexes'].filter(k => k in p.attrs);
  let budget = Math.round(perte * 2.2);
  const touches = [];
  while (budget > 0 && physiques.length) {
    const k = pick(rng, physiques);
    if (p.attrs[k] > 25) { p.attrs[k]--; touches.push(k); }
    budget--;
  }
  return { age, perte, avant, apres: p.niveau, attrs: touches.length };
}

/* ---------- Fin de carrière ---------- */
function evaluerRetraite(state) {
  const p = state.player;
  const age = ageAt(p.naissance, currentDate(state));
  if (age >= CFG.RETRAITE.ageLimite) return { force: true, raison: "L'âge a fini par avoir le dernier mot." };
  if (age < CFG.RETRAITE.ageMini) return null;
  const rng = rngFrom(state.seed, 'retraite', state.season);
  let chance = (age - CFG.RETRAITE.ageMini) * 0.11;
  if (p.cote < CFG.RETRAITE.coteCritique) chance += 0.25;
  if (state.stats.matchs <= 4) chance += 0.20;
  if (p.moral < 30) chance += 0.10;
  if (state.sansContrat) chance += 0.15;
  if (rng() < chance) return { force: false, raison: p.cote < CFG.RETRAITE.coteCritique
    ? "Plus personne ne compte vraiment sur vous."
    : "Le corps suit de moins en moins, et l'envie s'érode." };
  return null;
}

function prendreRetraite(state, raison) {
  try { SUIVI.noter('retraite', { saison: state.season, generale: state.player.niveau,
    age: ageAt(state.player.naissance, currentDate(state)), niveau_xp: state.player.niveauXp }); } catch (e) {}
  state.retraite = true;
  state.retraiteRaison = raison || 'Décision personnelle.';
  state.retraiteAge = ageAt(state.player.naissance, currentDate(state));
  state.retraiteSaison = state.season;
  log(state, `Fin de carrière à ${state.retraiteAge} ans.`, 'carriere');
  save(state);
  return bilanCarriere(state);
}

/* ---------- Records et bilan de carrière ---------- */
function bilanCarriere(state) {
  const p = state.player;
  const tot = statsCarriere(state);
  const saisons = state.saisons;
  const best = (sel) => saisons.reduce((a, b) => (!a || sel(b) > sel(a) ? b : a), null);
  const meilleureButs = best(b => b.stats.buts);
  const meilleureNote = saisons.filter(b => b.stats.matchs >= 5).reduce((a, b) => (!a || (b.note || 0) > (a.note || 0) ? b : a), null);
  const meilleurNiveau = best(b => b.niveau);
  const titres = state.palmares.length;
  const clubs = [...new Set(saisons.map(b => b.club).concat(clubById(state.clubId) ? [clubById(state.clubId).n] : []))];
  const gains = state.finances ? state.finances.total : 0;
  return {
    saisons: saisons.length, age: state.retraiteAge || ageAt(p.naissance, currentDate(state)),
    niveauMax: meilleurNiveau ? meilleurNiveau.niveau : p.niveau, niveauFinal: p.niveau,
    niveauXp: p.niveauXp, carte: rarDef(p.rarete).n, estim: p.estim,
    totaux: tot, note: moyenneNote(tot.notes),
    meilleureSaisonButs: meilleureButs ? { annee: meilleureButs.annee, v: meilleureButs.stats.buts } : null,
    meilleureSaisonNote: meilleureNote ? { annee: meilleureNote.annee, v: meilleureNote.note } : null,
    titres, palmares: state.palmares, clubs, gains,
    coupes: (state.coupesHisto || []).filter(c => c.vainqueur).length,
    promotions: saisons.filter(b => b.promu).length,
    relegations: saisons.filter(b => b.relegue).length,
  };
}


/* ============================================================
   DIRECT — déroulé minute par minute d'une rencontre
   ------------------------------------------------------------
   Le résultat est déjà calculé par le moteur ; ce module le
   reconstitue en une suite d'actions crédibles, réparties sur les
   90 minutes, sans jamais contredire le score final.
   ============================================================ */

/* Le direct ne se déclenche qu'à partir des quarts de finale : le
   libellé doit correspondre exactement, sinon « 8es » attraperait
   « Demi-finales » par simple inclusion de texte. */
function estTourDirect(nomTour) {
  if (!nomTour) return false;
  const n = nomTour.toLowerCase().trim();
  return CFG.LIVE.toursDirect.some(t => n === t.toLowerCase());
}

const ACTIONS_NEUTRES = [
  "Le jeu se stabilise au milieu de terrain.",
  "Récupération haute, l'action est repoussée en touche.",
  "Corner obtenu, dégagement de la tête au premier poteau.",
  "Longue possession, sans percer le bloc adverse.",
  "Le rythme retombe, les deux équipes se jaugent.",
  "Faute au milieu, coup franc joué en retrait.",
  "Duel aérien remporté à l'entrée de la surface.",
  "Contre-attaque avortée sur une passe manquée.",
];

function buildTimeline(state, res, advId) {
  const p = state.player;
  const rng = rngFrom(state.seed, 'live', state.season, state.calIndex, res.gPour, res.gContre);
  const adv = clubById(advId), club = clubById(state.clubId);
  const evs = [];
  const nom = `${p.prenom} ${p.nom}`;

  const entree = res.role === 'entrant' ? clamp(90 - res.minutes, 25, 85) : 0;
  const sortie = res.role === 'titulaire' && res.minutes < 90 ? res.minutes : 90;

  /* Minutes des buts, réparties sans doublon. */
  const minutes = shuffled(rng, Array.from({ length: 88 }, (_, i) => i + 2));
  const pour = minutes.splice(0, res.gPour).sort((a, b) => a - b);
  const contre = minutes.splice(0, res.gContre).sort((a, b) => a - b);

  /* Les buts et passes du joueur tombent forcément quand il est sur
     le terrain : sinon la chronologie contredirait la feuille de match. */
  const surLeTerrain = m => res.minutes > 0 && m >= entree && m <= sortie;
  const dispo = pour.filter(surLeTerrain);
  const misParMoi = pickN(rng, dispo, Math.min(res.buts, dispo.length));
  const restant = dispo.filter(m => !misParMoi.includes(m));
  const passesMoi = pickN(rng, restant, Math.min(res.passes_d, restant.length));

  evs.push({ min: 0, type: 'coup_envoi', txt: `Coup d'envoi. ${club.n} reçoit ${adv.n}.` });
  if (res.role === 'titulaire') evs.push({ min: 0, type: 'compo', txt: `${nom} est titulaire au poste de ${posDef(p.pos).n.toLowerCase()}.` });
  else if (res.role === 'entrant') evs.push({ min: 0, type: 'compo', txt: `${nom} débute sur le banc.` });
  else evs.push({ min: 0, type: 'compo', txt: `${nom} n'entre pas en jeu aujourd'hui.` });

  const push = (min, type, txt, moi) => evs.push({ min, type, txt, moi: !!moi });

  if (entree) push(entree, 'entree', `Changement : ${nom} entre en jeu.`, true);

  for (const m of pour) {
    if (misParMoi.includes(m)) push(m, 'but', `BUT ! ${nom} conclut et fait ${res.home ? 'exploser' : 'taire'} le stade.`, true);
    else if (passesMoi.includes(m)) push(m, 'but', `BUT pour ${club.n} — passe décisive de ${nom}.`, true);
    else push(m, 'but', `BUT pour ${club.n}.`);
  }
  for (const m of contre) push(m, 'but_contre', `But de ${adv.n}.`);

  /* Occasions du joueur, dérivées de ses tirs non convertis. */
  const rates = Math.max(0, res.tirs - res.buts);
  const minutesJeu = minutes.filter(surLeTerrain);
  for (const m of pickN(rng, minutesJeu, Math.min(rates, 4))) {
    push(m, 'occasion', rng() < 0.5 ? `${nom} tente sa chance, le gardien repousse.` : `Frappe de ${nom} qui passe à côté.`, true);
  }
  if (res.arrets) for (const m of pickN(rng, minutesJeu, Math.min(res.arrets, 3))) {
    push(m, 'arret', `Arrêt de ${nom} devant l'attaquant adverse.`, true);
  }
  if (res.jaune) push(ri(rng, 20, 85), 'jaune', `Carton jaune pour ${nom}.`, true);
  if (res.rouge) push(ri(rng, 40, 88), 'rouge', `Carton rouge : ${nom} quitte ses partenaires.`, true);
  if (sortie < 90 && res.role === 'titulaire') push(sortie, 'sortie', `${nom} cède sa place.`, true);

  /* Remplissage neutre pour donner du rythme. */
  const dejaPrises = new Set(evs.map(e => e.min));
  for (const m of pickN(rng, minutes.filter(x => !dejaPrises.has(x)), 8)) {
    push(m, 'neutre', pick(rng, ACTIONS_NEUTRES));
  }
  push(45, 'mitemps', `Mi-temps.`);
  push(90, 'fin', `Coup de sifflet final.`);

  evs.sort((a, b) => a.min - b.min || (a.type === 'coup_envoi' ? -1 : 0));
  /* Score courant à chaque étape, pour l'affichage. */
  let gp = 0, gc = 0;
  for (const e of evs) {
    if (e.type === 'but') gp++;
    if (e.type === 'but_contre') gc++;
    e.score = res.home ? `${gp}-${gc}` : `${gc}-${gp}`;
    e.gPour = gp; e.gContre = gc;
  }
  return evs;
}


/* ============================================================
   PRO — tout ce qui n'existe pas dans le monde amateur
   ------------------------------------------------------------
   À partir de la Ligue 3, le football devient un métier : agent qui
   prélève sa commission, indemnités de transfert entre clubs, contrats
   de sponsoring, sélection nationale, distinctions individuelles,
   coupe d'Europe et conférences de presse.
   ============================================================ */

function statutDiv(divKey) { return divKey ? divDef(divKey).statut : 'amateur'; }
function estPro(state) { return statutDiv(clubById(state.clubId).div) === 'pro'; }
function themeKey(state) {
  const d = clubById(state.clubId).div;
  if (!d) return 'amateur';
  const st = divDef(d).statut;
  return st === 'pro' ? d : st;
}

/* ---------- Agent ---------- */
function initPro(state) {
  state.pro = state.pro || {
    agent: null, sponsors: [], selection: { convoque: false, capes: 0, buts: 0, historique: [] },
    distinctions: [], transferts: [], mediatique: 0, europe: null,
  };
}

const AGENTS = [
  { k: 'debutant', n: 'Agent débutant', com: 0.05, force: 0.8, desc: "Peu de contacts, mais il prend peu." },
  { k: 'etabli', n: 'Agent établi', com: 0.08, force: 1.0, desc: 'Un carnet d’adresses correct dans le championnat.' },
  { k: 'influent', n: 'Agent influent', com: 0.12, force: 1.35, desc: 'Ouvre des portes en haut de tableau et à l’étranger.' },
];

function signerAgent(state, k) {
  const a = AGENTS.find(x => x.k === k);
  if (!a) return null;
  state.pro.agent = { ...a };
  log(state, `Vous confiez vos intérêts à un ${a.n.toLowerCase()} (commission ${Math.round(a.com * 100)} %).`, 'pro');
  return a;
}

/* ---------- Sponsors ---------- */
function majSponsors(state) {
  if (!estPro(state)) return [];
  initPro(state);
  const p = state.player;
  const dispo = CFG.PRO.sponsors.filter(s => p.reputation >= s.repMini && !state.pro.sponsors.find(x => x.k === s.k));
  const nouveaux = [];
  for (const s of dispo) {
    const montant = Math.round((s.base + (p.reputation - s.repMini) * s.parRep) / 100) * 100;
    state.pro.sponsors.push({ k: s.k, n: s.n, annuel: montant, saison: state.season });
    nouveaux.push({ n: s.n, annuel: montant });
    log(state, `Nouveau contrat de sponsoring : ${s.n} (${montant.toLocaleString('fr-FR')} € par an).`, 'pro');
  }
  return nouveaux;
}
function revenusSponsors(state) {
  if (!state.pro) return 0;
  return state.pro.sponsors.reduce((a, s) => a + s.annuel, 0);
}

/* ---------- Indemnité de transfert ----------
   Entre professionnels, un club ne signe plus librement : il verse une
   indemnité, et le joueur touche une prime à la signature dont l'agent
   prélève sa part. */
function indemniteTransfert(state, clubCible) {
  const p = state.player;
  const div = (clubCible && clubCible.div) || 'L2';
  const base = CFG.PRO.indemniteBase[div] || (divDef(div) && divDef(div).statut === 'pro' ? 900000 : 100000);
  const facteur = Math.pow(Math.max(1, p.niveau - 55) / 10, 2.2);
  const age = ageAt(p.naissance, currentDate(state));
  const ageF = age <= 21 ? 1.6 : age <= 25 ? 1.3 : age <= 29 ? 1.0 : age <= 32 ? 0.55 : 0.2;
  const repF = 0.7 + p.reputation / 130;
  return Math.round(base * facteur * ageF * repF / 10000) * 10000;
}

function primeSignature(state, clubCible) {
  const div = (clubCible && clubCible.div) || 'L2';
  const base = CFG.PRO.primeSignature[div] || (divDef(div) && divDef(div).statut === 'pro' ? 200000 : 0);
  const brut = Math.round(base * (0.7 + state.player.reputation / 90));
  const com = state.pro && state.pro.agent ? state.pro.agent.com : CFG.PRO.commissionAgent;
  return { brut, commission: Math.round(brut * com), net: Math.round(brut * (1 - com)) };
}

/* ---------- Sélection nationale ---------- */
const ADVERSAIRES_INTER = ['Allemagne', 'Espagne', 'Italie', 'Angleterre', 'Portugal', 'Pays-Bas', 'Belgique',
  'Croatie', 'Danemark', 'Suisse', 'Autriche', 'Écosse', 'Norvège', 'Serbie'];

function evaluerSelection(state) {
  return null;   // sélection nationale désactivée pour l'instant
  /* eslint-disable no-unreachable */
  if (!estPro(state)) return null;
  initPro(state);
  const p = state.player;
  const nat = NATIONALITES.find(n => n.k === p.nationalite);
  if (p.reputation < CFG.PRO.selectionRepMini || p.niveau < CFG.PRO.selectionNiveauMini) return null;
  if (state.pro.selection.convoque) return null;
  const rng = rngFrom(state.seed, 'selection', state.season);
  const chance = clamp((p.niveau - CFG.PRO.selectionNiveauMini) * 0.05 + (p.reputation - CFG.PRO.selectionRepMini) * 0.02, 0.05, 0.85);
  if (rng() > chance) return null;
  state.pro.selection.convoque = true;
  log(state, `Première convocation en équipe nationale (${nat ? nat.n : 'France'}).`, 'selection');
  return { pays: nat ? nat.n : 'France' };
}

/* Match international, joué à part du championnat. */
function jouerInternational(state) {
  const p = state.player;
  if (!state.pro || !state.pro.selection.convoque) return null;
  const rng = rngFrom(state.seed, 'inter', state.season, state.calIndex);
  const adv = pick(rng, ADVERSAIRES_INTER);
  const titulaire = rng() < clamp((p.niveau - 74) * 0.07 + 0.25, 0.15, 0.9);
  const minutes = titulaire ? ri(rng, 60, 90) : ri(rng, 10, 30);
  const perf = clamp(gauss(rng, 1 + (p.niveau - 80) / 60, 0.25), 0.4, 1.8);
  const buts = rng() < clamp((p.attrs.finition / 260) * (minutes / 90) * perf, 0, 0.4) ? 1 : 0;
  const note = round1(clamp(6 + (perf - 1) * 2 + buts * 1.1, 3, 9.5));
  state.pro.selection.capes++;
  state.pro.selection.buts += buts;
  state.pro.selection.historique.push({ saison: state.season, adversaire: adv, minutes, buts, note });
  p.reputation = clamp(p.reputation + 1.2 + buts * 1.5, 0, 100);
  p.fatigue = clamp(p.fatigue + minutes * 0.2, 0, 100);
  log(state, `Sélection : ${minutes}′ face à ${adv}${buts ? `, ${buts} but` : ''} (note ${note}).`, 'selection');
  return { adversaire: adv, minutes, buts, note, capes: state.pro.selection.capes };
}

/* ---------- Distinctions de fin de saison ---------- */
function distinctionsSaison(state) {
  const p = state.player, st = state.stats;
  const div = clubById(state.clubId).div || 'R2';
  const rng = rngFrom(state.seed, 'trophees', state.season);
  const age = ageAt(p.naissance, currentDate(state));
  const note = moyenneNote(st.notes) || 0;
  const res = [];
  /* Les seuils dépendent du niveau : être meilleur buteur de Ligue 1
     n'a rien à voir avec l'être en Régional 2. */
  const seuilButs = { R2: 14, R1: 15, N2: 15, N1: 16, L2: 18, L1: 20 }[div] || 19;
  const seuilPasses = { R2: 9, R1: 10, N2: 10, N1: 11, L2: 12, L1: 13 }[div] || 13;
  if (st.buts >= seuilButs && rng() < 0.8) res.push({ k: 'buteur', n: `Meilleur buteur de ${divDef(div).n}`, valeur: st.buts });
  if (st.passes_d >= seuilPasses && rng() < 0.7) res.push({ k: 'passeur', n: `Meilleur passeur de ${divDef(div).n}`, valeur: st.passes_d });
  if (note >= 7.4 && st.matchs >= 18 && rng() < 0.6) res.push({ k: 'joueur', n: `Joueur de la saison de ${divDef(div).n}`, valeur: note });
  if (age <= 21 && note >= 7.0 && st.matchs >= 15 && rng() < 0.7) res.push({ k: 'espoir', n: `Meilleur espoir de ${divDef(div).n}`, valeur: note });
  if (note >= 7.1 && st.matchs >= 15 && rng() < 0.55) res.push({ k: 'equipetype', n: `Équipe type de ${divDef(div).n}`, valeur: note });
  if (p.pos === 'GB' && st.clean_sheets >= 9 && rng() < 0.7) res.push({ k: 'gardien', n: `Meilleur gardien de ${divDef(div).n}`, valeur: st.clean_sheets });
  if (st.hommes_du_match >= 6 && rng() < 0.5) res.push({ k: 'homme', n: `Trophée du joueur le plus décisif`, valeur: st.hommes_du_match });
  if (divDef(div).statut === 'pro' && note >= 7.8 && st.matchs >= 22 && rng() < 0.35)
    res.push({ k: 'ballon', n: 'Trophée du meilleur joueur français', valeur: note });
  for (const d of res) {
    state.palmares.push({ saison: state.season, titre: d.n, club: clubById(state.clubId).n, individuel: true });
    p.reputation = clamp(p.reputation + 4, 0, 100);
    if (state.pro) state.pro.distinctions.push({ ...d, saison: state.season });
    log(state, `Distinction : ${d.n}.`, 'trophee');
  }
  return res;
}

/* ---------- Coupe d'Europe ----------
   Réservée aux clubs de Ligue 1 qualifiés la saison précédente. */
function construireEurope(state) {
  const club = clubById(state.clubId);
  if (!club.div || !state.competitionEurope) return null;
  const def = CFG.EUROPE.find(e => e.k === state.competitionEurope);
  if (!def) return null;
  /* La phase de ligue compte plusieurs journées, comme le format réel :
     un seul match ne suffisait pas. */
  const tours = [];
  /* Tours préliminaires inter-pays selon le coefficient du
     championnat d'origine. */
  for (const pre of construireBarragesEurope(state, def.k)) tours.push(pre);
  /* Une place qualificative (4e de Ligue 1, 7e pour la Conference)
     impose un tour de barrage supplémentaire avant la phase de ligue. */
  if (state.europePrelim === def.k) tours.push({ n: 'Barrage de qualification', rep: def.rep[0] - 2, prelim: true });
  for (let j = 1; j <= def.journees; j++) {
    tours.push({ n: `Phase de ligue — J${j}`, rep: def.rep[0], ligue: true, journee: j });
  }
  def.tours.slice(1).forEach((n, i) => {
    tours.push({ n, rep: Math.round(def.rep[0] + (def.rep[1] - def.rep[0]) * ((i + 1) / def.tours.length)) });
  });
  return {
    id: 'eu' + def.k + state.season, k: 'europe', europeK: def.k, nom: def.n, saison: state.season,
    tourCourant: 0, depart: 0, elimine: false, vainqueur: false, rangAtteint: null, matchs: [],
    europe: true,
    tours: tours.map((t, i) => ({ ...t, index: i, joue: false })),
  };
}

/* Qualification européenne : la place au classement détermine la
   compétition, comme dans la réalité. */
/* ---------- Phase de ligue : classement complet à 36 clubs ----------
   1er au 8e qualifiés directement pour les 8es, 9e au 24e en barrages,
   25e au 36e éliminés. Les 35 adversaires sont simulés avec leurs
   propres résultats, journée après journée.                         */
function initLigueEurope(state, coupe) {
  const rng = rngFrom(state.seed, 'ligueEu', state.season, coupe.k);
  const pool = CLUBS.filter(c => c.div && divDef(c.div).statut === 'pro' && c.id !== state.clubId)
    .sort((a, b) => b.rep - a.rep);
  const cible = coupe.k === 'ldc' ? 92 : coupe.k === 'el' ? 84 : 78;
  const choisis = pool
    .map(c => ({ c, d: Math.abs(c.rep - cible) }))
    .sort((a, b) => a.d - b.d).slice(0, 60)
    .sort(() => rng() - 0.5).slice(0, 35).map(x => x.c);
  coupe.ligue = {
    equipes: choisis.map(c => ({ id: c.id, pts: 0, j: 0, bp: 0, bc: 0, force: 40 + c.rep * 0.55 })),
    moi: { id: state.clubId, pts: 0, j: 0, bp: 0, bc: 0 },
  };
  return coupe.ligue;
}

function journeeLigueEurope(state, coupe, res) {
  if (!coupe.ligue) initLigueEurope(state, coupe);
  const L = coupe.ligue;
  const rng = rngFrom(state.seed, 'ligueEuJ', state.season, coupe.k, L.moi.j);
  /* Résultat du joueur */
  const gp = res ? res.gPour : 0, gc = res ? res.gContre : 0;
  L.moi.j++; L.moi.bp += gp; L.moi.bc += gc;
  L.moi.pts += gp > gc ? 3 : gp === gc ? 1 : 0;
  /* Les 35 autres s'affrontent entre eux */
  const melange = shuffled(rng, L.equipes);
  for (let i = 0; i + 1 < melange.length; i += 2) {
    const a = melange[i], b = melange[i + 1];
    const r = simAI(rng, a.force, b.force);
    a.j++; b.j++; a.bp += r.gh; a.bc += r.ga; b.bp += r.ga; b.bc += r.gh;
    if (r.gh > r.ga) a.pts += 3; else if (r.gh < r.ga) b.pts += 3; else { a.pts++; b.pts++; }
  }
  return classementLigueEurope(state, coupe);
}

function classementLigueEurope(state, coupe) {
  if (!coupe.ligue) return [];
  const L = coupe.ligue;
  const tout = L.equipes.map(e => ({ id: e.id, pts: e.pts, j: e.j, bp: e.bp, bc: e.bc, moi: false }))
    .concat([{ id: L.moi.id, pts: L.moi.pts, j: L.moi.j, bp: L.moi.bp, bc: L.moi.bc, moi: true }]);
  tout.sort((a, b) => b.pts - a.pts || (b.bp - b.bc) - (a.bp - a.bc) || b.bp - a.bp);
  return tout.map((x, i) => ({ ...x, rang: i + 1,
    sort: i < 8 ? 'huitiemes' : i < 24 ? 'barrages' : 'elimine' }));
}

/* Qualification européenne selon le championnat ET la place, comme
   dans la réalité : trois places directes en Ligue des champions pour
   la Ligue 1, quatre pour la Premier League, une seule en Belgique. */
function qualificationEurope(state, rang) {
  const club = clubById(state.clubId);
  if (!club.div) return null;
  const grille = CFG.QUALIF_EUROPE[club.div];
  if (!grille) return null;
  /* Ordre d'examen : qualification directe, puis tours préliminaires. */
  for (const k of ['ldc', 'ldcPlayoff', 'el', 'ecl', 'eclBarrage']) {
    const p = grille[k];
    if (p && rang >= p[0] && rang <= p[1]) {
      if (k === 'ldcPlayoff') { state.europePrelim = 'ldc'; return 'ldc'; }
      if (k === 'eclBarrage') { state.europePrelim = 'ecl'; return 'ecl'; }
      state.europePrelim = null;
      return k;
    }
  }
  return null;
}
/* Récapitulatif des places européennes d'un championnat, à afficher
   dans le classement. */
function placesEurope(divKey) {
  const g = CFG.QUALIF_EUROPE[divKey];
  if (!g) return [];
  const noms = { ldc: 'Ligue des champions', el: 'Europa League', ecl: 'Conference League' };
  return ['ldc', 'el', 'ecl'].filter(k => g[k]).map(k => ({ k, n: noms[k], de: g[k][0], a: g[k][1] }));
}

/* ---------- Conférences de presse ---------- */
const CONFERENCES = [
  { k: 'avant_derby', titre: "Conférence d'avant-match",
    texte: "Un journaliste vous demande si votre équipe est capable de gagner ce week-end.",
    choix: [
      { n: 'Afficher de la confiance', eff: s => { s.player.moral += 5; s.player.reputation = clamp(s.player.reputation + 1.5, 0, 100); s.player.cote -= 1; return "La déclaration fait la une locale. Il faudra assumer sur le terrain."; } },
      { n: 'Rester mesuré', eff: s => { s.player.cote += 2; return "Réponse classique, personne n'en fera un titre."; } },
    ] },
  { k: 'critique', titre: 'Critiqué par un consultant',
    texte: "Un ancien joueur devenu consultant juge votre niveau insuffisant pour ce championnat.",
    choix: [
      { n: 'Répondre publiquement', eff: s => { const r = rngFrom(s.seed, 'cp', s.season, s.calIndex)(); if (r < 0.5) { s.player.reputation = clamp(s.player.reputation + 3, 0, 100); s.player.moral += 4; return "La réponse tourne en boucle, le vestiaire vous soutient."; } s.player.cote -= 4; s.player.moral -= 3; return "Le club n'apprécie pas cette sortie médiatique."; } },
      { n: 'Ignorer', eff: s => { s.player.cote += 2; s.player.moral -= 2; return "Vous encaissez sans répondre."; } },
    ] },
  { k: 'avenir', titre: 'Questionné sur votre avenir',
    texte: "On vous interroge sur des rumeurs de départ vers un club plus huppé.",
    choix: [
      { n: "Se dire ouvert à tout", eff: s => { s.player.reputation = clamp(s.player.reputation + 2.5, 0, 100); s.player.cote -= 5; if (s.interets) for (const id in s.interets) s.interets[id] = clamp(s.interets[id] + 8, 0, 100); return "Les prétendants se manifestent, le club fait la moue."; } },
      { n: "Afficher sa fidélité", eff: s => { s.player.cote += 6; s.player.moral += 3; return "Les supporters apprécient, le club aussi."; } },
    ] },
];

function tirerConference(state) {
  if (!estPro(state)) return null;
  const rng = rngFrom(state.seed, 'conf', state.season, state.calIndex);
  if (rng() > 0.16) return null;
  const c = pick(rng, CONFERENCES);
  return { k: c.k, titre: c.titre, texte: c.texte, conference: true, choix: c.choix.map((x, i) => ({ i, n: x.n })) };
}
function repondreConference(state, k, idx) {
  const c = CONFERENCES.find(x => x.k === k);
  if (!c || !c.choix[idx]) return null;
  const t = c.choix[idx].eff(state);
  const p = state.player;
  p.cote = clamp(p.cote, 0, 100); p.moral = clamp(p.moral, 0, 100);
  log(state, `${c.titre} — ${t}`, 'presse');
  return t;
}


/* ============================================================
   CAREER — état, échéances, mercato, sauvegardes
   ============================================================ */

const SAVE_PREFIX = 'trajectoire_slot_';

function newStats() {
  return { matchs: 0, titularisations: 0, entrees: 0, non_utilise: 0, minutes: 0, buts: 0, passes_d: 0,
    notes: [], tirs: 0, tirs_cadres: 0, passes: 0, passes_reussies: 0, duels: 0, duels_gagnes: 0,
    tacles: 0, interceptions: 0, jaunes: 0, rouges: 0, arrets: 0, clean_sheets: 0, buts_encaisses: 0,
    hommes_du_match: 0, am_matchs: 0, am_minutes: 0, am_buts: 0, am_passes_d: 0 };
}

function newCareer(opts) {
  resetDivisions();
  const seed = opts.seed || String(Date.now());
  const state = {
    seed, slot: opts.slot ?? 0,
    season: 1, seasonStartYear: opts.startYear, week: 0, calIndex: 0, matchIndex: 0,
    player: opts.player || null,
    clubId: opts.clubId || null, leagues: {}, calendar: [], tournoisPlan: [],
    stats: newStats(), historique: [], palmares: [], journal: [], saisons: [],
    tournois: [], cartons: 0, training: 'technique', divDepart: opts.division,
    actions: {}, offres: [], interets: {},
    contrat: null, finances: null, objectifs: [], reveles: [], presse: [], evtVus: [],
    sansContrat: false, evenement: null, renouvellement: null,
    coupes: [], coupesHisto: [], retraite: false, retraiteRaison: null,
    achats: [], choixEnCours: null, choixVus: [], prochainChoix: 5, ecarte: 0, tutoVu: false,
  };
  if (!state.player) state.player = createPlayer({ ...opts, seed });
  for (const d of CFG.DIVISIONS) state.leagues[d.k] = initLeague(state, d.k);
  if (!state.clubId) state.clubId = clubsOf(opts.division)[0].id;
  state.calendar = buildCalendar(state);
  resetActions(state);
  initFinances(state);
  initPro(state);
  majSponsors(state);
  state.concurrent = genConcurrent(state);
  state.contrat = nouveauContrat(state, { statut: 'concurrence' });
  setObjectifs(state);
  log(state, `Vous signez à ${clubById(state.clubId).n} (${divDef(opts.division).n}) : ${state.contrat.duree} saison(s), ${state.contrat.salaire} € par mois.`, 'contrat');
  return state;
}

function resetActions(state) {
  state.actions = {};
  for (const a of CFG.ACTIONS) state.actions[a.k] = a.uses;
}

function log(state, texte, type) {
  state.journal.unshift({ s: state.season, w: state.week, texte, type: type || 'info' });
  if (state.journal.length > 150) state.journal.pop();
}

function currentLeague(state) { return state.leagues[clubById(state.clubId).div]; }
/* Statut du joueur : amateur jusqu'au National 3, semi-professionnel
   à partir du National 2. Ce statut change concrètement le quotidien. */
function statutJoueur(state) {
  const c = clubById(state.clubId);
  return c && c.div ? divDef(c.div).statut : 'amateur';
}
function semiPro(state) { return statutJoueur(state) === 'semipro'; }
function modSP(state, cle) {
  const t = CFG.SEMIPRO[cle];
  return t ? t[statutJoueur(state)] : 1;
}
function nextEntry(state) { return state.calendar[state.calIndex] || null; }
function tournoiById(state, id) { return state.tournoisPlan.find(t => t.id === id) || state.tournois.find(t => t.id === id); }
function currentDate(state) { return weekToDate(state.seasonStartYear, Math.min(state.week, 45)); }

function coteTarget(state) {
  const p = state.player, club = clubById(state.clubId);
  const age = ageAt(p.naissance, currentDate(state));
  let t = 48 + (p.niveau - divDef(club.div).standard) * 2.1;
  /* Un club amateur fait jouer ses jeunes, même en retard physiquement :
     sans ce plancher, un joueur de 16 ans ne sort jamais du banc et ne
     progresse donc jamais. */
  if (age <= 20) t = Math.max(t + 10, 26);
  else if (age >= 33) t -= 5;
  t += (p.forme - 50) * 0.16 + p.reputation * 0.12 + (p.hidden.professionnalisme - 50) * 0.06;
  t += state.coteBonus || 0;
  if (p.blessure) t -= 12;
  return clamp(t, 4, 96);
}

/* ---------- Actions de vestiaire ---------- */
function doAction(state, key) {
  const a = CFG.ACTIONS.find(x => x.k === key);
  if (!a || (state.actions[key] || 0) <= 0) return null;
  const p = state.player;
  const rng = rngFrom(state.seed, 'action', state.season, state.calIndex, key);
  state.actions[key]--;
  let cote = a.cote, texte;
  if (key === 'coach') {
    /* L'entraîneur écoute surtout ceux qui répondent sur le terrain. */
    const credit = (p.forme - 50) / 20 + (p.hidden.professionnalisme - 50) / 25 + (moyenneNote(state.stats.notes) ? (moyenneNote(state.stats.notes) - 6) * 2 : 0);
    if (credit < -1 && rng() < 0.45) {
      cote = -4;
      texte = "L'entraîneur vous renvoie à vos performances. L'entretien s'est mal passé.";
    } else texte = "L'entraîneur retient votre demande : vous aurez votre chance.";
  } else if (key === 'extra') {
    p.fatigue = clamp(p.fatigue + a.fatigue, 0, 100);
    texte = 'Séances supplémentaires effectuées. Le staff a noté votre investissement.';
  } else {
    texte = 'Séance vidéo avec un adjoint : votre lecture du jeu progresse.';
  }
  state.coteBonus = (state.coteBonus || 0) + Math.max(0, cote) * 0.35;
  p.cote = clamp(p.cote + cote, 0, 100);
  p.moral = clamp(p.moral + a.moral, 0, 100);
  log(state, texte, 'coach');
  return { texte, cote };
}

/* ---------- Recrutement ----------
   Les clubs ne tombent pas du ciel : un recruteur doit d'abord vous
   voir jouer. Chaque match observé fait monter l'intérêt du club,
   d'autant plus si vous avez été bon et si le club a besoin de votre
   profil. En dessous du seuil, aucune offre n'est formulée — un
   joueur qui n'a disputé aucun match n'intéresse personne.        */
function matchsCarriere(state) {
  return state.saisons.reduce((s, b) => s + b.stats.matchs, 0) + state.stats.matchs;
}

function observerRecruteurs(state, res) {
  const p = state.player;
  state.interets = state.interets || {};
  /* Sans temps de jeu, l'intérêt retombe. */
  if (res.minutes <= 0) {
    for (const id in state.interets) state.interets[id] = Math.max(0, state.interets[id] - CFG.MERCATO.declinInteret * 0.5);
    return [];
  }
  const rng = rngFrom(state.seed, 'scout', state.season, state.calIndex);
  const monClub = clubById(state.clubId);
  const nouveaux = [];
  /* Les recruteurs qui se déplacent sont ceux dont le club correspond
     à peu près à votre niveau : un club de National ne suit pas un
     joueur de Régional 2, mais il suit un joueur qui domine le
     Régional 1. Le tirage est donc pondéré, pas uniforme.          */
  const pool = CLUBS.filter(c => c.id !== state.clubId && c.div).map(c => {
    const std = divDef(c.div).standard;
    return { c, w: 1 / (1 + Math.abs(std - p.niveau) * 0.30) };
  });
  const candidats = [];
  for (let i = 0; i < 3 && pool.length; i++) {
    const choisi = weightedPick(rng, pool, 'w');
    if (!candidats.includes(choisi.c)) candidats.push(choisi.c);
  }
  /* Coup d'éclat : une très grosse performance peut faire venir un
     recruteur d'un tout autre niveau, même depuis le Régional. C'est
     rare, mais ça arrive — et c'est comme ça que des joueurs sortent
     de nulle part. */
  const eclat = (res.note - 6.8) * 0.16 + res.buts * 0.09 + res.passes_d * 0.05 + (res.homme ? 0.09 : 0);
  if (res.note >= 7.0 && rng() < clamp(eclat, 0, 0.55)) {
    const gros = CLUBS.filter(c => c.div && divDef(c.div).niv > divDef(monClub.div || 'R2').niv && c.reg !== 'EU');
    if (gros.length) {
      const g = pick(rng, gros);
      if (!candidats.includes(g)) { candidats.push(g); state.interets[g.id] = Math.max(state.interets[g.id] || 0, 26); }
    }
  }
  for (const c of candidats) {
    const std = c.div ? divDef(c.div).standard : 52;
    const ecart = p.niveau - std;
    /* Un club ne se déplace que pour un profil qui le concerne. */
    let chance = (CFG.MERCATO.observationBase + p.reputation / 320) * modSP(state, 'recruteursMul');
    if (ecart < -10) chance *= 0.4;
    if (c.rep > monClub.rep + 12) chance *= 0.6;
    if (rng() > chance) continue;
    const perf = (res.note - 6.1) * 7 + res.buts * 6 + res.passes_d * 3.5 + (res.homme ? 7 : 0) + clamp(ecart, -8, 12) * 1.4;
    const avant = state.interets[c.id] || 0;
    const apres = clamp(avant + clamp(perf, -6, 22) + bonusCible(state, c.id), 0, CFG.MERCATO.interetMax);
    state.interets[c.id] = apres;
    if (avant < CFG.MERCATO.seuilInteret && apres >= CFG.MERCATO.seuilInteret) {
      nouveaux.push(c.id);
      log(state, `${c.n} suit votre situation de près.`, 'interet');
    }
  }
  return nouveaux;
}

/* Offres formulées au mercato, uniquement sur intérêt établi. */
function genOffres(state, fenetre) {
  const p = state.player;
  const rng = rngFrom(state.seed, 'offres', state.season, fenetre);
  if (matchsCarriere(state) < CFG.MERCATO.matchsMini && !state.sansContrat) return [];
  if (p.reputation < CFG.MERCATO.reputationMini && !state.sansContrat) return [];
  const offres = [];
  const interets = state.interets || {};
  const classes = Object.keys(interets).sort((a, b) => interets[b] - interets[a]);
  for (const id of classes) {
    if (interets[id] < CFG.MERCATO.seuilInteret) continue;
    const c = clubById(id);
    if (!c || c.id === state.clubId) continue;
    /* Un club sous contrat ne recrute pas systématiquement : il faut
       aussi qu'il ait une place à offrir. */
    if (!state.sansContrat && rng() > 0.75) continue;
    const std = c.div ? divDef(c.div).standard : 52;
    const ecart = p.niveau - std;
    /* Rejoindre un club nettement au-dessus de son niveau, c'est
       accepter un rôle de rotation, voire de doublure. */
    const statut = ecart > 8 ? 'titulaire' : ecart > 1 ? 'rotation' : ecart > -6 ? 'rotation' : 'concurrence';
    offres.push({ clubId: c.id, div: c.div, statut, interet: Math.round(interets[c.id]),
      coteDepart: statut === 'titulaire' ? 66 : statut === 'rotation' ? 50 : 38,
      salaire: salaireEstime(c.div || 'R2', p.niveau, statut),
      duree: 1 + Math.floor(rng() * 3) });
    if (offres.length >= 4) break;
  }
  /* Chaque fenêtre apporte au moins deux propositions : à défaut de
     prétendants sérieux, des clubs d'un niveau comparable tentent leur
     chance. */
  if (matchsCarriere(state) >= CFG.MERCATO.matchsMini || state.sansContrat) {
    const dejaLa = new Set(offres.map(o => o.clubId));
    /* Les clubs sollicitants correspondent au niveau ATTEINT : un
       triple Ballon d'Or ne reçoit plus des offres de deuxième
       division. Et la liste change à chaque fenêtre. */
    const seuilMini = p.reputation > 70 ? p.niveau - 12 : p.reputation > 45 ? p.niveau - 16 : 0;
    const proches = CLUBS.filter(c => c.div && c.id !== state.clubId && !dejaLa.has(c.id) &&
      divDef(c.div).standard >= seuilMini && Math.abs(divDef(c.div).standard - p.niveau) <= 12);
    const secours = shuffled(rng, proches.length ? proches : CLUBS.filter(c => c.div && c.id !== state.clubId && !dejaLa.has(c.id)));
    /* Les clubs déjà proposés lors des deux dernières fenêtres passent
       en fin de liste pour éviter la répétition. */
    const recents = new Set(state.offresRecentes || []);
    secours.sort((a, b) => (recents.has(a.id) ? 1 : 0) - (recents.has(b.id) ? 1 : 0));
    state.offresRecentes = (state.offresRecentes || []).slice(0, 8);
    while (offres.length < CFG.MERCATO.offresMini && secours.length) {
      const c = pick(rng, secours);
      secours.splice(secours.indexOf(c), 1);
      const ecart = p.niveau - divDef(c.div).standard;
      const statut = ecart > 8 ? 'titulaire' : ecart > -6 ? 'rotation' : 'concurrence';
      offres.push({ clubId: c.id, div: c.div, statut, interet: Math.round(interets[c.id] || CFG.MERCATO.seuilInteret),
        coteDepart: statut === 'titulaire' ? 64 : statut === 'rotation' ? 48 : 36,
        salaire: salaireEstime(c.div, p.niveau, statut), duree: 1 + Math.floor(rng() * 3) });
      state.offresRecentes = [c.id].concat(state.offresRecentes || []).slice(0, 10);
    }
  }
  return offres;
}

function signer(state, offre) {
  const c = clubById(offre.clubId);
  const ancien = clubById(state.clubId).n;
  state.clubId = offre.clubId;
  state.player.cote = offre.coteDepart;
  state.player.moral = clamp(state.player.moral + 6, 0, 100);
  state.offres = [];
  log(state, `Transfert : ${ancien} → ${c.n}${c.div ? ' (' + divDef(c.div).n + ')' : ''}.`, 'club');
  state.renouvellement = null;
  /* Si le club n'est dans aucune des deux poules, il rejoint la poule
     correspondant à sa réputation pour rester jouable. */
  if (!c.div) {
    const cible = c.rep >= 30 ? 'R1' : 'R2';
    const sortant = standings(state.leagues[cible]).slice(-1)[0];
    const s = clubById(sortant.id);
    s.div = null; c.div = cible;
    state.leagues[cible].table[c.id] = { ...state.leagues[cible].table[sortant.id], id: c.id, force: clubStrength(state, c.id) };
    delete state.leagues[cible].table[sortant.id];
    for (const day of state.leagues[cible].fixtures) for (const m of day) {
      if (m.h === sortant.id) m.h = c.id;
      if (m.a === sortant.id) m.a = c.id;
    }
  }
  signerContrat(state, { clubId: offre.clubId, salaire: offre.salaire || salaireEstime(c.div || 'R2', state.player.niveau, offre.statut),
    duree: offre.duree || 1, statut: offre.statut || 'concurrence', coteDepart: offre.coteDepart });
  /* Entre clubs professionnels, le transfert a un prix et le joueur
     touche une prime à la signature, commission d'agent déduite. */
  if (statutDiv(c.div) === 'pro') {
    initPro(state);
    const indem = indemniteTransfert(state, c);
    const prime = primeSignature(state, c);
    state.finances.solde += prime.net; state.finances.total += prime.net; state.finances.saisonPrimes += prime.net;
    state.pro.transfertRecent = { clubId: c.id, indemnite: indem, prime, saison: state.season };
    state.pro.transferts.push(state.pro.transfertRecent);
    log(state, `Transfert vers ${c.n} pour ${(indem / 1000).toLocaleString('fr-FR')} k€. Prime à la signature : ${prime.net.toLocaleString('fr-FR')} € nets.`, 'pro');
  }
  state.concurrent = genConcurrent(state);
  majSponsors(state);
  setObjectifs(state);
  /* Nouveau club = nouvelles compétitions : les coupes engagées et les
     échéances correspondantes sont reconstruites, sinon on se
     retrouvait à jouer un tournoi avec son ancien club. */
  state.coupes = buildCoupes(state);
  state.calendar = state.calendar.filter(e => e.type !== 'coupe' && e.type !== 'tournoi');
  let w = state.week + 3;
  for (const c of state.coupes) {
    state.calendar.push({ type: 'coupe', cid: c.id, tour: c.depart, w, label: `${c.nom} — ${c.tours[c.depart].n}` });
    w += 2;
  }
  state.calendar.sort((a, b) => a.w - b.w);
  state.calIndex = Math.max(0, state.calendar.findIndex(e => e.w >= state.week));
  return true;
}

/* ---------- Semaines entre deux échéances ---------- */
function passWeeks(state, nWeeks, out) {
  const p = state.player;
  const tr = CFG.TRAINING.find(t => t.k === state.training) || CFG.TRAINING[2];
  for (let i = 0; i < nWeeks; i++) {
    state.week++;
    /* Le semi-professionnel s'entraîne tous les jours : plus de charge,
       mais un staff qui récupère mieux. */
    p.fatigue = clamp(p.fatigue + tr.fatigue * 0.5 * modSP(state, 'fatigueMul') - 7 * modSP(state, 'qualiteStaff'), 0, 100);
    if (p.blessure) {
      p.blessure.semaines--;
      if (p.blessure.semaines <= 0) { out.events.push({ t: 'ok', texte: 'Retour de blessure : vous êtes apte.' }); p.blessure = null; }
    }
    const rng = rngFrom(state.seed, 'week', state.season, state.week);
    const q = (0.75 + clubById(state.clubId).rep / 170) * modSP(state, 'qualiteStaff');
    const perf = gauss(rng, 0, 1) + (p.hidden.professionnalisme - 50) / 45 + (q - 1) * 1.2;
    p.cote = clamp(p.cote + (coteTarget(state) - p.cote) * 0.15 + perf * 0.5, 0, 100);
    p.forme = clamp(p.forme + (q - 0.95) * 2 + perf * 0.6, 0, 100);
    state.coteBonus = (state.coteBonus || 0) * 0.75;
    verserSalaire(state, 1);
    preleverEntretien(state, 1);
    /* Effets durables de ce que le joueur a investi dans son quotidien. */
    const eco = effetsEconomie(state);
    p.fatigue = clamp(p.fatigue + (eco.fatigueSemaine || 0), 0, 100);
    p.forme = clamp(p.forme + (eco.formeSemaine || 0), 0, 100);
    p.moral = clamp(p.moral + (eco.moralSemaine || 0), 0, 100);
    p.reputation = clamp(p.reputation + (eco.reputationSemaine || 0), 0, 100);
    p.cote = clamp(p.cote + (eco.coteSemaine || 0), 0, 100);
    if (state.ecarte > 0) { state.ecarte--; p.cote = clamp(p.cote - 1, 0, 100); }
    if (!p.blessure) maybeInjury(state, out, rng);
  }
}

const BLESSURES = [
  { n: 'lésion musculaire', min: 2, max: 5, w: 30 },
  { n: 'entorse de la cheville', min: 2, max: 6, w: 22 },
  { n: 'contusion', min: 1, max: 2, w: 26 },
  { n: 'déchirure', min: 6, max: 12, w: 8 },
  { n: 'blessure au genou', min: 8, max: 20, w: 4 },
  { n: 'fracture', min: 10, max: 18, w: 3 },
];
function maybeInjury(state, out, rng) {
  const p = state.player;
  const chance = 0.0042 * ((p.fatigue / 100) * 0.8 + 0.25) * (0.5 + p.hidden.fragilite / 100) * 3;
  if (rng() < chance) {
    const b = weightedPick(rng, BLESSURES, 'w');
    const recup = modSP(state, 'recuperationBlessure') * (effetsEconomie(state).recuperation || 1);
    p.blessure = { n: b.n, semaines: Math.max(1, Math.round(ri(rng, b.min, b.max) * recup)) };
    p.moral = clamp(p.moral - 12, 0, 100);
    log(state, `Blessure : ${b.n}, ${p.blessure.semaines} semaine(s).`, 'blessure');
    out.events.push({ t: 'bad', texte: `Blessure : ${b.n} (${p.blessure.semaines} sem.)` });
  }
}

/* ---------- Ouvrir / fermer une fenêtre de mercato ---------- */
function ouvrirMercato(state) {
  const e = nextEntry(state);
  if (!e || e.type !== 'mercato') return null;
  if (!state.offres || !state.offres.length) state.offres = genOffres(state, e.fenetre);
  return e;
}
function fermerMercato(state) {
  const e = nextEntry(state);
  if (e && e.type === 'mercato') { state.calIndex++; state.week = Math.max(state.week, e.w); state.offres = []; save(state); }
}

/* ---------- Jouer la prochaine échéance ---------- */
function playNext(state) {
  const out = { events: [], matchs: [], tournoi: null, tour: null, journee: null, seasonEnd: null, barrage: null, coupe: null };
  if (state.retraite) return out;
  /* Garde-fou : si la division du club ne correspond plus au calendrier
     en cours (transfert en cours de saison), on le reconstruit. */
  const lg = currentLeague(state);
  const maxJ = lg && lg.fixtures ? lg.fixtures.length : 0;
  if (state.calendar.some(e => e.type === 'championnat' && e.journee > maxJ)) {
    state.calendar = state.calendar.filter(e => e.type !== 'championnat' || e.journee <= maxJ);
    state.calIndex = Math.min(state.calIndex, Math.max(0, state.calendar.length - 1));
  }
  const entry = nextEntry(state);
  if (!entry) { finishSeason(state, out); return out; }
  if (entry.type === 'mercato') { fermerMercato(state); return playNext(state); }

  passWeeks(state, Math.max(0, entry.w - state.week), out);
  state.matchIndex++;

  if (entry.type === 'championnat') {
    const league = currentLeague(state);
    const fixture = playJournee(state, league, entry.journee, state.clubId);
    for (const d of CFG.DIVISIONS) if (d.k !== league.div) playJournee(state, state.leagues[d.k], entry.journee, null);
    if (fixture) {
      const res = simMatch(state, fixture, { tag: 'championnat', journee: entry.journee, tag2: entry.journee,
        date: fmtDate(currentDate(state)) });
      applyMatch(state, res);
      applyResult(league.table, fixture.h, fixture.a, res.home ? res.gPour : res.gContre, res.home ? res.gContre : res.gPour);
      res.primes = verserPrimes(state, res);
      out.presse = pressAfterMatch(state, res);
      out.observations = observerRecruteurs(state, res);
      majClassementButeurs(state);
      out.matchs.push(res);
      if (res.role === 'suspendu') state.player.suspension = 0;
    }
    out.journee = entry.journee;
  } else if (entry.type === 'coupe') {
    const c = coupeById(state, entry.cid);
    if (!c || c.elimine || c.tours[entry.tour].joue) { state.calIndex++; return playNext(state); }
    jouerTourCoupe(state, c, entry.tour, out);
    /* Qualifié : le tour suivant est programmé maintenant. */
    if (!c.elimine && !c.vainqueur && entry.tour + 1 < c.tours.length) {
      const prochaines = state.calendar.filter(x => x.w > entry.w).map(x => x.w);
      let w = entry.w + 2;
      while (prochaines.includes(w)) w++;
      state.calendar.push({ type: 'coupe', cid: c.id, tour: entry.tour + 1, w,
        label: `${c.nom} — ${c.tours[entry.tour + 1].n}` });
      state.calendar.sort((a, b) => a.w - b.w);
      /* L'index courant doit suivre le tri. */
      state.calIndex = state.calendar.findIndex(x => x === entry);
    }
  } else if (entry.type === 'tournoi') {
    const T = tournoiById(state, entry.tid);
    if (T) { out.tournoi = jouerTourTournoi(state, T, entry.tour, out); out.tour = entry.tour; }
  } else if (entry.type === 'barrage') {
    const duel = entry.duel;
    const fixture = { h: duel.clubHaut, a: duel.clubBas };
    const res = simMatch(state, fixture, { tag: 'barrage', label: "Barrage d'accession", tag2: 'barrage',
      date: fmtDate(currentDate(state)) });
    applyMatch(state, res);
    res.primes = verserPrimes(state, res);
    let gh = res.home ? res.gPour : res.gContre, ga = res.home ? res.gContre : res.gPour;
    let tab = false, tabScore = null;
    if (gh === ga) {
      tab = true;
      const rb = rngFrom(state.seed, 'btab', state.season);
      const x = ri(rb, 3, 5), y = ri(rb, 1, x - 1);
      if (rb() < 0.5) { gh++; tabScore = `${x}-${y}`; } else { ga++; tabScore = `${y}-${x}`; }
    }
    state.barrage = { ...duel, gh, ga, tab, tabScore, vainqueur: gh > ga ? duel.clubHaut : duel.clubBas, perso: res };
    out.matchs.push(res);
    out.barrage = state.barrage;
    log(state, state.barrage.vainqueur === state.clubId ? 'Barrage remporté.' : 'Barrage perdu.', 'club');
  }
  out.revelations = checkScouting(state);
  const ch = choixDu(state);
  if (ch) out.choix = ch;
  out.sponsors = majSponsors(state);
  if (estPro(state)) {
    const conv = evaluerSelection(state);
    if (conv) out.selection = { premiere: true, pays: conv.pays };
    if (state.pro.selection.convoque && state.calIndex % 7 === 3) {
      const inter = jouerInternational(state);
      if (inter) out.international = inter;
    }
  }
  if (!state.evenement) {
    const conf = tirerConference(state);
    const e = conf || tirerEvenement(state);
    if (e) { state.evenement = e; out.evenement = e; }
  }
  state.calIndex++;
  /* Le barrage se glisse après la dernière journée, seulement si le
     club du joueur est concerné : il se joue alors comme un match. */
  if (!nextEntry(state) && !state.barrage && !state.barrageAjoute) {
    const duel = barrageDuel(state);
    if (duel) {
      state.barrageAjoute = true;
      state.calendar.push({ type: 'barrage', duel, w: state.week + 2, label: "Barrage d'accession" });
    }
  }
  if (!nextEntry(state)) finishSeason(state, out);
  save(state);
  return out;
}

/* Réponse à un événement en cours. */
function choisirEvenement(state, idx) {
  if (!state.evenement) return null;
  const texte = state.evenement.conference
    ? repondreConference(state, state.evenement.k, idx)
    : repondreEvenement(state, state.evenement.k, idx);
  state.evenement = null;
  save(state);
  return texte;
}

/* Un seul tour de tournoi par échéance. */
function jouerTourTournoi(state, T, ti, out) {
  const rng = rngFrom(state.seed, 'tsim', state.season, T.id, ti);
  const tour = T.tours[ti];
  if (!tour) return T;
  if (ti > 0) {
    const q = T.tours[ti - 1].matchs.map(m => m.vainqueur);
    if (!tour.matchs.length) tour.matchs = [{ h: q[0], a: q[1], joue: false }];
  }
  for (const m of tour.matchs) {
    if (m.joue) continue;
    const mien = m.h === state.clubId || m.a === state.clubId;
    if (mien) {
      const res = simMatch(state, m, { tag: 'amical', amical: true, label: `${T.nom} — ${tour.nom}`, tag2: T.id + ti,
        date: fmtDate(currentDate(state)) });
      applyMatch(state, res);
      m.gh = res.home ? res.gPour : res.gContre;
      m.ga = res.home ? res.gContre : res.gPour;
      m.note = res.note; m.minutes = res.minutes; m.role = res.role; m.buts = res.buts;
      res.primes = verserPrimes(state, res);
      out.matchs.push(res);
    } else {
      const r = simAI(rng, forceOf(state, m.h), forceOf(state, m.a));
      m.gh = r.gh; m.ga = r.ga;
    }
    if (m.gh === m.ga) { m.tab = true; if (rng() < 0.5) m.gh++; else m.ga++; }
    m.joue = true;
    m.vainqueur = m.gh > m.ga ? m.h : m.a;
  }
  const dernier = ti === T.tours.length - 1;
  if (dernier) {
    const fin = T.tours[T.tours.length - 1].matchs[0];
    T.termine = true; T.vainqueur = fin.vainqueur;
    T.rang = fin.vainqueur === state.clubId ? 1 : (fin.h === state.clubId || fin.a === state.clubId) ? 2 : 3;
    if (!state.tournois.find(x => x.id === T.id)) state.tournois.push(T);
    if (T.vainqueur === state.clubId) {
      state.palmares.push({ saison: state.season, titre: T.nom, club: clubById(state.clubId).n });
      log(state, `${clubById(state.clubId).n} remporte le ${T.nom}.`, 'trophee');
    }
  } else if (!state.tournois.find(x => x.id === T.id)) state.tournois.push(T);
  return T;
}

/* ---------- Fin de saison, barrage compris ---------- */
function finishSeason(state, out) {
  const p = state.player;
  const league = currentLeague(state);
  const tab = standings(league);
  const rang = tab.findIndex(t => t.id === state.clubId) + 1;
  const club = clubById(state.clubId);
  const divAvant = club.div;

  const barrage = state.barrage || null;
  if (barrage) out.barrage = barrage;

  const bilan = {
    saison: state.season, annee: `${state.seasonStartYear}/${String(state.seasonStartYear + 1).slice(2)}`,
    club: club.n, clubId: club.id, division: divDef(divAvant).n, rang,
    stats: JSON.parse(JSON.stringify(state.stats)),
    note: moyenneNote(state.stats.notes),
    niveau: p.niveau, niveauXp: p.niveauXp, reputation: Math.round(p.reputation),
    age: ageAt(p.naissance, currentDate(state)),
    classement: tab.map(t => ({ id: t.id, pts: t.pts, j: t.j, g: t.g, n: t.n, p: t.p, bp: t.bp, bc: t.bc })),
    tournois: state.tournois.filter(t => t.saison === state.season).map(t => ({ nom: t.nom, rang: t.rang })),
    coupes: (state.coupes || []).map(c => ({ nom: c.nom, rang: c.rangAtteint || 'non disputée', vainqueur: c.vainqueur,
      matchs: c.matchs.length })),
    barrage: barrage ? { clubBas: barrage.clubBas, clubHaut: barrage.clubHaut, gh: barrage.gh, ga: barrage.ga,
      vainqueur: barrage.vainqueur, tab: !!barrage.tab, tabScore: barrage.tabScore || null } : null,
    matchsDetail: state.historique.filter(h => h.tag === 'championnat' || h.tag === 'barrage').map(h => ({
      journee: h.journee, tag: h.tag, adversaire: h.adversaire, home: h.home, gPour: h.gPour, gContre: h.gContre,
      minutes: h.minutes, note: h.note, buts: h.buts, passes_d: h.passes_d, role: h.role, date: h.date })),
  };
  if (rang === 1) state.palmares.push({ saison: state.season, titre: `Champion de ${divDef(divAvant).n}`, club: club.n });

  state.coupesHisto = (state.coupesHisto || []).concat(state.coupes || []);
  const bilanObj = evalObjectifs(state);
  bilan.objectifs = bilanObj.objectifs;
  bilan.objectifsReussis = bilanObj.reussis;
  bilan.primeObjectifs = bilanObj.prime;
  bilan.finances = state.finances ? { salaires: state.finances.saisonSalaires, primes: state.finances.saisonPrimes,
    total: state.finances.saisonSalaires + state.finances.saisonPrimes, solde: state.finances.solde } : null;
  bilan.contrat = state.contrat ? { salaire: state.contrat.salaire, restant: state.contrat.restant - 1, duree: state.contrat.duree } : null;

  const eos = endOfSeason(state, barrage);
  bilan.promu = eos.promus.includes(state.clubId);
  bilan.relegue = eos.relegues.includes(state.clubId);
  state.saisons.push(bilan);
  p.histo.push({ saison: state.season, niveau: p.niveau, niveauXp: p.niveauXp });
  if (bilan.promu) log(state, `${club.n} évolue en ${divDef(club.div).n} la saison prochaine.`, 'club');
  /* Changer de division impose de revoir le contrat : on ne joue pas
     en National 2 avec un contrat de Régional. */
  if ((bilan.promu || bilan.relegue) && state.contrat && state.contrat.restant > 0) {
    const nd = club.div;
    const avantS = state.contrat.salaire;
    state.contrat.salaire = salaireEstime(nd, p.niveau, state.contrat.statutPromis);
    state.contrat.division = nd;
    state.contrat.primeMatch = CFG.CONTRAT.primeMatch[nd];
    state.contrat.primeBut = CFG.CONTRAT.primeBut[nd];
    state.contrat.primeVictoire = CFG.CONTRAT.primeVictoire[nd];
    log(state, `Contrat revalorisé pour la ${divDef(nd).n} : ${avantS} € → ${state.contrat.salaire} € par mois.`, 'contrat');
    const avantStatut = statutDiv(divAvant), apresStatut = statutDiv(nd);
    if (avantStatut !== apresStatut) {
      log(state, apresStatut === 'pro'
        ? 'Vous passez professionnel : contrat de joueur, entraînement biquotidien, agent et sponsors.'
        : apresStatut === 'semipro'
          ? 'Vous passez semi-professionnel : entraînement quotidien et statut fédéral.'
          : 'Retour au monde amateur.', 'carriere');
    }
  }
  if (bilan.relegue) log(state, `${club.n} est relégué en ${divDef(club.div).n}.`, 'club');

  /* Contrat : une saison de moins. À expiration, le club propose ou
     non une prolongation ; sans accord, le joueur est libre et doit
     se trouver un club au mercato. */
  if (state.contrat) {
    state.contrat.restant--;
    if (state.contrat.restant <= 0) {
      const prop = propositionRenouvellement(state);
      state.renouvellement = prop;
      state.sansContrat = true;
      log(state, prop ? `${club.n} propose une prolongation : ${prop.duree} saison(s), ${prop.salaire} € par mois.`
        : `${club.n} ne prolonge pas votre contrat. Vous êtes libre.`, 'contrat');
      if (!prop) state.contrat = null;
    }
  }
  if (state.finances) {
    state.finances.historique.push({ saison: state.season, salaires: state.finances.saisonSalaires, primes: state.finances.saisonPrimes });
    state.finances.saisonSalaires = 0; state.finances.saisonPrimes = 0;
  }

  /* La division de référence est celle qui vient d'être disputée :
     une montée ne doit pas transformer un titre de Ligue 2 en titre
     de Ligue 1. */
  bilan.distinctions = attribuerDistinctions(state, divAvant);
  bilan.nomination = nominationBallonOr(state);
  /* La qualification européenne se recalcule intégralement chaque
     saison, à partir de la division réellement disputée. Un 2e de
     Ligue 2 ne peut pas se retrouver en Ligue des champions. */
  state.competitionEurope = null;
  state.europePrelim = null;
  state.competitionEurope = qualificationEurope(state, rang);
  state.qualifieEurope = !!state.competitionEurope;
  bilan.qualifieEurope = state.qualifieEurope;
  bilan.competitionEurope = state.competitionEurope;
  bilan.trophees = state.palmares.filter(x => x.saison === state.season);
  bilan.statut = statutDiv(divAvant);
  if (state.pro) {
    bilan.selection = { capes: state.pro.selection.capes, buts: state.pro.selection.buts };
    bilan.sponsors = revenusSponsors(state);
  }
  const declin = appliquerDeclin(state);
  if (declin) { bilan.declin = declin; log(state, `L'âge commence à peser : ${declin.avant} → ${declin.apres} de générale.`, 'age'); }
  bilan.niveauApresDeclin = p.niveau;

  state.barrage = null; state.barrageAjoute = false;
  state.season++; state.seasonStartYear++; state.week = 0; state.calIndex = 0;
  state.stats = newStats(); state.cartons = 0; state.historique = []; state.tournoisPlan = [];
  for (const d of CFG.DIVISIONS) state.leagues[d.k] = initLeague(state, d.k);
  state.calendar = buildCalendar(state);
  const eu = construireEurope(state);
  if (eu) {
    state.coupes.push(eu);
    let w = 4;
    eu.tours.forEach((t, i) => { state.calendar.push({ type: 'coupe', cid: eu.id, tour: i, w, label: `${eu.nom} — ${t.n}` }); w += 5; });
    state.calendar.sort((a, b) => a.w - b.w);
    log(state, `${clubById(state.clubId).n} est engagé en Coupe d'Europe.`, 'club');
  }
  resetActions(state);
  state.evtVus = [];
  state.concurrent = genConcurrent(state);
  setObjectifs(state);
  p.fatigue = clamp(p.fatigue - 30, 0, 100); p.forme = 50;
  try { SUIVI.noter('saison_finie', { saison: bilan.saison, division: divAvant, generale: bilan.niveau,
    niveau_xp: bilan.niveauXp, matchs: bilan.stats.matchs, buts: bilan.stats.buts, passes: bilan.stats.passes_d,
    note: bilan.note, rang: bilan.rang, age: bilan.age, argent: state.finances ? state.finances.solde : 0 }); } catch (e) {}
  out.seasonEnd = bilan;
  const fin = evaluerRetraite(state);
  if (fin && fin.force) { out.retraiteForcee = fin; prendreRetraite(state, fin.raison); }
  else if (fin) { out.retraiteProposee = fin; state.retraiteProposee = fin; }
  save(state);
}

/* ---------- Statistiques agrégées ---------- */
function statsCarriere(state) {
  const tot = newStats();
  const all = state.saisons.map(s => s.stats).concat([state.stats]);
  for (const s of all) for (const k in tot) {
    if (k === 'notes') tot.notes = tot.notes.concat(s.notes || []);
    else tot[k] += (s[k] || 0);
  }
  return tot;
}

/* ---------- Sauvegardes ---------- */
const memSlots = {};
function slotKey(i) { return SAVE_PREFIX + i; }
function save(state) {
  const data = JSON.stringify({ state, divs: CLUBS.map(c => ({ id: c.id, div: c.div })), stamp: Date.now() });
  memSlots[state.slot] = data;
  try { localStorage.setItem(slotKey(state.slot), data); } catch (e) {}
}
function readSlot(i) {
  try { const d = localStorage.getItem(slotKey(i)); if (d) return d; } catch (e) {}
  return memSlots[i] || null;
}
function slotInfo(i) {
  const d = readSlot(i);
  if (!d) return null;
  try {
    const o = JSON.parse(d), s = o.state, p = s.player;
    return { slot: i, nom: `${p.prenom} ${p.nom}`, niveau: p.niveau, niveauXp: p.niveauXp,
      club: clubById(s.clubId) ? clubById(s.clubId).n : '—', saison: s.season, annee: s.seasonStartYear,
      poste: p.pos, rarete: p.rarete, stamp: o.stamp };
  } catch (e) { return null; }
}
function loadSlot(i) {
  const d = readSlot(i);
  if (!d) return null;
  try {
    const o = JSON.parse(d);
    if (o.divs) for (const x of o.divs) { const c = clubById(x.id); if (c) c.div = x.div; }
    o.state.slot = i;
    return o.state;
  } catch (e) { return null; }
}
function deleteSlot(i) {
  delete memSlots[i];
  try { localStorage.removeItem(slotKey(i)); } catch (e) {}
  return slotInfo(i) === null;
}


/* ============================================================
   DISTINCTIONS, CLASSEMENTS ET BARRAGES EUROPÉENS
   ============================================================ */

/* ---------- Classements de buteurs et de passeurs ----------
   Les autres joueurs ne sont pas simulés individuellement : leurs
   totaux sont générés de façon stable à partir de la seed, du niveau
   de la division et du nombre de journées. Le joueur y est inséré à
   sa place réelle.                                                  */
/* Les buteurs adverses progressent match après match : à la première
   journée personne n'a marqué, et les totaux montent avec la saison. */
function majClassementButeurs(state) {
  const div = divDef(clubById(state.clubId).div);
  if (!div) return;
  const rng = rngFrom(state.seed, 'buteursMaj', state.season, state.calIndex);
  state.buteurs = state.buteurs || null;
  const journees = (clubsOf(div.k).length - 1) * 2;
  if (!state.buteurs || state.buteurs.saison !== state.season) {
    /* Génération des concurrents en début de saison, à zéro but. */
    const pool = clubsOf(div.k).filter(c => c.id !== state.clubId);
    const liste = [];
    for (let i = 0; i < 12; i++) {
      const c = pool[i % pool.length];
      liste.push({ nom: `${pick(rng, PRENOMS)} ${pick(rng, NOMS)}`, club: c.n,
        /* Rendement visé sur la saison, propre à chaque joueur. */
        rythmeButs: rf(rng, 0.15, 0.62) * (0.8 + div.niv / 14),
        rythmePasses: rf(rng, 0.10, 0.42) * (0.8 + div.niv / 14),
        buts: 0, passes: 0 });
    }
    state.buteurs = { saison: state.season, journees, joues: 0, liste };
  }
  const b = state.buteurs;
  b.joues++;
  for (const j of b.liste) {
    if (rng() < j.rythmeButs) j.buts += rng() < 0.12 ? 2 : 1;
    if (rng() < j.rythmePasses) j.passes += 1;
  }
}

function classementButeurs(state, compet, type) {
  const p = state.player;
  const club = clubById(state.clubId);
  const div = divDef(club.div);
  const joues = compet === 'championnat' ? state.stats.matchs : state.stats.am_matchs;
  const moi = compet === 'championnat'
    ? (type === 'buts' ? state.stats.buts : state.stats.passes_d)
    : (type === 'buts' ? state.stats.am_buts : state.stats.am_passes_d);
  const b = state.buteurs && state.buteurs.saison === state.season ? state.buteurs : { liste: [] };
  const liste = b.liste.map(j => ({ nom: j.nom, club: j.club, total: type === 'buts' ? j.buts : j.passes, moi: false }));
  liste.push({ nom: `${p.prenom} ${p.nom}`, club: club.n, total: moi, moi: true, matchs: joues });
  liste.sort((a, b) => b.total - a.total);
  return liste.map((x, i) => ({ ...x, rang: i + 1 })).slice(0, 10);
}

/* ---------- Distinctions individuelles ----------
   Bien plus nombreuses qu'avant, et hiérarchisées : le Ballon d'Or
   ne se gagne qu'au sommet, après une saison exceptionnelle.       */
const DISTINCTIONS = [
  { k: 'buteur',    n: 'Meilleur buteur',            test: (c) => c.buts >= c.seuilButs, prestige: 3 },
  { k: 'passeur',   n: 'Meilleur passeur',           test: (c) => c.passes >= c.seuilPasses, prestige: 3 },
  { k: 'joueur',    n: 'Joueur de la saison',        test: (c) => c.note >= 7.4 && c.matchs >= 18, prestige: 4 },
  { k: 'espoir',    n: 'Meilleur espoir',            test: (c) => c.age <= 21 && c.note >= 7.0 && c.matchs >= 15, prestige: 3 },
  { k: 'equipetype',n: 'Équipe type de la saison',   test: (c) => c.note >= 7.1 && c.matchs >= 15, prestige: 2 },
  { k: 'gardien',   n: 'Meilleur gardien',           test: (c) => c.gk && c.cleanSheets >= 9, prestige: 3 },
  { k: 'decisif',   n: 'Joueur le plus décisif',     test: (c) => c.hdm >= 6, prestige: 2 },
  { k: 'mois',      n: 'Joueur du mois',             test: (c) => c.note >= 7.0 && c.matchs >= 10, prestige: 1 },
  { k: 'fairplay',  n: 'Trophée du fair-play',       test: (c) => c.matchs >= 18 && c.jaunes <= 1 && c.rouges === 0, prestige: 1 },
  { k: 'revelation',n: 'Révélation du championnat',  test: (c) => c.age <= 23 && c.note >= 7.2 && c.premiereSaison, prestige: 2 },
  { k: 'regularite',n: 'Prix de la régularité',      test: (c) => c.matchs >= c.journees - 3, prestige: 2 },
  { k: 'butannee',  n: 'But de la saison',           test: (c) => c.buts >= 8 && c.note >= 7.0, prestige: 2 },
  { k: 'capitaine', n: 'Leader de la saison',        test: (c) => c.leadership >= 70 && c.note >= 7.2, prestige: 2 },
  { k: 'or_nat',    n: "Meilleur joueur du championnat", test: (c) => c.pro && c.note >= 7.7 && c.matchs >= 22, prestige: 5 },
  { k: 'ballondor', n: "Ballon d'Or",                test: (c) => c.elite && c.note >= 8.0 && c.matchs >= 24 && (c.buts + c.passes) >= 22 && c.europe, prestige: 6 },
];

function contexteDistinctions(state, divRef) {
  const p = state.player, st = state.stats;
  const div = divDef(divRef || clubById(state.clubId).div);
  const seuilButs = { R2: 14, R1: 15, N2: 15, N1: 16, L3: 17, L2: 18 }[div.k] || 19;
  const seuilPasses = { R2: 9, R1: 10, N2: 10, N1: 11, L3: 11, L2: 12 }[div.k] || 13;
  return {
    buts: st.buts, passes: st.passes_d, note: moyenneNote(st.notes) || 0, matchs: st.matchs,
    cleanSheets: st.clean_sheets, hdm: st.hommes_du_match, jaunes: st.jaunes, rouges: st.rouges,
    age: ageAt(p.naissance, currentDate(state)), gk: p.pos === 'GB',
    leadership: p.hidden.leadership, seuilButs, seuilPasses,
    journees: (clubsOf(div.k).length - 1) * 2,
    premiereSaison: state.saisons.length === 0 || state.saisons[state.saisons.length - 1].club !== clubById(state.clubId).n,
    pro: div.statut === 'pro',
    elite: div.niv >= 7,
    europe: !!(state.coupes || []).find(c => c.europe),
    div,
  };
}

function attribuerDistinctions(state, divRef) {
  const ctx = contexteDistinctions(state, divRef);
  const rng = rngFrom(state.seed, 'distinctions', state.season);
  const obtenues = [];
  for (const d of DISTINCTIONS) {
    let ok = false;
    try { ok = d.test(ctx); } catch (e) { ok = false; }
    if (!ok) continue;
    /* Plus la distinction est prestigieuse, plus la concurrence est rude. */
    let chance = clamp(0.9 - d.prestige * 0.12, 0.2, 0.9);
    /* Concurrence : plus on a déjà gagné une distinction, plus il est
       difficile de la regagner. Quatre Ballons d'Or d'affilée ne
       doivent pas être la norme. */
    const dejaGagne = (state.palmares || []).filter(x => x.individuel && x.titre.startsWith(d.k === 'ballondor' ? "Ballon d'Or" : d.n)).length;
    chance *= Math.pow(d.k === 'ballondor' ? 0.45 : 0.82, dejaGagne);
    if (d.k === 'ballondor') {
      /* Un rival de niveau mondial est tiré chaque saison : il faut le
         devancer, pas seulement remplir les critères. */
      const rival = 7.9 + rng() * 0.9 + Math.min(0.5, dejaGagne * 0.15);
      if (ctx.note < rival) continue;
    }
    if (rng() > chance) continue;
    /* Le libellé reprend la division réellement disputée cette
       saison-là, pas celle du club après une montée. */
    const nom = d.k === 'ballondor' ? "Ballon d'Or" : `${d.n} — ${ctx.div.n}`;
    obtenues.push({ k: d.k, n: nom, prestige: d.prestige });
    state.palmares.push({ saison: state.season, titre: nom, club: clubById(state.clubId).n, individuel: true });
    state.player.reputation = clamp(state.player.reputation + d.prestige * 1.6, 0, 100);
    if (state.pro) state.pro.distinctions.push({ n: nom, saison: state.season, prestige: d.prestige });
    log(state, `Distinction : ${nom}.`, 'trophee');
  }
  return obtenues;
}

/* Nomination au Ballon d'Or : annoncée avant l'attribution. */
function nominationBallonOr(state) {
  const ctx = contexteDistinctions(state);
  if (!ctx.elite) return null;
  if (ctx.note < 7.6 || ctx.matchs < 20) return null;
  const rng = rngFrom(state.seed, 'nomination', state.season);
  const rang = clamp(Math.round(31 - (ctx.note - 7.4) * 22 - (ctx.buts + ctx.passes) * 0.5 + gauss(rng, 0, 3)), 1, 30);
  return { rang, note: ctx.note, buts: ctx.buts, passes: ctx.passes };
}

/* ---------- Club ciblé ----------
   Le joueur désigne un club où il aimerait signer : son agent y
   travaille, et l'intérêt de ce club monte plus vite si les
   performances suivent.                                            */
function ciblerClub(state, clubId) {
  const c = clubById(clubId);
  if (!c) return null;
  state.cible = { clubId, depuis: state.season };
  log(state, `Vous faites savoir que ${c.n} vous intéresse.`, 'mercato');
  return c;
}
function bonusCible(state, clubId) {
  if (!state.cible || state.cible.clubId !== clubId) return 0;
  const agent = state.pro && state.pro.agent ? state.pro.agent.force : 1;
  return 3.5 * agent;
}

/* ---------- Barrages européens inter-pays ----------
   Les clubs des championnats les moins bien classés au coefficient
   passent par des tours préliminaires contre des clubs d'autres
   pays pour accéder à la phase de ligue.                            */
const COEFF_PAYS = { EN: 1, ES: 2, IT: 3, DE: 4, FR: 5, BE: 6 };

function barragesEuropeens(state, competK) {
  const club = clubById(state.clubId);
  const paysK = (CFG.PAYS.find(p => p.n === club.pays) || {}).k;
  const coeff = COEFF_PAYS[paysK] || 6;
  /* Un club anglais ou espagnol entre directement ; un club belge
     doit passer plusieurs tours, comme dans la réalité. */
  if (competK === 'ldc') return coeff >= 6 ? 2 : coeff >= 5 ? 0 : 0;
  if (competK === 'el') return coeff >= 6 ? 1 : 0;
  return coeff >= 5 ? 1 : 0;
}

function construireBarragesEurope(state, competK) {
  const n = barragesEuropeens(state, competK);
  if (!n) return [];
  const noms = ['Tour préliminaire', 'Barrage d\'accès'];
  return Array.from({ length: n }, (_, i) => ({
    n: noms[Math.max(0, noms.length - n + i)], rep: 80 + i * 4, prelim: true,
  }));
}


/* ============================================================
   CHOIX DE CARRIÈRE
   ------------------------------------------------------------
   Une décision tombe toutes les 4 à 8 semaines. Chaque option a des
   conséquences réelles et parfois durables : générale, cote auprès du
   staff, moral, forme, blessures, réputation, argent, et dans les cas
   les plus graves une mise à l'écart de l'équipe.
   ============================================================ */

/* Aperçu lisible des conséquences, montré AVANT la décision : le
   joueur doit pouvoir arbitrer en connaissance de cause. */
function apercuEffets(eff) {
  const l = [];
  if (eff.generale) l.push(`${eff.generale > 0 ? '+' : ''}${eff.generale} générale`);
  if (eff.cote) l.push(`${eff.cote > 0 ? '+' : ''}${eff.cote} cote`);
  if (eff.moral) l.push(`${eff.moral > 0 ? '+' : ''}${eff.moral} moral`);
  if (eff.forme) l.push(`${eff.forme > 0 ? '+' : ''}${eff.forme} forme`);
  if (eff.fatigue) l.push(`${eff.fatigue > 0 ? '+' : ''}${eff.fatigue} fatigue`);
  if (eff.reputation) l.push(`${eff.reputation > 0 ? '+' : ''}${eff.reputation} réputation`);
  if (eff.argent) l.push(`${eff.argent > 0 ? '+' : ''}${eff.argent.toLocaleString('fr-FR')} €`);
  if (eff.xp) l.push(`+${Math.round(eff.xp * 100)} % d'expérience`);
  if (eff.fragilite) l.push(`${eff.fragilite > 0 ? '+' : ''}${eff.fragilite} fragilité`);
  if (eff.blessure) l.push(`risque de blessure`);
  if (eff.suspension) l.push('suspension');
  if (eff.ecarte) l.push(`mise à l'écart`);
  return l.join(' · ');
}

function appliquerEffets(state, eff) {
  const p = state.player;
  const journal = [];
  if (eff.generale) {
    /* La générale ne dépasse jamais le potentiel, et ne descend pas
       sous un plancher raisonnable. */
    const avant = p.niveau;
    p.niveau = Math.round(clamp(p.niveau + eff.generale, 20, Math.min(CFG.OVERALL.max, p.potentielMax || 99)));
    if (p.niveau !== avant) journal.push(`générale ${avant} → ${p.niveau}`);
  }
  if (eff.cote) { p.cote = clamp(p.cote + eff.cote, 0, 100); journal.push(`cote ${eff.cote > 0 ? '+' : ''}${eff.cote}`); }
  if (eff.moral) { p.moral = clamp(p.moral + eff.moral, 0, 100); }
  if (eff.forme) { p.forme = clamp(p.forme + eff.forme, 0, 100); }
  if (eff.fatigue) { p.fatigue = clamp(p.fatigue + eff.fatigue, 0, 100); }
  if (eff.reputation) { p.reputation = clamp(p.reputation + eff.reputation, 0, 100); journal.push(`réputation ${eff.reputation > 0 ? '+' : ''}${eff.reputation}`); }
  if (eff.argent && state.finances) {
    state.finances.solde = Math.max(0, state.finances.solde + eff.argent);
    journal.push(`${eff.argent > 0 ? '+' : ''}${eff.argent.toLocaleString('fr-FR')} €`);
  }
  if (eff.xp) { addXp(state, Math.round(CFG.XP.base * eff.xp)); journal.push(`expérience +${Math.round(eff.xp * 100)} %`); }
  if (eff.fragilite) p.hidden.fragilite = clamp(p.hidden.fragilite + eff.fragilite, 0, 100);
  if (eff.professionnalisme) p.hidden.professionnalisme = clamp(p.hidden.professionnalisme + eff.professionnalisme, 0, 100);
  if (eff.leadership) p.hidden.leadership = clamp(p.hidden.leadership + eff.leadership, 0, 100);
  if (eff.blessure) {
    p.blessure = { n: eff.blessure.n, semaines: eff.blessure.semaines };
    journal.push(`blessure : ${eff.blessure.n}, ${eff.blessure.semaines} semaine(s)`);
  }
  if (eff.ecarte) {
    /* Mise à l'écart : le joueur sort du groupe, il faudra tout
       reconstruire. */
    p.cote = clamp(Math.min(p.cote, 12), 0, 100);
    state.ecarte = (state.ecarte || 0) + eff.ecarte;
    journal.push(`écarté du groupe pendant ${eff.ecarte} semaine(s)`);
  }
  if (eff.suspension) { p.suspension = Math.max(p.suspension || 0, eff.suspension); journal.push('suspension'); }
  return journal;
}
