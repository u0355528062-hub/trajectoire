/* Un choix toutes les 4 à 8 semaines. */
function choixDu(state) {
  if (state.choixEnCours) return null;
  const prochaine = state.prochainChoix || 0;
  if (state.week < prochaine) return null;
  const rng = rngFrom(state.seed, 'choix', state.season, state.week);
  const dispo = CHOIX.filter(c => {
    if ((state.choixVus || []).includes(c.k + state.season)) return false;
    try { return c.cond(state); } catch (e) { return false; }
  });
  if (!dispo.length) { state.prochainChoix = state.week + ri(rng, 4, 8); return null; }
  const c = pick(rng, dispo);
  state.choixVus = state.choixVus || [];
  state.choixVus.push(c.k + state.season);
  state.prochainChoix = state.week + ri(rng, 4, 8);
  state.choixEnCours = { k: c.k, titre: c.titre, texte: c.texte,
    options: [{ i: 0, n: c.a.n, apercu: apercuEffets(c.a.eff) },
              { i: 1, n: c.b.n, apercu: apercuEffets(c.b.eff) }] };
  return state.choixEnCours;
}

function repondreChoix(state, idx) {
  const c = CHOIX.find(x => x.k === (state.choixEnCours || {}).k);
  if (!c) return null;
  const opt = idx === 0 ? c.a : c.b;
  const journal = appliquerEffets(state, opt.eff);
  state.choixEnCours = null;
  log(state, `${c.titre} — ${opt.txt}`, 'choix');
  save(state);
  return { texte: opt.txt, effets: journal };
}

const ACHATS = [

    desc: 'Fini les deux heures de trajet quotidiennes.', eff: { fatigueSemaine: -2.5, forme: 0.4 } },

    desc: 'Récupération suivie, blessures écourtées.', eff: { recuperation: 0.78, fragilite: -8 } },
  { k: 'prepa', n: 'Préparateur physique personnel', cat: 'Encadrement', prix: 6500, entretien: 900,
    desc: 'Séances individualisées en plus du collectif.', eff: { xpMul: 1.10, fatigueSemaine: 1 } },
  { k: 'coach_mental', n: 'Préparateur mental', cat: 'Encadrement', prix: 5000, entretien: 600,
    desc: 'Gestion de la pression et des passages à vide.', eff: { moralSemaine: 1.4, notePression: 0.12 } },
  { k: 'analyste', n: 'Analyste vidéo personnel', cat: 'Encadrement', prix: 8000, entretien: 1100,
    desc: 'Étude systématique de vos matchs et des adversaires.', eff: { xpMul: 1.14 }, requis: 'semipro' },

  { k: 'agent_image', n: 'Attaché de presse', cat: 'Image', prix: 9000, entretien: 1200,
    desc: 'Votre communication est gérée par un professionnel.', eff: { reputationSemaine: 0.12, coteSemaine: 0.15 }, requis: 'pro' },
  { k: 'academie', n: 'École de football à votre nom', cat: 'Image', prix: 150000, entretien: 3000,
    desc: 'Un projet qui vous survivra, et une image durablement installée.', eff: { reputationSemaine: 0.3 }, requis: 'pro' },
];

function achatDef(k) { return ACHATS.find(a => a.k === k); }
function achatsPossibles(state) {
  const st = statutJoueur(state);
  const rang = { amateur: 0, semipro: 1, pro: 2 };
  return ACHATS.filter(a => !a.requis || rang[st] >= rang[a.requis]);
}
function possede(state, k) { return (state.achats || []).includes(k); }

function acheter(state, k) {
  const a = achatDef(k);
  if (!a || possede(state, k)) return { ok: false, texte: 'Déjà acquis.' };
  if (!state.finances || state.finances.solde < a.prix) return { ok: false, texte: 'Solde insuffisant.' };
  state.achats = state.achats || [];
  state.achats.push(k);
  state.finances.solde -= a.prix;
  log(state, `Achat : ${a.n} (${a.prix.toLocaleString('fr-FR')} €).`, 'economie');
  return { ok: true, texte: `${a.n} acquis.` };
}
function revendre(state, k) {
  const a = achatDef(k);
  if (!a || !possede(state, k)) return { ok: false };
  state.achats = state.achats.filter(x => x !== k);
  const reprise = Math.round(a.prix * 0.55);
  state.finances.solde += reprise;
  log(state, `Revente : ${a.n} pour ${reprise.toLocaleString('fr-FR')} €.`, 'economie');
  return { ok: true, texte: `Revendu ${reprise.toLocaleString('fr-FR')} €.` };
}

/* Somme des effets actifs. */
function effetsEconomie(state) {
  const tot = { fatigueSemaine: 0, formeSemaine: 0, moralSemaine: 0, reputationSemaine: 0,
    coteSemaine: 0, xpMul: 1, recuperation: 1, fragilite: 0, notePression: 0, forme: 0, entretien: 0 };
  for (const k of (state.achats || [])) {
    const a = achatDef(k);
    if (!a) continue;
    tot.entretien += a.entretien;
    for (const e in a.eff) {
      if (e === 'xpMul' || e === 'recuperation') tot[e] *= a.eff[e];
      else tot[e] = (tot[e] || 0) + a.eff[e];
    }
  }
  return tot;
}

/* Prélèvement des frais d'entretien, chaque semaine. Si le solde ne
   suit plus, les biens les plus coûteux sont revendus d'office. */
function preleverEntretien(state, semaines) {
  if (!state.finances) return 0;
  const eff = effetsEconomie(state);
  const du = Math.round(eff.entretien / 4.33 * semaines);
  if (!du) return 0;
  if (state.finances.solde >= du) { state.finances.solde -= du; return du; }
  /* Découvert : revente forcée du bien le plus cher à entretenir. */
  const tries = (state.achats || []).map(achatDef).filter(Boolean).sort((a, b) => b.entretien - a.entretien);
  if (tries.length) {
    revendre(state, tries[0].k);
    log(state, `Vous ne pouviez plus assumer les frais de ${tries[0].n} : revente forcée.`, 'economie');
  }
  const reste = Math.min(state.finances.solde, du);
  state.finances.solde -= reste;
  return reste;
}

function particles(host, color, n) {
  const box = document.createElement('div');
  box.className = 'parts';
  for (let i = 0; i < (n || 46); i++) {
    const d = document.createElement('i');
    d.className = 'pt';
    const ang = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 240;
    d.style.left = '50%'; d.style.top = '50%'; d.style.background = color;
    d.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    d.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    d.style.animationDelay = (Math.random() * 0.4) + 's';
    box.appendChild(d);
  }
  host.appendChild(box);
  setTimeout(() => box.remove(), 2600);
}
function buzz(v) { try { if (navigator.vibrate) navigator.vibrate(v); } catch (e) {} }
let AC = null;
function beep(freq, dur, vol, type) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, AC.currentTime);
    g.gain.linearRampToValueAtTime(vol || 0.06, AC.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (dur || 0.3));
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + (dur || 0.3) + 0.06);
  } catch (e) {}
}
function fanfare() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .45, .07), i * 130)); }

/* ---------- Révélation ----------
   Palier 1 à 5 : révélation directe.
   Palier 6 et plus : séquence spéciale — montée en tension, éclair
   plein écran, gerbe de particules, fanfare et bandeau dédié.     */
function runReveal(ctx, done) {
  let rerolls = 0;
  let player = ctx.makePlayer(rerolls);
  const host = document.createElement('div');
  host.id = 'reveal';
  document.body.appendChild(host);
  let timers = [];
  const clearT = () => { timers.forEach(clearTimeout); timers = []; };

  function panneau() {
    const r = rarDef(player.rarete);

    const pct = Math.round((player.xpMul - 1) * 100);
    return `
      <div class="rv-step on"><div class="rv-t">Carte de potentiel</div>
        <div class="rv-r" style="color:${r.c1};margin-top:6px">${r.n}</div>
        <div class="tiny" style="margin-top:4px">Palier ${r.tier} sur 8${r.tier >= 7 ? ' — tirage exceptionnel' : ''}</div></div>
      <div class="rv-step on" id="cardSlot">${cardHTML(player, null, { anim: true })}</div>
      <div class="rv-step on card" style="max-width:320px;text-align:left">
        <div class="row sb"><span class="muted">Vitesse de progression</span><b style="color:var(--acc)">×${player.xpMul.toFixed(2)}</b></div>
        <div class="tiny" style="margin-top:4px">${pct >= 0 ? '+' : ''}${pct} % d'expérience par match par rapport à une progression standard.</div>
        <div class="sep"></div>
        <div class="row sb"><span class="muted">Générale estimée à terme</span><b>${player.estim[0]} – ${player.estim[1]}</b></div>
        <div class="tiny" style="margin-top:4px">Estimation, pas une limite : votre générale n'a aucun plafond.
        Une carte faible ralentit la montée en niveau, elle ne la bloque pas.</div>
      </div>
      <div style="display:flex;gap:9px;width:100%;max-width:320px">
        <button class="btn sec2" id="bRe" style="flex:1">Relancer</button>
        <button class="btn" id="bOk" style="flex:1">Valider</button>
      </div>
      <div class="tiny">Relances illimitées · ${rerolls} tirage(s) effectué(s)</div>`;
  }

  function bind() {
    const re = host.querySelector('#bRe'), ok = host.querySelector('#bOk');
    if (re) re.onclick = () => { rerolls++; player = ctx.makePlayer(rerolls); paint(); };
    if (ok) ok.onclick = () => { clearT(); host.remove(); done(player, rerolls); };
  }

  function paint() {
    clearT();
    const r = rarDef(player.rarete);
    host.className = '';
    if (r.tier >= 6) return paintSpecial(r);
    host.innerHTML = `<div class="halo" style="background:${r.glow};opacity:.5"></div>` + panneau();
    beep(360 + r.tier * 34, .3, .05);
    if (r.tier === 5) { particles(host, r.c1); buzz(30); }
    bind();
  }

  /* Séquence spéciale : tension, éclair, explosion, fanfare. */
  function paintSpecial(r) {
    host.classList.add('special');
    host.innerHTML = `
      <div class="halo" id="halo" style="background:${r.glow};opacity:0"></div>
      <div class="beam" id="beam"></div>
      <div class="rv-step on" id="tease" style="max-width:300px">
        <div class="rv-t">Évaluation en cours</div>
        <div class="dots" style="margin-top:14px"><i></i><i></i><i></i></div>
      </div>`;
    beep(120, .8, .05, 'sawtooth');
    timers.push(setTimeout(() => { beep(180, .6, .05, 'sawtooth'); host.querySelector('#halo').style.opacity = .35; }, 700));
    timers.push(setTimeout(() => { beep(260, .5, .06, 'sawtooth'); buzz([20, 60, 20]); host.querySelector('#beam').classList.add('on'); }, 1400));
    timers.push(setTimeout(() => {
      const flash = document.createElement('div');
      flash.className = 'flash'; host.appendChild(flash);
      setTimeout(() => flash.remove(), 900);
      host.querySelector('#halo').style.opacity = .75;
      buzz([40, 50, 90]); fanfare();
      host.innerHTML = `<div class="halo" style="background:${r.glow};opacity:.75"></div>
        <div class="bandeau">${r.tier === 8 ? 'TIRAGE GÉNÉRATIONNEL' : 'TIRAGE EXCEPTIONNEL'}</div>` + panneau();
      particles(host, r.c1, 90);
      particles(host, '#ffffff', 40);
      host.querySelector('.pcard').classList.add('bigreveal');
      bind();
    }, 2200));
  }

  paint();
}

      <div><div class="tiny" style="margin-bottom:5px">Prénom</div><input id="iPre" value="${esc(NEW.prenom)}"></div>
      <div><div class="tiny" style="margin-bottom:5px">Nom</div><input id="iNom" value="${esc(NEW.nom)}"></div>
    </div><div style="height:10px"></div>
    <div class="tiny" style="margin-bottom:5px">Nationalité</div>
    <select id="iNat">${NATIONALITES.map(n => `<option value="${n.k}" ${NEW.nat === n.k ? 'selected' : ''}>${n.n}</option>`).join('')}</select>
    <div style="height:10px"></div>
    <div class="grid2">
      <div><div class="tiny" style="margin-bottom:5px">Taille (cm)</div><input id="iT" type="number" value="${NEW.taille}"></div>
      <div><div class="tiny" style="margin-bottom:5px">Poids (kg)</div><input id="iP" type="number" value="${NEW.poids}"></div>
    </div>
    <div class="tiny" style="margin-top:7px">La taille compte : un grand gardien domine les airs et couvre son but,
      un petit gardien est plus vif mais souffre sur les centres. Sur le terrain, elle joue sur le jeu de tête et l'agilité.</div>
    <div style="height:10px"></div>
    <div class="grid2">
      <div><div class="tiny" style="margin-bottom:5px">Âge au début</div>
        <select id="iA">${[16,17,18,19,20,21,22,23].map(a => `<option ${NEW.age === a ? 'selected' : ''}>${a}</option>`).join('')}</select></div>
      <div><div class="tiny" style="margin-bottom:5px">Saison de départ</div>
        <select id="iY">${[2024,2025,2026,2027,2028].map(y => `<option value="${y}" ${NEW.startYear === y ? 'selected' : ''}>${y}/${String(y + 1).slice(2)}</option>`).join('')}</select></div>
    </div>
  </div>
  <button class="btn" id="bNext">Continuer</button>`;
}

function stepPoste() {
  const grp = (t, l) => `<div class="tiny" style="margin:11px 0 6px;font-weight:800;letter-spacing:.1em">${t.toUpperCase()}</div>
    <div class="chips">${CFG.POSITIONS.filter(p => p.line === l).map(p =>
      `<button class="chip ${NEW.pos === p.k ? 'on' : ''}" data-pos="${p.k}">${p.n}</button>`).join('')}</div>`;
  return `<div class="sec">Poste principal</div>
  <div class="card">${grp('Gardien', 'GB')}${grp('Défense', 'DEF')}${grp('Milieu', 'MIL')}${grp('Attaque', 'ATT')}
    <div class="tiny" style="margin-top:10px">Vos attributs de départ suivront votre poste : un attaquant démarre fort
    en tir et en dribble et faible en défense, un défenseur l'inverse.</div></div>
  <div class="sec">Poste secondaire</div>
  <div class="card"><div class="chips">
    <button class="chip ${!NEW.posSec ? 'on' : ''}" data-sec="">Aucun</button>
    ${CFG.POSITIONS.filter(p => p.k !== NEW.pos && p.line === posDef(NEW.pos).line).map(p =>
      `<button class="chip ${NEW.posSec === p.k ? 'on' : ''}" data-sec="${p.k}">${p.n}</button>`).join('')}</div></div>
  <div class="sec">Pied fort</div>
  <div class="card"><div class="chips">
    <button class="chip ${NEW.pied === 'D' ? 'on' : ''}" data-pied="D">Droit</button>
    <button class="chip ${NEW.pied === 'G' ? 'on' : ''}" data-pied="G">Gauche</button></div></div>
  <button class="btn" id="bNext">Continuer</button>`;
}

function stepProfil() {
  return `<div class="sec">Profil de joueur</div>
  <div class="card tight">${CFG.PROFILES.map(p => `<button class="opt ${NEW.profil === p.k ? 'on' : ''}" data-prof="${p.k}">
    <div><b>${p.n}</b><span>${p.desc}</span></div></button>`).join('')}</div>
  <button class="btn" id="bNext">Continuer</button>`;
}

function stepDivision() {
  if (!NEW.pays) NEW.pays = 'FR';
  const pays = CFG.PAYS.find(p => p.k === NEW.pays) || CFG.PAYS[0];
  const divs = pays.divisions.map(k => divDef(k));
  if (!divs.find(d => d.k === NEW.division)) NEW.division = divs[divs.length - 1].k;
  const cat = (titre, liste) => liste.length ? `<div class="tiny" style="margin:11px 0 6px;font-weight:800;letter-spacing:.1em">${titre}</div>
    ${liste.map(d => `<button class="opt ${NEW.division === d.k ? 'on' : ''}" data-div="${d.k}">
      <div><b>${d.n}</b><span>Niveau moyen ${d.standard} · générale de départ ${d.startBonus ? '+' + d.startBonus : 'standard'} · ${clubsOf(d.k).length} clubs</span></div></button>`).join('')}` : '';
  return `<div class="sec">Pays</div>
  <div class="card"><div class="chips">
    ${CFG.PAYS.map(p => `<button class="chip ${NEW.pays === p.k ? 'on' : ''}" data-pays="${p.k}">${p.n}</button>`).join('')}
  </div></div>
  <div class="sec">Championnat de départ</div>
  <div class="card tight">
    ${cat('PROFESSIONNEL', divs.filter(d => d.statut === 'pro'))}
    ${cat('SEMI-PROFESSIONNEL', divs.filter(d => d.statut === 'semipro'))}
    ${cat('AMATEUR', divs.filter(d => d.statut === 'amateur'))}
    <div class="tiny" style="margin-top:8px">Plus vous démarrez haut, plus votre générale de départ est élevée — et plus la concurrence est rude.</div>
  </div>
  <button class="btn" id="bNext">Continuer</button>`;
}

function stepClub() {
  const clubs = clubsOf(NEW.division).slice().sort((a, b) => b.rep - a.rep);
  if (!NEW.clubId || !clubs.find(c => c.id === NEW.clubId)) NEW.clubId = clubs[clubs.length - 1].id;
  return `<div class="sec">Club de départ · ${divDef(NEW.division).n}</div>
  <div class="card tight">${clubs.map(c => `<button class="opt ${NEW.clubId === c.id ? 'on' : ''}" data-club="${c.id}">
    <div class="crest" style="width:32px;height:32px;font-size:11px">${initials(c.n)}</div>
    <div style="flex:1;min-width:0"><b>${c.n}</b>
      <span>${c.ville} · ${c.stade} · réputation ${c.rep}/100 — ${c.rep >= 36 ? 'concurrence très forte' : c.rep >= 28 ? 'concurrence forte' : c.rep >= 22 ? 'concurrence normale' : 'porte plus facile à ouvrir'}</span></div>
  </button>`).join('')}
  <div class="tiny" style="margin-top:6px">Un club mieux coté joue plus haut au classement mais recrute mieux : votre place y sera plus difficile à prendre.</div></div>
  <button class="btn" id="bNext">Continuer</button>`;
}

function stepResume() {
  const nat = NATIONALITES.find(n => n.k === NEW.nat);
  if (!NEW.clubId || !clubById(NEW.clubId) || clubById(NEW.clubId).div !== NEW.division) {
    const dispo = clubsOf(NEW.division);
    NEW.clubId = dispo[dispo.length - 1].id;
  }
  const l = (a, b) => `<div class="row sb"><span class="muted">${a}</span><b>${b}</b></div><div class="sep"></div>`;
  return `<div class="sec">Récapitulatif</div>
  <div class="card">
    ${l('Joueur', esc(NEW.prenom) + ' ' + esc(NEW.nom))}
    ${l('Âge / nationalité', NEW.age + ' ans · ' + nat.n)}
    ${l('Poste', posDef(NEW.pos).n + (NEW.posSec ? ' / ' + posDef(NEW.posSec).n : ''))}
    ${l('Pied / gabarit', (NEW.pied === 'D' ? 'Droit' : 'Gauche') + ' · ' + NEW.taille + ' cm')}
    ${l('Profil', CFG.PROFILES.find(p => p.k === NEW.profil).n)}
    ${l('Division', divDef(NEW.division).n)}
    <div class="row sb"><span class="muted">Club</span><b>${clubById(NEW.clubId).n}</b></div>
  </div>
  <div class="card"><div class="muted">Vous allez tirer votre carte de potentiel. Elle ne fixe aucune limite :
    elle détermine la vitesse à laquelle vous gagnez de l'expérience. Jusqu'à ${CFG.REROLLS_MAX} relances.</div></div>
  <button class="btn" id="bGo">Tirer ma carte</button>`;
}

function bindStep() {
  const nx = $('bNext'); if (nx) nx.onclick = () => { collect(); nextStep(); };
  document.querySelectorAll('[data-pos]').forEach(b => b.onclick = () => { NEW.pos = b.dataset.pos; NEW.posSec = null; renderCreate(); });
  document.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => { NEW.posSec = b.dataset.sec || null; renderCreate(); });
  document.querySelectorAll('[data-pied]').forEach(b => b.onclick = () => { NEW.pied = b.dataset.pied; renderCreate(); });
  document.querySelectorAll('[data-prof]').forEach(b => b.onclick = () => { NEW.profil = b.dataset.prof; renderCreate(); });
  document.querySelectorAll('[data-pays]').forEach(b => b.onclick = () => { NEW.pays = b.dataset.pays; NEW.division = null; NEW.clubId = null; renderCreate(); });
  document.querySelectorAll('[data-div]').forEach(b => b.onclick = () => { NEW.division = b.dataset.div; NEW.clubId = null; renderCreate(); });
  document.querySelectorAll('[data-club]').forEach(b => b.onclick = () => { NEW.clubId = b.dataset.club; renderCreate(); });
  const go = $('bGo'); if (go) go.onclick = startCareer;
}
function collect() {
  if (!$('iPre')) return;
  NEW.prenom = ($('iPre').value || 'Joueur').trim().slice(0, 18);
  NEW.nom = ($('iNom').value || 'Anonyme').trim().slice(0, 20);
  NEW.nat = $('iNat').value;
  NEW.taille = clamp(parseInt($('iT').value) || 178, 158, 210);
  NEW.poids = clamp(parseInt($('iP').value) || 72, 52, 110);
  NEW.age = parseInt($('iA').value) || 18;
  NEW.startYear = parseInt($('iY').value) || 2026;
}

function startCareer() {
  collect();
  const seed = String(Date.now()) + '-' + NEW.slot;
  const naissance = `${NEW.startYear - NEW.age}-0${1 + Math.floor(Math.random() * 9)}-15`;
  const base = { prenom: NEW.prenom, nom: NEW.nom, naissance, nationalite: NEW.nat, taille: NEW.taille,
    poids: NEW.poids, pos: NEW.pos, posSec: NEW.posSec, pied: NEW.pied, profil: NEW.profil,
    age: NEW.age, division: NEW.division, seed };
  runReveal({ makePlayer: r => createPlayer({ ...base, rerolls: r }) }, (player) => {
    S = newCareer({ ...base, slot: NEW.slot, startYear: NEW.startYear, clubId: NEW.clubId, player });
    try { SUIVI.noter('carriere_creee', { poste: player.pos, carte: player.rarete, division: NEW.division, age: NEW.age, generale: player.niveau }); } catch (e) {}
    save(S); TAB = 'accueil';
    askConfirm('Tutoriel', "Un tutoriel de huit écrans explique les mécaniques du jeu. Vous pouvez le passer à tout moment.",
      () => showTutoriel(() => renderGame()), 'Voir le tutoriel');
    renderGame();
  });
}

/* ======================= JEU ======================= */
const TABS = [
  { k: 'accueil',    n: 'Carrière',   ic: '⚽' },
  { k: 'calendrier', n: 'Calendrier', ic: '📅' },
  { k: 'coupes',     n: 'Coupes',     ic: '🏆' },
  { k: 'classement', n: 'Classement', ic: '📊' },
  { k: 'stats',      n: 'Stats',      ic: '📈' },
  { k: 'profil',     n: 'Profil',     ic: '👤' },
];

/* Applique l'identité visuelle de la division en cours. */
function appliquerTheme() {
  const t = CFG.THEMES[S ? themeKey(S) : 'amateur'] || CFG.THEMES.amateur;
  const r = document.documentElement;
  r.style.setProperty('--acc', t.acc);
  r.style.setProperty('--acc2', t.acc2);
  document.body.style.background = `radial-gradient(1100px 620px at 82% -8%, ${t.halo1}, transparent 60%),
    radial-gradient(900px 560px at 6% 4%, ${t.halo2}, transparent 62%), ${t.bg}`;
  document.body.style.backgroundAttachment = 'fixed';
}

function renderGame() {
  appliquerTheme();
  const p = S.player, club = clubById(S.clubId), d = currentDate(S);

  /* La barre d'onglets est construite EN PREMIER et de façon
     indépendante : même si une vue échoue, la navigation reste
     disponible. C'est ce qui la faisait disparaître. */
  const bar = $('tabbar');
  bar.innerHTML = TABS.map(t => `<button class="tab ${TAB === t.k ? 'on' : ''}" data-tab="${t.k}">
    <span class="ic">${t.ic}</span><span class="lb">${t.n}</span></button>`).join('');
  bar.classList.add('visible');
  bar.style.display = 'grid';
  bar.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { TAB = b.dataset.tab; renderGame(); });

  try {
    $('app').innerHTML = `
      <div class="topbar">
        <div class="crest">${initials(club.n)}</div>
        <div style="min-width:0"><div class="tb-t">${esc(p.prenom)} ${esc(p.nom)}
          <span class="tiny" style="font-weight:700">· ${ageAt(p.naissance, d)} ans</span></div>
          <div class="tb-s">${club.n} · ${divDef(club.div).n}
            ${estPro(S) ? '<span class="statutpill">PRO</span>' : semiPro(S) ? '<span class="statutpill">SEMI-PRO</span>' : ''}</div></div>
        <div class="lvlbadge">
          <div style="text-align:right"><div class="dateline">${fmtDate(d)}</div>
            <div class="tiny">${S.seasonStartYear}/${String(S.seasonStartYear + 1).slice(2)} · v${CFG.version}</div></div>
          ${p.points > 0 ? `<span class="ptbadge">${p.points}</span>` : ''}
          <div class="ovbox">${p.niveau}</div>
        </div>
      </div>
      <div class="wrap fade" id="body"></div>`;
    const vue = { accueil: viewAccueil, attrs: viewAttrs, calendrier: viewCalendrier, coupes: viewCoupes,
      classement: viewClassement, stats: viewStats, profil: viewProfil }[TAB] || viewAccueil;
    vue();
  } catch (err) {
    const b = $('body');
    if (b) b.innerHTML = `<div class="card"><b>Cet écran n'a pas pu s'afficher.</b>
      <div class="tiny" style="margin-top:6px">${esc(String(err && err.message || err))}</div>
      <div class="muted" style="margin-top:8px">Les autres onglets restent accessibles en bas.</div></div>`;
  }
}

function xpPct(p) { return clamp((p.xp / xpNeeded(p.niveauXp)) * 100, 0, 100); }

/* ---------- Carrière ---------- */
function viewAccueil() {
  const p = S.player, club = clubById(S.clubId);
  const entry = nextEntry(S);
  const league = currentLeague(S);
  const rang = standings(league).findIndex(t => t.id === S.clubId) + 1;
  const st = statusOf(p.cote), nx = nextStatus(p.cote);
  const age = ageAt(p.naissance, currentDate(S));
  const last = S.historique.slice(-3).reverse();

  if (entry && entry.type === 'mercato') return viewMercato(entry);

  let next = '';
  if (!entry) next = `<div><b style="font-size:15px">Saison terminée</b><div class="tiny" style="margin-top:3px">Place au bilan.</div></div>`;
  else if (entry.type === 'championnat') {
    const jr = league && league.fixtures ? league.fixtures[entry.journee - 1] : null;
    const fx = jr && jr.find(m => m.h === S.clubId || m.a === S.clubId);
    if (!fx) { next = `<div><b style="font-size:15px">Journée ${entry.journee}</b>
      <div class="tiny" style="margin-top:3px">Calendrier en cours de mise à jour.</div></div>`; }
    else {
    const dom = fx.h === S.clubId, adv = clubById(dom ? fx.a : fx.h);
    const advRang = standings(league).findIndex(t => t.id === adv.id) + 1;
    next = `<div class="row sb"><div style="min-width:0">
      <div class="tiny">JOURNÉE ${entry.journee} · ${fmtDate(weekToDate(S.seasonStartYear, entry.w))}</div>
      <b style="font-size:16px">${dom ? 'Réception' : 'Déplacement'}</b>
      <div class="muted" style="margin-top:2px">${adv.n}</div>
      <div class="tiny" style="margin-top:2px">${origineClub(adv)} · ${advRang}<sup>e</sup></div></div>
      <div class="crest" style="width:42px;height:42px">${initials(adv.n)}</div></div>`; }
  } else if (entry.type === 'coupe') {
    const c = coupeById(S, entry.cid);
    const advC = c ? adversaireCoupe(S, c, entry.tour) : null;
    next = `<div><div class="tiny">COUPE · ${fmtDate(weekToDate(S.seasonStartYear, entry.w))}</div>
      <b style="font-size:16px">${c ? c.nom : entry.label}</b>
      <div class="muted" style="margin-top:3px">${c ? c.tours[entry.tour].n : ''}${advC ? ' · ' + advC.n : ''}</div>
      ${advC ? `<div class="tiny" style="margin-top:2px">${origineClub(advC)}</div>` : ''}
      <div class="tiny" style="margin-top:4px">Adversaire tiré au sort. Défaite = campagne terminée.</div></div>`;
  } else if (entry.type === 'barrage') {
    const adv = clubById(entry.duel.clubBas === S.clubId ? entry.duel.clubHaut : entry.duel.clubBas);
    next = `<div class="row sb"><div style="min-width:0">
      <div class="tiny" style="color:var(--warn)">BARRAGE D'ACCESSION · ${fmtDate(weekToDate(S.seasonStartYear, entry.w))}</div>
      <b style="font-size:16px">Match unique</b>
      <div class="muted" style="margin-top:2px">${adv.n}</div>
      <div class="tiny" style="margin-top:4px">Une seule rencontre pour la division de la saison prochaine.</div></div>
      <div class="crest" style="width:42px;height:42px">${initials(adv.n)}</div></div>`;
  } else {
    const T = tournoiById(S, entry.tid);
    next = `<div><div class="tiny">TOURNOI AMICAL · ${fmtDate(weekToDate(S.seasonStartYear, entry.w))}</div>
      <b style="font-size:16px">${T ? T.nom : entry.label}</b>
      <div class="muted" style="margin-top:3px">${T ? T.tours[entry.tour].nom : ''}</div></div>`;
  }

  const indispo = p.blessure ? `<div class="evt bad">Indisponible : ${p.blessure.n} — ${p.blessure.semaines} semaine(s).</div>`
    : p.suspension > 0 ? `<div class="evt bad">Suspendu pour la prochaine rencontre.</div>` : '';

  $('body').innerHTML = `
  <div class="hero">
    <div class="row" style="gap:14px">
      <div class="lvlring" style="--p:${xpPct(p)}%"><span>${p.niveauXp}</span></div>
      <div style="flex:1;min-width:0">
        <div class="row sb"><b style="font-size:13px">Niveau ${p.niveauXp}</b>
          <span class="tiny">${p.xp} / ${xpNeeded(p.niveauXp)} XP</span></div>
        <div class="xpbar" style="margin-top:6px"><i style="width:${xpPct(p)}%"></i></div>
        <div class="tiny" style="margin-top:5px">${rarDef(p.rarete).n} · ×${p.xpMul.toFixed(2)} d'XP par match</div>
      </div>
    </div>
    <div class="grid3" style="margin-top:14px">
      <div class="stat"><b>${p.niveau}</b><span>Générale</span></div>
      <div class="stat"><b>${p.estim[0]}-${p.estim[1]}</b><span>Estimation</span></div>
      <div class="stat"><b>${rang}<sup>e</sup></b><span>Classement</span></div>
    </div>
    <div class="tiny" style="margin-top:9px">${age} ans · ${posDef(p.pos).n} · ${p.taille} cm</div>
  </div>

  ${p.points > 0 ? `<button class="card" id="bPts" style="width:100%;text-align:left;border-color:rgba(49,224,122,.45)">
    <div class="row sb"><div><b style="font-size:14.5px;color:var(--acc)">${p.points} point${p.points > 1 ? 's' : ''} à distribuer</b>
      <div class="tiny" style="margin-top:3px">Seuls les attributs utiles à votre poste font monter la générale.</div></div>
      <span style="font-size:20px;color:var(--acc)">›</span></div></button>` : ''}

  ${S.choixEnCours ? `<button class="card" id="bChoix" style="width:100%;text-align:left;border-color:rgba(242,193,75,.55)">
    <div class="row sb"><div><div class="tiny" style="color:var(--gold)">DÉCISION À PRENDRE</div>
      <b style="font-size:14.5px">${esc(S.choixEnCours.titre)}</b>
      <div class="tiny" style="margin-top:3px">Ce choix aura des conséquences durables.</div></div>
      <span style="font-size:20px;color:var(--gold)">›</span></div></button>` : ''}

  ${S.evenement ? `<button class="card" id="bEvt" style="width:100%;text-align:left;border-color:rgba(23,196,216,.5)">
    <div class="row sb"><div><div class="tiny" style="color:var(--acc2)">ÉVÉNEMENT</div>
      <b style="font-size:14.5px">${esc(S.evenement.titre)}</b>
      <div class="tiny" style="margin-top:3px">Une décision vous attend.</div></div>
      <span style="font-size:20px;color:var(--acc2)">›</span></div></button>` : ''}

  ${S.sansContrat ? `<div class="evt bad">Vous êtes en fin de contrat.${S.renouvellement ? ' Une prolongation vous attend au mercato.' : ' Aucune prolongation proposée : trouvez un club.'}</div>` : ''}

  ${indispo}
  <div class="card">${next}</div>
  <button class="btn" id="bPlay">${!entry ? 'Terminer la saison' : entry.type === 'championnat' ? 'Jouer le match' : entry.type === 'coupe' ? 'Jouer le tour de coupe' : entry.type === 'barrage' ? 'Jouer le barrage' : 'Jouer ce tour'}</button>

  ${S.objectifs && S.objectifs.length ? `<div class="sec">Objectifs de la saison</div>
  <div class="card">${S.objectifs.map(o => {
    const v = valeurObjectif(S, o.k), pct = clamp((v / o.cible) * 100, 0, 100);
    return `<div style="margin-bottom:10px"><div class="row sb"><span class="muted">${o.n}</span>
      <b style="color:${v >= o.cible ? 'var(--acc)' : 'var(--txt)'}">${o.k === 'note' ? round1(v) : Math.round(v)} / ${o.cible}</b></div>
      <div class="bar" style="margin-top:5px"><i style="width:${pct}%;background:${v >= o.cible ? 'var(--acc)' : 'var(--acc2)'}"></i></div></div>`;
  }).join('')}<div class="tiny">Tous les objectifs remplis : cote, réputation, moral et prime. Aucun : le staff sanctionne.</div></div>` : ''}

  <div class="sec">Votre place</div>
  <div class="card">
    <div class="row sb"><b>${st.n}</b><span class="tiny">cote ${Math.round(p.cote)}/100</span></div>
    <div class="bar" style="margin-top:8px"><i style="width:${p.cote}%"></i></div>
    <div class="sep"></div>
    ${CFG.ACTIONS.map(a => `<button class="opt" data-act="${a.k}" ${(S.actions[a.k] || 0) <= 0 ? 'disabled style="opacity:.4"' : ''}>
      <div style="flex:1"><b>${a.n} <span class="tiny">(${S.actions[a.k] || 0})</span></b>

/* ---------- Match en direct ---------- */
function showLive(res, advId, titre, onDone, tabScore) {
  const evs = buildTimeline(S, res, advId);
  const club = clubById(S.clubId), adv = clubById(advId);
  const gauche = res.home ? club : adv, droite = res.home ? adv : club;
  const d = document.createElement('div');
  d.id = 'live';
  d.innerHTML = `
    <div class="live-head">
      <div class="tiny">${esc(titre)}</div>
      <div class="tiny" style="margin-top:3px">${esc(origineClub(clubById(advId)))}</div>
      <div class="live-score" id="lvScore">0-0</div>
      <div class="row sb" style="margin-top:4px">
        <b style="flex:1;text-align:left;font-size:13px">${gauche.n}</b>
        <span class="live-min" id="lvMin">0'</span>
        <b style="flex:1;text-align:right;font-size:13px">${droite.n}</b>
      </div>
    </div>
    <div class="live-feed" id="lvFeed"></div>
    <div class="live-foot">
      <button class="btn sec2" id="lvSkip" style="flex:1">Passer</button>
      <button class="btn" id="lvOk" style="flex:1;display:none">Feuille de match</button>
    </div>`;
  document.body.appendChild(d);
  const feed = d.querySelector('#lvFeed');
  let i = 0, timer = null;

  const afficher = (e) => {
    const li = document.createElement('div');
    li.className = `live-ev ${e.type} ${e.moi ? 'moi' : ''}`;
    li.innerHTML = `<div class="m">${e.min}'</div><div class="x">${esc(e.txt)}</div>`;
    feed.appendChild(li);
    feed.scrollTop = feed.scrollHeight;
    d.querySelector('#lvMin').textContent = e.min + "'";
    d.querySelector('#lvScore').textContent = e.score;
    if (e.type === 'but') { beep(660, .25, .05); buzz(30); }
    if (e.type === 'but_contre') beep(180, .3, .04);
  };
  /* Séance de tirs au but jouée tir par tir, avec le suspense qui va
     avec : le score du match reste inchangé, seule la séance départage. */
  const seanceTab = () => {
    if (!tabScore) return terminer();
    const [a, b] = tabScore.split('-').map(Number);
    const total = Math.max(a, b) + Math.min(a, b) + 2;
    const tirs = [];
    let ra = a, rb = b;
    for (let k = 0; k < 5 && (ra > 0 || rb > 0); k++) {
      tirs.push({ moi: true, ok: ra-- > 0 });
      tirs.push({ moi: false, ok: rb-- > 0 });
    }
    const li0 = document.createElement('div');
    li0.className = 'live-ev but';
    li0.innerHTML = `<div class="m">TAB</div><div class="x">Séance de tirs au but.</div>`;
    feed.appendChild(li0);
    let ta = 0, tb = 0, k = 0;
    const it = setInterval(() => {
      if (k >= tirs.length) { clearInterval(it); return terminer(); }
      const tir = tirs[k++];
      if (tir.ok) { if (tir.moi) ta++; else tb++; }
      const li = document.createElement('div');
      li.className = `live-ev ${tir.ok ? 'but' : ''} ${tir.moi ? 'moi' : ''}`;
      li.innerHTML = `<div class="m">${ta}-${tb}</div><div class="x">${tir.moi ? 'Vous' : clubById(advId).n} : ${tir.ok ? 'tir au but réussi.' : 'tir au but manqué.'}</div>`;
      feed.appendChild(li);
      feed.scrollTop = feed.scrollHeight;
      beep(tir.ok ? 700 : 200, .25, .05);
      d.querySelector('#lvMin').textContent = 'TAB';
    }, CFG.LIVE.tabMs);
  };
  const terminer = () => {
    d.querySelector('#lvSkip').style.display = 'none';
    d.querySelector('#lvOk').style.display = 'block';
  };
  const finir = () => {
    clearInterval(timer);
    while (i < evs.length) afficher(evs[i++]);
    if (tabScore) seanceTab(); else terminer();
  };
  timer = setInterval(() => {
    if (i >= evs.length) { clearInterval(timer); return tabScore ? seanceTab() : terminer(); }
    afficher(evs[i++]);
  }, CFG.LIVE.vitesseMs);
  d.querySelector('#lvSkip').onclick = finir;
  d.querySelector('#lvOk').onclick = () => { d.remove(); onDone(); };
}

    <div class="sep"></div>
    <div class="row sb"><span class="muted">Indemnité mensuelle</span><b>${S.renouvellement.salaire} €</b></div>
    <div class="row sb" style="margin-top:6px"><span class="muted">Durée</span><b>${S.renouvellement.duree} saison(s)</b></div>
    <div class="row sb" style="margin-top:6px"><span class="muted">Primes</span><b>${S.renouvellement.primeMatch} € / match · ${S.renouvellement.primeBut} € / but</b></div>
    <div style="height:12px"></div>
    <div class="row" style="gap:8px">
      <button class="btn" id="bProl" style="flex:2;padding:11px;font-size:13.5px">Signer</button>

    <div class="tiny" style="margin-top:8px">Négocier peut faire monter l'offre, la laisser telle quelle, ou vexer le club.</div>
  </div>` : ''}

  <div class="sec">Transferts — propositions reçues</div>
  ${S.offres && S.offres.length ? S.offres.map((o, i) => {

    return `<div class="card"><div class="row sb">
      <div class="row" style="gap:10px;min-width:0"><div class="crest" style="width:34px;height:34px;font-size:11px">${initials(c.n)}</div>
        <div style="min-width:0"><b>${c.n}</b><div class="tiny">${c.div ? divDef(c.div).n : 'hors poule simulée'} · ${c.ville}</div></div></div>
      <span class="pill2">${o.statut}</span></div>
      <div class="sep"></div>
      <div class="row sb"><span class="muted">Rôle proposé</span><b>${o.statut}</b></div>
      <div class="row sb" style="margin-top:5px"><span class="muted">Intérêt du club</span><b>${o.interet || '—'}/100</b></div>
      <div class="row sb"><span class="muted">Indemnité</span><b>${o.salaire || 0} € / mois</b></div>
      <div class="row sb" style="margin-top:5px"><span class="muted">Durée</span><b>${o.duree || 1} saison(s)</b></div>
      <div style="height:10px"></div>
      <button class="btn" data-signer="${i}" style="padding:11px;font-size:13.5px">Négocier et signer</button></div>`;
  }).join('') : `<div class="card"><div class="muted">Aucune sollicitation pour l'instant. Il faut d'abord être vu :
    ${matchsCarriere(S)} match(s) disputé(s) en carrière, réputation ${Math.round(p.reputation)}/100.
    Les recruteurs se déplacent quand vous jouez et que vous êtes bon.</div></div>`}

  <div class="sec">Club ciblé</div>
  <div class="card tight">
    ${S.cible ? `<div class="row sb"><div><b>${clubById(S.cible.clubId).n}</b>
      <div class="tiny">${origineClub(clubById(S.cible.clubId))} · votre agent travaille ce dossier</div></div>
      <button class="chip" id="bCibleOff">Retirer</button></div>`
      : `<div class="muted">Désignez un club où vous aimeriez signer : son intérêt montera plus vite si vos performances suivent.</div>`}
    <div style="height:8px"></div>
    <select id="selCible">${CFG.PAYS.map(pa => pa.divisions.map(dk => {
      const liste = clubsOf(dk).filter(c => c.id !== S.clubId).sort((a, b) => b.rep - a.rep);
      if (!liste.length) return '';
      return `<optgroup label="${pa.n} — ${divDef(dk).n}">${liste.map(c => `<option value="${c.id}">${c.n}</option>`).join('')}</optgroup>`;
    }).join('')).join('')}</select>
    <div style="height:8px"></div>
    <button class="btn sec2" id="bCible">Cibler ce club</button>
  </div>

  <div class="sec">Clubs qui vous observent</div>
  <div class="card tight">
    ${(() => {
      const its = Object.entries(S.interets || {}).filter(([, v]) => v > 12).sort((x, y) => y[1] - x[1]).slice(0, 6);
      if (!its.length) return `<div class="muted">Aucun recruteur ne s'est déplacé pour vous jusqu'ici.
        Il faut jouer, et être bon, pour qu'un club commence à se renseigner.</div>`;
      return its.map(([id, v]) => {
        const c = clubById(id);
        return `<div class="mrow"><div class="d">${c.div || '—'}</div>
          <div class="t">${c.n}<div class="tiny">${v >= CFG.MERCATO.seuilInteret ? 'prêt à formuler une offre' : 'vous observe'}</div>
            <div class="bar" style="margin-top:5px"><i style="width:${Math.round(v)}%;background:${v >= CFG.MERCATO.seuilInteret ? 'var(--acc)' : 'var(--acc2)'}"></i></div></div>
          <b class="tiny">${Math.round(v)}</b></div>`;
      }).join('');
    })()}
  </div>
  <div style="height:10px"></div>
  <button class="btn blue" id="bClose">Fermer le mercato et reprendre</button>`;

  document.querySelectorAll('[data-signer]').forEach(b => b.onclick = () => {
    const o = S.offres[+b.dataset.signer];
    showNegociation(o, (finale) => { signer(S, finale); save(S); beep(560, .25, .05); setTimeout(() => beep(740, .3, .05), 200); toast('Contrat signé'); renderGame(); });
  });

  if ($('bProl')) $('bProl').onclick = () => {
    signerContrat(S, S.renouvellement); S.renouvellement = null; S.sansContrat = false;
    setObjectifs(S); save(S); toast('Contrat prolongé'); renderGame();
  };
  if ($('bNego')) $('bNego').onclick = () => {
    const r = negocier(S, S.renouvellement);
    S.renouvellement = r.offre; save(S);
    modal('Négociation', `<div class="card"><div class="muted">${esc(r.texte)}</div>
      <div class="sep"></div><div class="row sb"><span class="muted">Nouvelle proposition</span><b>${r.offre.salaire} € / mois</b></div></div>`, () => renderGame());
  };
  if ($('bCible')) $('bCible').onclick = () => { ciblerClub(S, $('selCible').value); save(S); renderGame(); };
  if ($('bCibleOff')) $('bCibleOff').onclick = () => { S.cible = null; save(S); renderGame(); };
  $('bClose').onclick = () => { fermerMercato(S); renderGame(); };
}

function matchRow(h) {
  const adv = clubById(h.adversaire);
  const cls = h.note >= 7 ? 'g' : (h.note != null && h.note < 5.5) ? 'b' : '';
  const badges = [h.buts ? `${h.buts} but${h.buts > 1 ? 's' : ''}` : '', h.passes_d ? `${h.passes_d} PD` : '',
    h.cleanSheet ? 'clean sheet' : '', h.rouge ? 'rouge' : h.jaune ? 'jaune' : ''].filter(Boolean).join(' · ');
  return `<div class="mrow"><div class="d">${h.tag === 'amical' ? 'AM' : h.tag === 'barrage' ? 'BAR' : 'J' + h.journee}</div>
    <div class="t">${h.home ? '' : '@ '}${adv.n}<div class="tiny">${h.minutes ? h.minutes + '′' : roleTxt(h.role)}${badges ? ' · ' + badges : ''}</div></div>
    <div class="s">${h.gPour}-${h.gContre}</div>
    <div class="note ${cls}">${h.note != null ? h.note.toFixed(1) : '—'}</div></div>`;
}
function roleTxt(r) { return { blesse: 'blessé', suspendu: 'suspendu', banc: 'banc', non_convoque: 'non convoqué' }[r] || '—'; }

function doPlay() {
  if (S.retraite) return toast('Votre carrière est terminée.');
  const entryAvant = nextEntry(S);
  const out = playNext(S);
  if (out.seasonEnd && !out.matchs.length && !out.tournoi) return showSeasonEnd(out.seasonEnd);
  /* À partir des tours avancés d'une compétition à élimination
     directe, on suit la rencontre minute par minute. */
  const m0 = out.matchs[0];
  if (m0 && m0.minutes > 0) {
    const prop = proposerActionMatch(S, m0);
    if (prop) return showActionMatch(prop, m0, out);
  }
  const m = out.matchs[0];
  const enDirect = m && m.minutes >= 0 && (
    (out.coupe && entryAvant && entryAvant.type === 'coupe' && estTourDirect(out.coupe.tours[entryAvant.tour].n)) ||
    (entryAvant && entryAvant.type === 'barrage'));
  if (enDirect) {
    const titre = entryAvant.type === 'barrage' ? "Barrage d'accession"
      : `${out.coupe.nom} — ${out.coupe.tours[entryAvant.tour].n}`;
    return showLive(m, m.adversaire, titre, () => showResult(out), m.tabScore || (out.barrage && out.barrage.tab ? out.barrage.tabScore : null));
  }
  showResult(out);
}

function showResult(out) {
  const p = S.player;
  /* Retour sonore discret : un son par événement marquant, pas plus. */
  const m0 = out.matchs[0];
  if (m0 && m0.minutes > 0) {
    if (m0.buts >= 2) { beep(660, .22, .05); setTimeout(() => beep(880, .3, .05), 180); }
    else if (m0.buts === 1) beep(700, .25, .05);
    else if (m0.gPour > m0.gContre) beep(520, .2, .04);
    else if (m0.gPour < m0.gContre) beep(210, .28, .035);
  }
  if (out.matchs.some(x => (x.gains || []).length)) setTimeout(() => { beep(600, .18, .05); setTimeout(() => beep(820, .26, .05), 150); }, 400);
  const gains = out.matchs.flatMap(m => m.gains || []);
  const xpTot = out.matchs.reduce((s, m) => s + m.xp, 0);
  let corps = '';
  if (out.actionTexte) corps += `<div class="evt ok">${esc(out.actionTexte)}</div>`;
  if (out.tournoi) corps += bracketHTML(out.tournoi, true);
  if (out.coupe) {
    const c = out.coupe;
    const t = c.tours[out.tourJoue != null ? out.tourJoue : c.tours.findIndex(x => x.joue && !x.vu)] ||
      c.tours.filter(x => x.joue).slice(-1)[0];
    if (t) corps += `<div class="card"><div class="row sb"><b>${c.nom}</b><span class="pill2">${t.n}</span></div>
      <div class="tiny" style="margin-top:6px">${t.gagne ? 'Qualification pour le tour suivant.' : 'Élimination.'}</div></div>`;
  }
  if (out.barrage) {
    const b = out.barrage;
    corps += `<div class="card"><div class="tiny">BARRAGE D'ACCESSION</div>
      <div class="row sb" style="margin-top:8px">
        <b style="flex:1">${clubById(b.clubHaut).n}</b>
        <div class="big">${b.gh}-${b.ga}</div>
        <b style="flex:1;text-align:right">${clubById(b.clubBas).n}</b></div>
      ${b.tab ? `<div class="tiny" style="text-align:center;margin-top:5px">Tirs au but ${b.tabScore || ''}</div>` : ''}
      <div class="sep"></div>
      <div class="muted">${b.vainqueur === S.clubId ? 'Votre club l\'emporte et change de division.' : 'Votre club reste à son niveau.'}</div></div>`;
  }
  corps += out.matchs.map(simpleMatchCard).join('');
  const primes = out.matchs.reduce((s2, m) => s2 + (m.primes || 0), 0);
  if (out.presse) corps += `<div class="sec">Presse locale</div><div class="card">
    <b style="font-size:14px">${esc(out.presse.titre)}</b>
    <div class="muted" style="margin-top:5px">${esc(out.presse.texte)}</div></div>`;
  if (primes) corps += `<div class="sec">Primes</div><div class="card">
    <div class="row sb"><span class="muted">Perçu sur cette échéance</span><b style="color:var(--acc)">+${primes} €</b></div>
    <div class="row sb" style="margin-top:6px"><span class="muted">Solde</span><b>${S.finances.solde.toLocaleString('fr-FR')} €</b></div></div>`;
  if (out.international) corps += `<div class="sec">Sélection nationale</div><div class="card">
    <div class="row sb"><b>Match international</b><span class="pill2">${out.international.capes}<sup>e</sup> sélection</span></div>
    <div class="muted" style="margin-top:6px">Face à ${out.international.adversaire} : ${out.international.minutes}′,
      ${out.international.buts} but(s), note ${out.international.note}.</div></div>`;
  if (out.selection && out.selection.premiere) corps += `<div class="evt ok"><b>Première convocation en équipe nationale (${out.selection.pays})</b></div>`;
  if (out.sponsors && out.sponsors.length) corps += `<div class="sec">Sponsoring</div>` +
    out.sponsors.map(x => `<div class="evt ok">${esc(x.n)} — ${x.annuel.toLocaleString('fr-FR')} € par an.</div>`).join('');
  if (out.observations && out.observations.length) corps += `<div class="sec">Recruteurs</div>` +
    out.observations.map(id => `<div class="evt ok">${clubById(id).n} vous a observé et commence à se renseigner sérieusement.</div>`).join('');
  if (out.revelations && out.revelations.length) corps += `<div class="sec">Rapport du staff</div>` +
    out.revelations.map(r => `<div class="evt ok"><b>${r.label} : ${r.palier}</b>
      <div class="tiny" style="margin-top:3px">${esc(HIDDEN_LABELS[r.k].d)}</div></div>`).join('');
  if (out.events.length) corps += `<div class="sec">Entre les matchs</div>` +
    out.events.map(e => `<div class="evt ${e.t === 'bad' ? 'bad' : e.t === 'ok' ? 'ok' : ''}">${esc(e.texte)}</div>`).join('');
  corps += `<div class="sec">Expérience</div>
    <div class="card">
      <div class="row sb"><span class="muted">XP gagnée</span><b style="color:var(--acc)">+${xpTot}</b></div>
      <div class="sep"></div>
      <div class="row sb"><b>Niveau ${p.niveauXp}</b><span class="tiny">${p.xp} / ${xpNeeded(p.niveauXp)} XP</span></div>
      <div class="xpbar" style="margin-top:7px"><i style="width:${xpPct(p)}%"></i></div>
      ${gains.length ? gains.map(g => `<div class="evt ok" style="margin-top:9px"><b>Niveau ${g.niveau} atteint</b> — ${g.points} points à distribuer.</div>`).join('')
        : `<div class="tiny" style="margin-top:8px">La générale ne bouge que si vous dépensez des points.</div>`}
    </div>`;
  modal(out.tournoi ? out.tournoi.nom : 'Résultat', corps, () => {
    if (out.seasonEnd) showSeasonEnd(out.seasonEnd);
    else if (S.evenement) showEvenement(S.evenement);
    else renderGame();
  });
}

function simpleMatchCard(m) {
  const adv = clubById(m.adversaire);
  const gagne = m.gPour > m.gContre, nul = m.gPour === m.gContre;
  if (m.minutes === 0) {
    return `<div class="card"><div class="row sb"><b>${m.home ? '' : '@ '}${adv.n}</b>
      <b style="color:${gagne ? 'var(--acc)' : nul ? 'var(--dim)' : 'var(--bad)'}">${m.gPour}-${m.gContre}</b></div>
      <div class="muted" style="margin-top:6px">${{ blesse: 'Blessé, indisponible.', suspendu: 'Suspendu.', banc: 'Resté sur le banc.', non_convoque: 'Non convoqué.' }[m.role] || 'Pas utilisé.'}</div>
      <div class="tiny" style="margin-top:5px">+${m.xp} XP</div></div>`;
  }
  const faits = [];
  if (m.buts) faits.push(`${m.buts} but${m.buts > 1 ? 's' : ''}`);
  if (m.passes_d) faits.push(`${m.passes_d} passe${m.passes_d > 1 ? 's' : ''} décisive${m.passes_d > 1 ? 's' : ''}`);
  if (m.arrets) faits.push(`${m.arrets} arrêts`);
  if (m.cleanSheet) faits.push('clean sheet');
  if (m.rouge) faits.push('carton rouge'); else if (m.jaune) faits.push('carton jaune');
  if (m.homme) faits.push('homme du match');
  return `<div class="card">
    <div class="row sb">
      <div style="min-width:0"><div class="tiny">${m.tag === 'amical' ? esc(m.label || 'Amical') : m.tag === 'barrage' ? "Barrage d'accession" : 'Journée ' + m.journee}</div>
        <b style="font-size:15px">${m.home ? '' : '@ '}${adv.n}</b>
        <div class="tiny" style="margin-top:2px">${origineClub(adv)}</div></div>
      <div style="text-align:right">
        <div class="big" style="color:${gagne ? 'var(--acc)' : nul ? 'var(--dim)' : 'var(--bad)'}">${m.gPour}-${m.gContre}</div>
        ${m.tabScore ? `<div class="tiny" style="margin-top:2px">tirs au but ${m.tabScore}</div>` : ''}</div>
    </div>
    <div class="sep"></div>
    <div class="row" style="gap:10px">
      <div class="note ${m.note >= 7 ? 'g' : m.note < 5.5 ? 'b' : ''}" style="font-size:16px;padding:7px 12px">${m.note.toFixed(1)}</div>
      <div style="flex:1;min-width:0"><div style="font-size:13px">${m.minutes} minutes ${m.role === 'entrant' ? '(entré en jeu)' : ''}</div>
        <div class="tiny" style="margin-top:2px">${faits.length ? faits.join(' · ') : 'Aucun fait marquant.'}</div></div>
      <div style="text-align:right"><b style="color:var(--acc);font-size:13px">+${m.xp}</b><div class="tiny">XP</div></div>
    </div>
  </div>`;
}

/* ---------- Tableau de tournoi interactif ---------- */
function bracketHTML(T) {
  const me = S.clubId;
  const rows = T.tours.map((tour, ti) => `
    <div class="brkround"><h5>${tour.nom}</h5>
      ${tour.matchs.length ? tour.matchs.map((m, mi) => {
        const wh = m.vainqueur === m.h, wa = m.vainqueur === m.a;
        return `<button class="brkm" data-brk="${T.id}|${ti}|${mi}" style="width:100%">
          <span class="tm ${wh ? 'win' : ''} ${m.h === me ? 'mine' : ''}">${clubById(m.h).n}</span>
          <span class="sc">${m.joue ? `${m.gh}-${m.ga}${m.tab ? ' tab' : ''}` : '–'}</span>
          <span class="tm ${wa ? 'win' : ''} ${m.a === me ? 'mine' : ''}" style="text-align:right">${clubById(m.a).n}</span>
        </button>`;
      }).join('') : `<div class="tiny">Qualifiés à déterminer</div>`}
    </div>`).join('');
  const res = !T.termine ? 'en cours' : T.rang === 1 ? 'Vainqueur' : T.rang === 2 ? 'Finaliste' : 'Éliminé';
  return `<div class="card">
    <div class="row sb"><b style="font-size:15px">${T.nom}</b>
      <span class="pill2" style="${T.rang === 1 ? 'color:var(--acc)' : ''}">${res}</span></div>
    <div class="tiny" style="margin:6px 0 11px">${tournoiDef(T.k) ? tournoiDef(T.k).desc : ''}</div>
    <div class="brk">${rows}</div></div>`;
}

function bindBrackets() {
  document.querySelectorAll('[data-brk]').forEach(b => b.onclick = () => {
    const [tid, ti, mi] = b.dataset.brk.split('|');
    const T = tournoiById(S, tid);
    if (!T) return;
    const m = T.tours[+ti].matchs[+mi];
    if (!m || !m.joue) return toast('Match pas encore joué');
    const mien = m.h === S.clubId || m.a === S.clubId;
    modal(T.nom, `<div class="card">
      <div class="row sb"><b>${clubById(m.h).n}</b><div class="big">${m.gh}-${m.ga}</div><b style="text-align:right">${clubById(m.a).n}</b></div>
      <div class="tiny" style="margin-top:6px">${T.tours[+ti].nom}${m.tab ? ' · décidé aux tirs au but' : ''}</div>
      ${mien && m.minutes ? `<div class="sep"></div>
        <div class="row sb"><span class="muted">Votre temps de jeu</span><b>${m.minutes}′</b></div>
        <div class="row sb" style="margin-top:6px"><span class="muted">Votre note</span><b>${m.note.toFixed(1)}</b></div>
        ${m.buts ? `<div class="row sb" style="margin-top:6px"><span class="muted">Buts</span><b>${m.buts}</b></div>` : ''}`
        : mien ? `<div class="tiny" style="margin-top:8px">Vous n'avez pas joué cette rencontre.</div>` : ''}
    </div>`, () => renderGame());
  });
}

/* ---------- Parcours en coupe ---------- */
function coupeHTML(c) {
  return `<div class="card">
    <div class="row sb"><b style="font-size:15px">${c.nom}</b>
      <span class="pill2" style="${c.vainqueur ? 'color:var(--acc)' : c.elimine ? 'color:var(--bad)' : ''}">${c.rangAtteint || 'en course'}</span></div>
    <div class="tiny" style="margin:6px 0 10px">Élimination directe. ${c.depart ? `Entrée en lice au ${c.tours[c.depart].n.toLowerCase()}.` : ''}</div>
    <div class="brk"><div class="brkround">
      ${c.tours.map((t, i) => {
        if (i < c.depart) return '';
        if (!t.joue) return `<div class="brkm"><span class="tm" style="opacity:${c.elimine ? .35 : .7}">${t.n}</span>
          <span class="sc">–</span><span class="tm" style="text-align:right;opacity:.5">${c.elimine ? 'hors course' : 'à venir'}</span></div>`;
        return `<div class="brkm"><span class="tm ${t.gagne ? 'win' : ''}">${t.n}</span>
          <span class="sc">${t.gh}-${t.ga}${t.tab ? ' tab' : ''}</span>
          <span class="tm" style="text-align:right">${clubById(t.adversaire).n}</span></div>
          ${t.minutes ? `<div class="tiny" style="padding:0 0 6px">Vous : ${t.minutes}′, note ${t.note.toFixed(1)}</div>` : ''}`;
      }).join('')}
    </div></div></div>`;
}

  const p = S.player;
  const groups = CFG.ATTR_GROUPS.filter(g => (g.k === 'gb') === (p.pos === 'GB'));
  const sel = SEL_ATTR && (SEL_ATTR in p.attrs) ? SEL_ATTR : null;
  const cout = sel ? upgradeCost(p.attrs[sel]) : 0;
  const gain = sel ? ovGain(p.pos, sel) : 0;

  $('body').innerHTML = `
  <div class="card glass">
    <div class="row sb">
      <div><div class="tiny">GÉNÉRALE</div><div class="ovbig" style="color:var(--acc)">${p.niveau}</div></div>
      <div style="flex:1;padding:0 14px">
        <div class="row sb"><span class="tiny">NIVEAU ${p.niveauXp}</span><span class="tiny">${p.xp}/${xpNeeded(p.niveauXp)}</span></div>
        <div class="xpbar" style="margin-top:5px"><i style="width:${xpPct(p)}%"></i></div>
        <div class="tiny" style="margin-top:5px">Palier suivant : ${pointsForLevel(p.niveauXp + 1)} points</div>
      </div>
      <div style="text-align:right"><div class="tiny">À DISTRIBUER</div>
        <div class="ovbig" style="color:${p.points ? 'var(--acc)' : 'var(--dim2)'}">${p.points}</div></div>
    </div>
    <div class="tiny" style="margin-top:10px">Progression vers la générale ${p.niveau + 1} : ${Math.round(p.ovFrac * 100)} %.
      Seuls les attributs qui comptent à votre poste y contribuent.</div>
  </div>

  ${sel ? `<div class="card" style="border-color:var(--line2)">
    <div class="row sb"><div><div style="font-size:17px;font-weight:900;color:${attrGroup(sel).col}">${attrName(sel).toUpperCase()}</div>
      <div class="tiny" style="margin-top:3px">${attrGroup(sel).n}${gain > 0 ? ` · +${gain.toFixed(2)} de générale par point` : ' · ne fait pas monter votre générale à ce poste'}</div></div>
      <div class="ovbig">${p.attrs[sel]}</div></div>
    <div class="sep"></div>
    <div class="row sb"><span class="muted">Coût du prochain point</span><b>${cout} pt${cout > 1 ? 's' : ''}</b></div>
    <div style="height:10px"></div>
    <button class="btn ${canUpgrade(p, sel) ? '' : 'sec2'}" id="bUp" ${canUpgrade(p, sel) ? '' : 'disabled'}>Améliorer (${cout})</button>
  </div>` : `<div class="card"><div class="muted">Touchez un attribut pour l'améliorer.</div></div>`}

  <div class="atgrid">
    ${groups.map(g => `<div class="atcol"><h4 style="color:${g.col}">${g.n}</h4>
      ${g.attrs.map(a => {
        const v = p.attrs[a.k], up = canUpgrade(p, a.k), util = ovGain(p.pos, a.k) > 0;
        return `<button class="atrow" data-at="${a.k}">
          <div class="atwrap"><div class="n" style="${util ? '' : 'opacity:.55'}">${a.n}</div>
            <div class="atline"><i style="width:${v}%;background:${atColor(v)}"></i></div></div>
          <span class="v">${v}</span><span class="up">${up ? '+' : ''}</span></button>`;
      }).join('')}</div>`).join('')}
  </div>
  ${(S.reveles && S.reveles.length) ? `<div class="sec">Rapport du staff</div><div class="card">
    ${S.reveles.map(k => `<div class="row sb" style="padding:5px 0"><div style="min-width:0"><b style="font-size:13px">${HIDDEN_LABELS[k].n}</b>
      <div class="tiny">${esc(HIDDEN_LABELS[k].d)}</div></div>
      <b style="color:var(--acc2);white-space:nowrap">${palierHidden(S.player.hidden[k])}</b></div>`).join('')}
    <div class="tiny" style="margin-top:6px">Le staff dévoile un trait caché tous les ${CFG.SCOUTING.matchsParRevelation} matchs disputés.</div>
  </div>` : `<div class="sec">Rapport du staff</div><div class="card"><div class="muted">Le staff ne vous connaît pas encore assez.
    Vos traits cachés se dévoileront au fil des matchs.</div></div>`}

  <div style="height:12px"></div>
  <button class="btn sec2" id="bAuto" ${p.points ? '' : 'disabled'}>Répartition automatique</button>
  <div class="tiny" style="margin-top:8px;text-align:center">Coûts : 1 pt jusqu'à 69, 2 jusqu'à 79, 3 jusqu'à 84, 4 jusqu'à 89, 5 ensuite.</div>`;

  document.querySelectorAll('[data-at]').forEach(b => b.onclick = () => { SEL_ATTR = b.dataset.at; renderGame(); });
  if ($('bUp')) $('bUp').onclick = () => {
    const r = upgradeAttr(p, sel);
    if (r) {
      save(S);
      if (r.monte) { beep(760, .22, .05); buzz(20); toast('Générale ' + p.niveau); }
      else beep(480, .12, .035);
      renderGame();
    }
  };
  $('bAuto').onclick = () => { autoSpend(p); save(S); toast('Points répartis · générale ' + p.niveau); renderGame(); };
}

/* ---------- Calendrier : vraie grille mensuelle interactive ---------- */
const DOW = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
function entryMeta(e) {
  if (e.type === 'championnat') return { cls: 'ch', lib: 'Championnat', court: 'J' + e.journee };
  if (e.type === 'coupe') { const c = coupeById(S, e.cid); return { cls: 'cp', lib: c ? c.nom : 'Coupe', court: 'CP' }; }
  if (e.type === 'tournoi') return { cls: 'am', lib: 'Tournoi amical', court: 'AM' };
  if (e.type === 'mercato') return { cls: 'me', lib: 'Mercato', court: 'ME' };
  if (e.type === 'barrage') return { cls: 'ba', lib: "Barrage d'accession", court: 'BAR' };
  return { cls: '', lib: e.label || '', court: '' };
}

function viewCalendrier() {
  const parJour = {};
  S.calendar.forEach((e, i) => {
    const d = weekToDate(S.seasonStartYear, e.w);
    const cle = d.toISOString().slice(0, 10);
    (parJour[cle] = parJour[cle] || []).push({ e, i, d });
  });
  const dates = Object.keys(parJour).sort();
  if (!dates.length) return $('body').innerHTML = '<div class="card"><div class="muted">Calendrier vide.</div></div>';

  const premier = new Date(dates[0]), dernier = new Date(dates[dates.length - 1]);
  const aujourdhui = currentDate(S).toISOString().slice(0, 10);
  const mois = [];
  let cur = new Date(Date.UTC(premier.getUTCFullYear(), premier.getUTCMonth(), 1));
  while (cur <= dernier) { mois.push(new Date(cur)); cur.setUTCMonth(cur.getUTCMonth() + 1); }

  const grilles = mois.map(m => {
    const y = m.getUTCFullYear(), mo = m.getUTCMonth();
    const premierJour = new Date(Date.UTC(y, mo, 1));
    const decalage = (premierJour.getUTCDay() + 6) % 7;          // semaine commençant le lundi
    const nbJours = new Date(Date.UTC(y, mo + 1, 0)).getUTCDate();
    const cases = [];
    for (let k = 0; k < decalage; k++) cases.push('<div></div>');
    for (let j = 1; j <= nbJours; j++) {
      const cle = `${y}-${String(mo + 1).padStart(2, '0')}-${String(j).padStart(2, '0')}`;
      const evs = parJour[cle];
      if (!evs) { cases.push(`<div class="cal-day">${j}</div>`); continue; }
      const meta = entryMeta(evs[0].e);
      cases.push(`<button class="cal-day has ${cle === aujourdhui ? 'today' : ''}" data-cal="${evs[0].i}">${j}
        <span class="dot ${meta.cls}"></span></button>`);
    }
    const evsMois = dates.filter(d => d.startsWith(`${y}-${String(mo + 1).padStart(2, '0')}`));
    return `<div class="cal-month">
      <div class="cal-title"><span>${MOIS[mo]} ${y}</span><span class="tiny">${evsMois.length} rendez-vous</span></div>
      <div class="cal-grid">${DOW.map(d => `<div class="cal-dow">${d}</div>`).join('')}${cases.join('')}</div>
    </div>`;
  }).join('');

  const prochains = S.calendar.slice(S.calIndex, S.calIndex + 5).map((e, k) => {
    const i = S.calIndex + k, meta = entryMeta(e);
    return `<button class="calrow ${k === 0 ? 'now' : ''}" data-cal="${i}">
      <div class="w">${meta.court}</div>
      <div class="t">${meta.lib}<div class="tiny">${fmtDate(weekToDate(S.seasonStartYear, e.w))}${e.journee ? ' · journée ' + e.journee : ''}</div></div>
      <span class="pill2">${k === 0 ? 'prochain' : 'à venir'}</span></button>`;
  }).join('');

  $('body').innerHTML = `
    <div class="sec">Saison ${S.seasonStartYear}/${String(S.seasonStartYear + 1).slice(2)}</div>
    <div class="card tight">${prochains || '<div class="muted">Saison terminée.</div>'}</div>
    <div class="sec">Calendrier complet</div>
    <div class="card">${grilles}
      <div class="cal-legend">
        <span><i style="background:var(--acc)"></i>Championnat</span>
        <span><i style="background:var(--gold)"></i>Coupe</span>
        <span><i style="background:var(--acc2)"></i>Amical</span>
        <span><i style="background:#b07ce0"></i>Mercato</span>
        <span><i style="background:var(--bad)"></i>Barrage</span>
      </div></div>`;
  document.querySelectorAll('[data-cal]').forEach(b => b.onclick = () => showCalEntry(+b.dataset.cal));
}

/* ---------- Coupes : tous les tableaux en cours ---------- */
let COUPE_SEL = null;
function viewCoupes() {
  const coupes = (S.coupes || []);
  const tournois = S.tournois.filter(t => t.saison === S.season);
  const onglets = coupes.map(c => ({ k: c.id, n: c.nom }))
    .concat(tournois.length ? [{ k: 'amicaux', n: 'Amicaux' }] : [])
    .concat((S.coupesHisto || []).length ? [{ k: 'histo', n: 'Historique' }] : []);
  if (!onglets.find(o => o.k === COUPE_SEL)) COUPE_SEL = onglets.length ? onglets[0].k : null;

  let corps;
  if (!onglets.length) corps = '<div class="card"><div class="muted">Aucune coupe engagée pour le moment.</div></div>';
  else if (COUPE_SEL === 'amicaux') corps = tournois.map(t => bracketHTML(t)).join('');
  else if (COUPE_SEL === 'histo') corps = `<div class="card tight">${(S.coupesHisto || []).slice().reverse().map(c =>
      `<div class="mrow"><div class="d">S${c.saison}</div><div class="t">${c.nom}
        <div class="tiny">${c.rangAtteint || '—'}</div></div>
        ${c.vainqueur ? '<span class="pill2" style="color:var(--acc)">titre</span>' : ''}</div>`).join('')}</div>`;
  else { const c = coupes.find(x => x.id === COUPE_SEL); corps = c ? koHTML(c) : ''; }

  $('body').innerHTML = `
    <div class="seg">${onglets.map(o => `<button class="segb ${COUPE_SEL === o.k ? 'on' : ''}" data-cs="${o.k}">${o.n}</button>`).join('')}</div>
    ${corps}`;
  document.querySelectorAll('[data-cs]').forEach(b => b.onclick = () => { COUPE_SEL = b.dataset.cs; renderGame(); });
  bindBrackets();
  document.querySelectorAll('[data-ko]').forEach(b => b.onclick = () => showKoMatch(b.dataset.ko));
}

/* ---------- Classement du championnat ---------- */
let CLASS_DIV = null, CLASS_PAYS = null;
function viewClassement() {
  const maDiv = divDef(clubById(S.clubId).div);
  if (!CLASS_PAYS) CLASS_PAYS = maDiv.pays;

    <div class="seg" style="margin-top:8px">${divs.map(d => `<button class="segb ${CLASS_DIV === d.k ? 'on' : ''}" data-cd="${d.k}">${d.n}</button>`).join('')}</div>
    ${places.length ? `<div class="card tight" style="margin-top:10px">
      ${places.map(x => `<div class="row sb" style="padding:4px 0"><span class="muted">${x.n}</span>
        <b>${x.de === x.a ? x.de + 'e' : x.de + 'e – ' + x.a + 'e'}</b></div>`).join('')}</div>` : ''}
