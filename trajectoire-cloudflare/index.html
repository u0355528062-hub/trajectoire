/* ---------- Compétitions (conservé pour la consultation détaillée) ---------- */
let COMPET = 'championnat';
function viewCompetitions() {
  const club = clubById(S.clubId);
  const div = divDef(club.div);
  const coupes = (S.coupes || []);
  const tournois = S.tournois.filter(t => t.saison === S.season);
  const onglets = [{ k: 'championnat', n: div.n }]
    .concat(coupes.map(c => ({ k: 'coupe:' + c.id, n: c.nom })))
    .concat(tournois.length ? [{ k: 'amicaux', n: 'Amicaux' }] : []);
  if (!onglets.find(o => o.k === COMPET)) COMPET = 'championnat';

  let corps = '';
  if (COMPET === 'championnat') corps = classementHTML();
  else if (COMPET === 'amicaux') corps = tournois.map(t => bracketHTML(t)).join('');
  else {
    const c = coupeById(S, COMPET.slice(6));
    corps = c ? koHTML(c) : '';
  }
  $('body').innerHTML = `
    <div class="seg">${onglets.map(o => `<button class="segb ${COMPET === o.k ? 'on' : ''}" data-cp="${o.k}">${o.n}</button>`).join('')}</div>
    ${corps}`;
  document.querySelectorAll('[data-cp]').forEach(b => b.onclick = () => { COMPET = b.dataset.cp; renderGame(); });
  bindBrackets();
  document.querySelectorAll('[data-ko]').forEach(b => b.onclick = () => showKoMatch(b.dataset.ko));
}

function classementHTML(divKey) {
  const div = divDef(divKey || clubById(S.clubId).div);
  const league = S.leagues[div.k];
  const tab = standings(league);
  const cal = S.calendar.filter(e => e.type === 'championnat');
  const joues = S.historique.filter(h => h.tag === 'championnat').length;
  const mien = div.k === clubById(S.clubId).div;
  return `<div class="card tight"><table>
    <tr><th>#</th><th>Club</th><th>J</th><th>G</th><th>N</th><th>P</th><th>Diff</th><th>Pts</th></tr>
    ${tab.map((t, i) => {
      const c = clubById(t.id);
      const ordre = CFG.DIVISIONS.filter(x => x.pays === div.pays).sort((a, b) => a.niv - b.niv);
      const rang = ordre.findIndex(x => x.k === div.k);
      const aUneDivAuDessus = rang < ordre.length - 1, aUneDivEnDessous = rang > 0;
      const barrage = (aUneDivAuDessus && i === CFG.BARRAGE.placeR2 - 1) ||
        (aUneDivEnDessous && i === tab.length - div.relegues - 1);
      const cls = [t.id === S.clubId ? 'me' : '', i < div.promus ? 'up' : '', i >= tab.length - div.relegues ? 'down' : ''].join(' ');
      return `<tr class="${cls}"><td>${i + 1}${barrage ? '<span style="color:var(--warn)">*</span>' : ''}</td><td>${c.n}</td>
        <td>${t.j}</td><td>${t.g}</td><td>${t.n}</td><td>${t.p}</td>
        <td>${t.bp - t.bc > 0 ? '+' : ''}${t.bp - t.bc}</td><td><b>${t.pts}</b></td></tr>`;
    }).join('')}
  </table>
  <div class="tiny" style="margin-top:8px">${div.promus ? div.promus + ' promu(s)' : 'aucune montée depuis ce niveau'} ·
    ${div.relegues} relégué(s) · * places de barrage${mien ? ` · ${joues}/${cal.length} journées disputées` : ''}
    ${div.statut === 'pro' ? ' · division professionnelle' : div.statut === 'semipro' ? ' · semi-professionnel' : ' · amateur'}</div></div>`;
}

/* Tableau à élimination directe, une carte par affiche. */
function ligueEuropeHTML(c) {
  const table = classementLigueEurope(S, c);
  if (!table.length) return '';
  const zone = r => r.sort === 'huitiemes' ? 'var(--acc)' : r.sort === 'barrages' ? 'var(--warn)' : 'var(--bad)';
  return `<div class="card">
    <div class="row sb"><b style="font-size:15px">${c.nom} — phase de ligue</b>
      <span class="pill2">${table.find(x => x.moi) ? table.find(x => x.moi).rang + 'e' : '—'}</span></div>
    <div class="tiny" style="margin:6px 0 10px">1 à 8 : qualifiés pour les 8es · 9 à 24 : barrages · 25 à 36 : éliminés</div>
    <table>
      <tr><th>#</th><th>Club</th><th>J</th><th>Diff</th><th>Pts</th></tr>
      ${table.map(r => `<tr class="${r.moi ? 'me' : ''}">
        <td style="color:${zone(r)}">${r.rang}</td><td>${clubById(r.id) ? clubById(r.id).n : '—'}</td>
        <td>${r.j}</td><td>${r.bp - r.bc > 0 ? '+' : ''}${r.bp - r.bc}</td><td><b>${r.pts}</b></td></tr>`).join('')}
    </table></div>`;
}

function koHTML(c) {
  if (c.europe && c.ligue) return ligueEuropeHTML(c) + koHTMLTours(c);
  return koHTMLTours(c);
}

function koHTMLTours(c) {
  const me = S.clubId;
  const prochain = !c.elimine && !c.vainqueur ? c.tours.findIndex((t, i) => i >= c.depart && !t.joue) : -1;
  return `<div class="card">
    <div class="row sb"><b style="font-size:16px">${c.nom}</b>
      <span class="pill2" style="${c.vainqueur ? 'color:var(--acc)' : c.elimine ? 'color:var(--bad)' : ''}">${c.rangAtteint || 'en course'}</span></div>
    ${c.depart ? `<div class="tiny" style="margin-top:5px">Entrée en lice au ${c.tours[c.depart].n.toLowerCase()}.</div>` : ''}
  </div>
  ${c.tours.map((t, i) => {
    if (i < c.depart) return '';
    if (!t.joue) {
      const advPrevu = i === prochain ? adversaireCoupe(S, c, i) : null;
      return `<div class="ko-round"><h5>${t.n}</h5>
        <div class="ko-card ${i === prochain ? 'mine' : ''}" style="${c.elimine ? 'opacity:.4' : ''}">
          ${advPrevu ? `<div class="ko-line"><span class="tm">${clubById(me).n}</span><span class="sc">–</span></div>
            <div class="ko-line"><span class="tm">${advPrevu.n}</span><span class="sc">–</span></div>
            <div class="ko-meta">Prochain adversaire · ${origineClub(advPrevu)} · ${advPrevu.ville}</div>`
          : `<div class="ko-line"><span class="tm" style="opacity:.6">${c.elimine ? 'Campagne terminée' : 'Adversaire à désigner'}</span><span class="sc">–</span></div>`}
        </div></div>`;
    }
    const dom = t.home;
    /* Le score réglementaire d'abord ; les tirs au but sont indiqués
       à part, ils ne modifient jamais le score du match. */
    const monScore = dom ? t.reg_h : t.reg_a, sonScore = dom ? t.reg_a : t.reg_h;
    const tabMoi = t.tabScore ? (dom ? t.tabScore.split('-')[0] : t.tabScore.split('-')[1]) : null;
    const tabLui = t.tabScore ? (dom ? t.tabScore.split('-')[1] : t.tabScore.split('-')[0]) : null;
    return `<div class="ko-round"><h5>${t.n}</h5>
      <button class="ko-card mine" data-ko="${c.id}|${i}">
        <div class="ko-line ${t.gagne ? 'win' : 'lose'}"><span class="tm">${clubById(me).n}</span><span class="sc">${monScore}</span></div>
        <div class="ko-line ${t.gagne ? 'lose' : 'win'}"><span class="tm">${clubById(t.adversaire).n}
          <div class="tiny" style="font-weight:600">${origineClub(clubById(t.adversaire))}</div></span><span class="sc">${sonScore}</span></div>
        ${t.tab ? `<div class="ko-tab" style="text-align:center;margin-top:4px">tirs au but ${tabMoi}-${tabLui}</div>` : ''}
        <div class="ko-meta">${t.date ? t.date + ' · ' : ''}${origineClub(clubById(t.adversaire))} · ${dom ? 'à domicile' : 'à l\'extérieur'}${t.minutes ? ` · vous : ${t.minutes}′, note ${t.note.toFixed(1)}` : ' · vous n\'avez pas joué'}</div>
      </button></div>`;
  }).join('')}`;
}

function showKoMatch(ref) {
  const [cid, ti] = ref.split('|');
  const c = coupeById(S, cid);
  if (!c) return;
  const t = c.tours[+ti];
  const h = S.historique.find(x => x.tag === 'coupe' && x.adversaire === t.adversaire);
  modal(`${c.nom} — ${t.n}`, `
    <div class="card"><div class="row sb">
      <b>${clubById(S.clubId).n}</b><div class="big">${t.home ? t.gh : t.ga}-${t.home ? t.ga : t.gh}</div>
      <b style="text-align:right">${clubById(t.adversaire).n}</b></div>
      ${t.tab ? `<div class="tiny" style="text-align:center;margin-top:4px">Tirs au but ${t.tabScore || ''}</div>` : ''}
      <div class="tiny" style="margin-top:6px">${t.gagne ? 'Qualification' : 'Élimination'}</div>
    </div>
    ${h ? simpleMatchCard(h) + detailMatch(h) : ''}`, () => renderGame());
}

function showCalEntry(i) {
  const e = S.calendar[i];
  if (!e) return;
  const dt = fmtDateLong(weekToDate(S.seasonStartYear, e.w));
  if (e.type === 'mercato') return modal('Mercato', `<div class="card"><b>${e.label}</b>
    <div class="muted" style="margin-top:6px">${dt}. Fenêtre de transferts : les clubs qui vous ont observé peuvent formuler une offre.</div></div>`, () => renderGame());
  if (e.type === 'tournoi') {
    const T = tournoiById(S, e.tid);
    return modal(T ? T.nom : e.label, T ? bracketHTML(T) : '', () => renderGame());
  }
  if (e.type === 'coupe') {
    const c = coupeById(S, e.cid);
    return modal(c ? c.nom : e.label, c ? koHTML(c) : '', () => renderGame());
  }
  if (e.type === 'barrage') {
    const b = S.barrage;
    return modal("Barrage d'accession", `<div class="card">
      <div class="tiny">${dt}</div>
      <div class="row sb" style="margin-top:8px"><b style="flex:1">${clubById(e.duel.clubHaut).n}</b>
        <div class="big">${b ? b.gh + '-' + b.ga : '–'}</div>
        <b style="flex:1;text-align:right">${clubById(e.duel.clubBas).n}</b></div>
      ${b && b.tab ? `<div class="tiny" style="text-align:center;margin-top:4px">Tirs au but ${b.tabScore || ''}</div>` : ''}
      <div class="muted" style="margin-top:8px">Match unique. Le vainqueur évoluera en ${divDef(e.duel.divHaut).n} la saison prochaine.</div>
    </div>`, () => renderGame());
  }
  if (e.type === 'tournoi') {
    const T = tournoiById(S, e.tid);
    return modal(T ? T.nom : e.label, T ? bracketHTML(T) : '', () => renderGame());
  }
  const league = currentLeague(S);
  const jour = league && league.fixtures ? league.fixtures[e.journee - 1] : null;
  const fx = jour && jour.find(m => m.h === S.clubId || m.a === S.clubId);
  if (!fx) return modal(`Journée ${e.journee}`, `<div class="card"><div class="muted">
    Cette journée n'est plus disponible : votre club a changé de division depuis.</div></div>`, () => renderGame());
  const dom = fx.h === S.clubId, adv = clubById(dom ? fx.a : fx.h);
  const h = S.historique.find(x => x.tag === 'championnat' && x.journee === e.journee);
  const t = standings(league).find(x => x.id === adv.id);
  const rangAdv = standings(league).findIndex(x => x.id === adv.id) + 1;
  modal(`Journée ${e.journee}`, h ? simpleMatchCard(h) + detailMatch(h) : `<div class="card">
    <div class="row sb"><div><div class="tiny">${dt}</div><b style="font-size:16px">${dom ? 'Réception' : 'Déplacement'}</b>
      <div class="muted" style="margin-top:3px">${adv.n}</div></div>
      <div class="crest" style="width:44px;height:44px">${initials(adv.n)}</div></div>
    <div class="sep"></div>
    <div class="row sb"><span class="muted">Classement</span><b>${rangAdv}<sup>e</sup> · ${t.pts} pts</b></div>
    <div class="row sb" style="margin-top:6px"><span class="muted">Stade</span><b>${dom ? clubById(S.clubId).stade : adv.stade}</b></div>
    <div class="row sb" style="margin-top:6px"><span class="muted">Bilan adverse</span><b>${t.g}V ${t.n}N ${t.p}D</b></div>
  </div>`, () => renderGame());
}

function detailMatch(m) {
  const p = S.player;
  if (!m.minutes) return '';
  const l = (a, b) => `<div class="row sb" style="padding:3px 0"><span class="muted">${a}</span><b>${b}</b></div>`;
  return `<div class="card">
    ${l('Tirs (cadrés)', `${m.tirs} (${m.tirs_cadres})`)}
    ${l('Passes', `${m.passes_reussies}/${m.passes}`)}
    ${l('Duels gagnés', `${m.duels_gagnes}/${m.duels}`)}
    ${p.pos === 'GB' ? l('Arrêts', m.arrets) + l('Clean sheet', m.cleanSheet ? 'oui' : 'non') : l('Tacles / interceptions', `${m.tacles} / ${m.interceptions}`)}
    ${l('Fautes', m.fautes)}
    ${l('Cartons', m.rouge ? 'rouge' : m.jaune ? 'jaune' : '—')}
  </div>`;
}

/* ---------- Stats : carrière ou saison par saison ---------- */
function viewStats() {
  const p = S.player;
  const saisons = S.saisons;
  const options = [{ k: 'carriere', n: 'Carrière' }, { k: 'encours', n: `Saison en cours` }]
    .concat(saisons.slice().reverse().map(b => ({ k: 's' + b.saison, n: b.annee })));
  if (!options.find(o => o.k === STAT_VIEW)) STAT_VIEW = 'carriere';

  let st, titre, sous;
  if (STAT_VIEW === 'carriere') { st = statsCarriere(S); titre = 'Toutes saisons confondues'; sous = `${saisons.length} saison(s) terminée(s) + saison en cours`; }
  else if (STAT_VIEW === 'encours') { st = S.stats; titre = `${S.seasonStartYear}/${String(S.seasonStartYear + 1).slice(2)}`; sous = `${clubById(S.clubId).n} · ${divDef(clubById(S.clubId).div).n}`; }
  else { const b = saisons.find(x => 's' + x.saison === STAT_VIEW); st = b.stats; titre = b.annee; sous = `${b.club} · ${b.division} · ${b.rang}e`; }

  const note = moyenneNote(st.notes);
  const gk = p.pos === 'GB';
  const bloc = (arr) => `<div class="grid3">${arr.map(([v, n]) => `<div class="stat"><b>${v}</b><span>${n}</span></div>`).join('')}</div>`;

  $('body').innerHTML = `
  <div class="seg">${options.map(o => `<button class="segb ${STAT_VIEW === o.k ? 'on' : ''}" data-sv="${o.k}">${o.n}</button>`).join('')}</div>
  <div class="sec">${titre}</div>
  <div class="card"><div class="muted">${sous}</div></div>
  ${bloc([[st.matchs, 'Matchs'], [st.titularisations, 'Titulaire'], [st.entrees, 'Entrées']])}
  <div style="height:9px"></div>
  ${bloc([[st.minutes, 'Minutes'], [note ?? '—', 'Note moy.'], [st.hommes_du_match, 'Homme du match']])}
  <div class="sec">${gk ? 'Gardien' : 'Offensif'}</div>
  ${gk ? bloc([[st.clean_sheets, 'Clean sheets'], [st.arrets, 'Arrêts'], [st.buts_encaisses, 'Buts encaissés']])
       : bloc([[st.buts, 'Buts'], [st.passes_d, 'Passes D'], [st.tirs_cadres + '/' + st.tirs, 'Tirs cadrés']])}
  ${gk ? `<div style="height:9px"></div>${bloc([[st.matchs ? (st.buts_encaisses / Math.max(1, st.matchs)).toFixed(2) : '—', 'Encaissés/match'],
      [st.matchs ? Math.round(st.clean_sheets / Math.max(1, st.matchs) * 100) + '%' : '—', '% clean sheet'],
      [st.passes_reussies + '/' + st.passes, 'Passes']])}` : ''}
  <div class="sec">Jeu</div>
  ${bloc([[st.passes ? Math.round(st.passes_reussies / st.passes * 100) + '%' : '—', 'Précision passe'],
    [st.duels ? Math.round(st.duels_gagnes / st.duels * 100) + '%' : '—', 'Duels gagnés'],
    [st.interceptions + st.tacles, 'Tacles + interc.']])}
  <div style="height:9px"></div>
  ${bloc([[st.jaunes, 'Jaunes'], [st.rouges, 'Rouges'], [st.am_matchs, 'Amicaux']])}
  ${STAT_VIEW === 'carriere' && saisons.length ? `<div class="sec">Saison par saison</div>
    <div class="card tight"><table>
      <tr><th>An</th><th>Club</th><th>M</th><th>${gk ? 'CS' : 'B'}</th><th>${gk ? 'BE' : 'PD'}</th><th>Note</th><th>Gén</th></tr>
      ${saisons.map(b => `<tr><td>${b.annee.slice(2)}</td><td>${b.club}</td><td>${b.stats.matchs}</td>
        <td>${gk ? b.stats.clean_sheets : b.stats.buts}</td><td>${gk ? b.stats.buts_encaisses : b.stats.passes_d}</td>
        <td>${b.note ?? '—'}</td><td><b>${b.niveau}</b></td></tr>`).join('')}
    </table></div>` : ''}
  ${STAT_VIEW.startsWith('s') && STAT_VIEW !== 'carriere' ? `<div style="height:10px"></div>
    <button class="btn sec2" id="bBilan">Voir le bilan complet de la saison</button>` : ''}`;

  /* Classements de la saison et palmarès complet */
  const bloc2 = (titre, liste) => `<div class="sec">${titre}</div><div class="card tight">
    ${liste.map(x => `<div class="mrow ${x.moi ? '' : ''}" style="${x.moi ? 'background:rgba(49,224,122,.10);border-radius:8px' : ''}">
      <div class="d">${x.rang}</div><div class="t">${esc(x.nom)}<div class="tiny">${esc(x.club)}</div></div>
      <b>${x.total}</b></div>`).join('')}</div>`;
  const sup = document.createElement('div');
  sup.innerHTML = `
    ${bloc2('Classement des buteurs · championnat', classementButeurs(S, 'championnat', 'buts'))}
    ${bloc2('Classement des passeurs · championnat', classementButeurs(S, 'championnat', 'passes'))}
    <div class="sec">Trophées et distinctions</div>
    <div class="card tight">${S.palmares.length ? S.palmares.slice().reverse().map(t => `<div class="mrow">
      <div class="d">${t.individuel ? '🏅' : '🏆'}</div><div class="t">${esc(t.titre)}
        <div class="tiny">Saison ${t.saison} · ${esc(t.club)}</div></div></div>`).join('')
      : '<div class="muted">Aucun trophée pour l\'instant.</div>'}</div>`;
  $('body').appendChild(sup);
  document.querySelectorAll('[data-sv]').forEach(b => b.onclick = () => { STAT_VIEW = b.dataset.sv; renderGame(); });
  if ($('bBilan')) $('bBilan').onclick = () => {
    const b = saisons.find(x => 's' + x.saison === STAT_VIEW);
    if (b) showSeasonEnd(b, true);
  };
}

    <tr><th>#</th><th>Club</th><th>J</th><th>Diff</th><th>Pts</th></tr>
    ${cls.map((t, i) => `<tr class="${t.id === b.clubId ? 'me' : ''}"><td>${i + 1}</td><td>${clubById(t.id).n}</td>
      <td>${t.j}</td><td>${t.bp - t.bc > 0 ? '+' : ''}${t.bp - t.bc}</td><td><b>${t.pts}</b></td></tr>`).join('')}
  </table></div>` : ''}
  `;
  const suite = () => {
    if (!consult && S.retraiteProposee) return showRetraite(S.retraiteProposee);
    renderGame();
  };
  const afficher = () => modal(consult ? `Saison ${b.annee}` : 'Bilan de saison', html, suite);
  const ballon = (b.distinctions || []).find(x => x.k === 'ballondor');
  const suiteTrophees = () => {
    if (!consult && b.trophees && b.trophees.length) showTrophee(b.trophees, afficher);
    else afficher();
  };
  if (!consult && ballon) showBallonOr(ballon, suiteTrophees);
  else if (!consult && b.nomination) showNomination(b.nomination, suiteTrophees);
  else suiteTrophees();
}

/* ---------- Fin de carrière ---------- */
function showRetraite(fin) {
  const p = S.player;
  const age = ageAt(p.naissance, currentDate(S));
  S.retraiteProposee = null;
  if (fin.force) return finCarriere(fin.raison);
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;z-index:140;overflow:auto;background:linear-gradient(178deg,#0d1430,#070b18)';
  d.innerHTML = `<div style="max-width:560px;margin:0 auto">
    <div class="topbar"><div class="tb-t">Continuer ou arrêter ?</div></div>
    <div class="wrap fade">
      <div class="card"><div class="muted" style="font-size:14px;line-height:1.6">${esc(fin.raison)}
        Vous avez ${age} ans, ${S.saisons.length} saison(s) derrière vous et une générale de ${p.niveau}.</div></div>
      <div class="sec">Votre décision</div>
      <button class="opt" id="bContinuer"><div><b>Continuer une saison de plus</b>
        <span>Le déclin s'accentuera, mais tout n'est pas encore fini.</span></div></button>
      <button class="opt" id="bStop"><div><b>Raccrocher</b>
        <span>Mettre un terme à la carrière et dresser le bilan.</span></div></button>
    </div></div>`;
  document.body.appendChild(d);
  d.querySelector('#bContinuer').onclick = () => { d.remove(); save(S); renderGame(); };
  d.querySelector('#bStop').onclick = () => { d.remove(); finCarriere('Décision personnelle : il était temps.'); };
}

function finCarriere(raison) {
  const b = prendreRetraite(S, raison);
  const t = b.totaux;
  const bloc = (arr) => `<div class="grid3">${arr.map(([v, n]) => `<div class="stat"><b>${v}</b><span>${n}</span></div>`).join('')}</div>`;
  const gk = S.player.pos === 'GB';
  modal('Fin de carrière', `
    <div class="hero"><div class="tiny">CARRIÈRE TERMINÉE</div>
      <div class="big" style="margin-top:6px">${esc(S.player.prenom)} ${esc(S.player.nom)}</div>
      <div class="muted" style="margin-top:4px">${b.age} ans · ${b.saisons} saisons · ${posDef(S.player.pos).n}</div>
      <div class="tiny" style="margin-top:8px">${esc(raison)}</div></div>
    ${bloc([[t.matchs, 'Matchs'], [t.minutes.toLocaleString('fr-FR'), 'Minutes'], [b.note ?? '—', 'Note moy.']])}
    <div style="height:9px"></div>
    ${gk ? bloc([[t.clean_sheets, 'Clean sheets'], [t.arrets, 'Arrêts'], [t.buts_encaisses, 'Encaissés']])
         : bloc([[t.buts, 'Buts'], [t.passes_d, 'Passes D'], [t.hommes_du_match, 'Homme du match']])}
    <div style="height:9px"></div>
    ${bloc([[b.niveauMax, 'Générale max'], [b.niveauXp, 'Niveau atteint'], [b.titres, 'Trophées']])}
    <div class="sec">Faits marquants</div>
    <div class="card">
      <div class="row sb"><span class="muted">Carte de départ</span><b>${b.carte}</b></div><div class="sep"></div>
      <div class="row sb"><span class="muted">Estimation initiale</span><b>${b.estim[0]}–${b.estim[1]} · atteint ${b.niveauMax}</b></div><div class="sep"></div>
      ${b.meilleureSaisonButs ? `<div class="row sb"><span class="muted">Meilleure saison (buts)</span><b>${b.meilleureSaisonButs.v} en ${b.meilleureSaisonButs.annee}</b></div><div class="sep"></div>` : ''}
      ${b.meilleureSaisonNote ? `<div class="row sb"><span class="muted">Meilleure moyenne</span><b>${b.meilleureSaisonNote.v} en ${b.meilleureSaisonNote.annee}</b></div><div class="sep"></div>` : ''}
      <div class="row sb"><span class="muted">Montées / descentes</span><b>${b.promotions} / ${b.relegations}</b></div><div class="sep"></div>
      <div class="row sb"><span class="muted">Coupes remportées</span><b>${b.coupes}</b></div><div class="sep"></div>
      <div class="row sb"><span class="muted">Clubs</span><b style="text-align:right">${b.clubs.join(', ')}</b></div><div class="sep"></div>
      <div class="row sb"><span class="muted">Gains de carrière</span><b>${b.gains.toLocaleString('fr-FR')} €</b></div>
    </div>
    ${b.palmares.length ? `<div class="sec">Palmarès</div><div class="card tight">
      ${b.palmares.map(x => `<div class="mrow"><div class="d">S${x.saison}</div><div class="t">${x.titre}
        <div class="tiny">${x.club}</div></div></div>`).join('')}</div>`
      : '<div class="card"><div class="muted">Aucun trophée. La plupart des carrières se terminent comme ça.</div></div>'}
  `, () => renderHome());
}

function modal(titre, html, onClose) {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;z-index:120;overflow:auto;background:linear-gradient(178deg,#0a1027,#070b18)';
  d.innerHTML = `<div style="max-width:560px;margin:0 auto">
    <div class="topbar"><div class="tb-t">${titre}</div>
      <div class="lvlbadge"><button class="chip" id="mTop">Continuer</button></div></div>
    <div class="wrap fade">${html}<div style="height:8px"></div>
    <button class="btn" id="mOk">Continuer</button><div style="height:26px"></div></div></div>`;
  document.body.appendChild(d);
  const fermer = () => { d.remove(); onClose && onClose(); };
  d.querySelector('#mOk').onclick = fermer;
  const haut = d.querySelector('#mTop');
  if (haut) haut.onclick = fermer;
}


/* ============================================================
   BOOT
   ============================================================ */
function boot() {
  /* Repère visible immédiatement : si ce numéro ne correspond pas à la
     dernière version livrée, c'est un ancien fichier qui est ouvert
     (cache du navigateur ou fichier téléchargé précédemment). */
  renderHome();
}
if (typeof document !== 'undefined' && document.getElementById) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}
</script>
