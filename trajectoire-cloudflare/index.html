<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0c0f14">
<title>TRAJECTOIRE — carrière de footballeur</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icone.svg">
<link rel="apple-touch-icon" href="/icone.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg0:#070b18; --bg1:#0d1430; --bg2:#111a3d;
  --panel:rgba(20,29,60,.92); --panel2:rgba(28,39,76,.85); --panel3:rgba(38,50,92,.6);
  --line:rgba(120,150,220,.16); --line2:rgba(120,150,220,.30);
  --txt:#eaf0ff; --dim:#93a3ca; --dim2:#6577a3;
  --acc:#31e07a; --acc2:#17c4d8; --gold:#f2c14b;
  --bad:#ff5f57; --warn:#f5a623;
  --r:16px;
  color-scheme: dark only;
}
html,body{margin:0;padding:0;color:var(--txt);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{min-height:100vh;
  background:
    radial-gradient(1100px 620px at 82% -8%, rgba(23,196,216,.16), transparent 60%),
    radial-gradient(900px 560px at 6% 4%, rgba(94,63,209,.20), transparent 62%),
    radial-gradient(800px 800px at 50% 108%, rgba(49,224,122,.10), transparent 60%),
    linear-gradient(178deg,#0a1027 0%,#0b1430 45%,#070b18 100%);
  background-attachment:fixed}
#app{max-width:560px;margin:0 auto;padding:0 0 84px;position:relative}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font-family:inherit;font-size:15px;color:var(--txt);background:rgba(10,16,38,.8);
  border:1px solid var(--line2);border-radius:11px;padding:12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc)}
sup{font-size:.62em}

/* ---------- Barre haute ---------- */
.topbar{position:sticky;top:0;z-index:40;padding:12px 16px;display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,rgba(9,14,34,.98),rgba(9,14,34,.78));backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.crest{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:900;
  background:linear-gradient(145deg,var(--acc2),#2a6ef0);color:#04101c;flex:none}
.tb-t{font-size:15px;font-weight:800;line-height:1.15}
.tb-s{font-size:11.5px;color:var(--dim);margin-top:2px}
.lvlbadge{margin-left:auto;display:flex;align-items:center;gap:9px}
.ovbox{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:19px;font-weight:900;
  background:linear-gradient(150deg,rgba(49,224,122,.22),rgba(23,196,216,.16));border:1px solid rgba(49,224,122,.42)}
.ptbadge{font-size:11px;font-weight:800;color:#06210f;background:var(--acc);padding:4px 9px;border-radius:999px}

/* ---------- Onglets bas ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;z-index:50;
  background:linear-gradient(0deg,rgba(7,11,24,.99),rgba(9,14,34,.92));backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px 12px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;font-size:9.5px;
  color:var(--dim2);font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:11px}
.tab .ic{font-size:16px;line-height:1}
.tab.on{color:var(--acc)}

/* ---------- Blocs ---------- */
.wrap{padding:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.32)}
.card.tight{padding:10px 12px}
.card.glass{background:var(--panel2)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim2);font-weight:800;margin:18px 3px 9px}
.row{display:flex;align-items:center;gap:10px}
.row.sb{justify-content:space-between}
.muted{color:var(--dim);font-size:13px;line-height:1.55}
.tiny{font-size:11px;color:var(--dim2);line-height:1.45}
.big{font-size:27px;font-weight:900;letter-spacing:-.03em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel3);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px;font-weight:900}
.stat span{font-size:9.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.07em;font-weight:700}

.btn{display:block;width:100%;font-weight:800;font-size:15px;padding:15px;border-radius:13px;text-align:center;
  background:linear-gradient(135deg,var(--acc),#12c46a);color:#04210f;transition:transform .08s;
  box-shadow:0 8px 24px rgba(49,224,122,.22)}
.btn:active{transform:scale(.985)}
.btn.blue{background:linear-gradient(135deg,var(--acc2),#2a6ef0);color:#02121e;box-shadow:0 8px 24px rgba(23,196,216,.2)}
.btn.sec2{background:var(--panel2);color:var(--txt);border:1px solid var(--line2);box-shadow:none;font-weight:700}
.btn.ghost{background:none;border:1px solid var(--line2);color:var(--dim);font-weight:700;padding:12px;box-shadow:none}
.btn[disabled]{opacity:.38;pointer-events:none}

.opt{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:12px;margin-bottom:8px;text-align:left;width:100%}
.opt.on{border-color:var(--acc);background:linear-gradient(135deg,rgba(49,224,122,.14),rgba(23,196,216,.07))}
.opt b{font-size:14px;display:block}
.opt span{font-size:11.5px;color:var(--dim);display:block;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 13px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);
  font-size:12.5px;font-weight:700;color:var(--dim)}
.chip.on{background:linear-gradient(135deg,var(--acc),#12c46a);color:#04210f;border-color:transparent}

/* ---------- Attributs façon fiche de jeu ---------- */
.atgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.atcol h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:9px;font-weight:800}
.atrow{display:flex;align-items:center;gap:8px;padding:5px 0;width:100%;text-align:left}
.atrow .n{flex:1;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atrow .v{font-size:13px;font-weight:900;width:24px;text-align:right}
.atrow .up{font-size:11px;font-weight:900;color:var(--acc);width:14px;text-align:center}
.atline{height:3px;border-radius:2px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:1px}
.atline i{display:block;height:100%;border-radius:2px}
.atwrap{flex:1;min-width:0}

/* ---------- Barre d'XP ---------- */
.xpbar{height:9px;border-radius:6px;background:rgba(255,255,255,.09);overflow:hidden;position:relative}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));
  box-shadow:0 0 14px rgba(49,224,122,.5);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}

/* ---------- Tableaux ---------- */
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim2);font-weight:800;text-align:right;padding:6px 3px}
th:nth-child(2){text-align:left}
td{padding:7px 3px;text-align:right;border-top:1px solid var(--line)}
td:nth-child(2){text-align:left;font-weight:600}
tr.me td{background:rgba(49,224,122,.12)}
tr.up td:first-child{color:var(--acc)} tr.down td:first-child{color:var(--bad)}

.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.mrow:first-child{border-top:0}
.mrow .d{width:40px;font-size:10.5px;color:var(--dim2);font-weight:800}
.mrow .t{flex:1;font-size:13px;min-width:0}
.mrow .s{font-weight:900;font-size:14px}
.note{font-weight:900;font-size:12.5px;padding:3px 8px;border-radius:9px;background:var(--panel3)}
.note.g{background:rgba(49,224,122,.18);color:var(--acc)}
.note.b{background:rgba(255,95,87,.16);color:var(--bad)}

/* ---------- Tableau de tournoi ---------- */
.brk{display:flex;flex-direction:column;gap:12px}
.brkround{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px}
.brkround h5{margin:0 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--dim2)}
.brkm{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
.brkm:first-of-type{border-top:0}
.brkm .tm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brkm .tm.win{font-weight:800;color:var(--acc)}
.brkm .tm.mine{color:var(--acc2)}
.brkm .sc{font-weight:900;font-size:13px;background:var(--panel3);padding:3px 9px;border-radius:8px}

/* ---------- Carte ---------- */
.cardwrap{perspective:1200px;display:flex;justify-content:center;padding:6px 0 2px}
.pcard{width:236px;height:340px;border-radius:20px;position:relative;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.15)}
.pcard .bgw{position:absolute;inset:0;background:linear-gradient(158deg,var(--c1) 0%,var(--c2) 100%)}
.pcard .sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.22) 48%,transparent 62%);
  transform:translateX(-120%);animation:sheen 3.8s ease-in-out infinite}
@keyframes sheen{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.pcard .in{position:relative;height:100%;padding:15px;display:flex;flex-direction:column;color:#0b1208}
.pcard.dark .in{color:#f2f6fa}
.pcard .ov{font-size:41px;font-weight:900;line-height:.95;letter-spacing:-.04em}
.pcard .pp{font-size:11.5px;font-weight:800;letter-spacing:.08em;opacity:.85}
.pcard .nm{margin-top:auto;font-size:19px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.pcard .cl{font-size:11px;font-weight:700;opacity:.82;margin-top:2px}
.pcard .rar{font-size:9.5px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;opacity:.85}
.pcard .sil{position:absolute;right:-12px;top:54px;font-size:148px;opacity:.13;line-height:1}
.pcard .sx{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px;
  border-top:1px solid rgba(0,0,0,.2);padding-top:8px}
.pcard.dark .sx{border-top-color:rgba(255,255,255,.22)}
.pcard .sx div{text-align:center}
.pcard .sx b{display:block;font-size:14px;font-weight:900}
.pcard .sx span{font-size:8px;font-weight:800;opacity:.78;letter-spacing:.05em}

/* ---------- Révélation ---------- */
#reveal{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:22px;text-align:center;
  background:radial-gradient(700px 500px at 50% 40%,#101c3f,#05070f 78%)}
#reveal .halo{position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(62px);opacity:0;transition:opacity 1s}
.rv-step{opacity:0;transform:translateY(10px);transition:all .6s cubic-bezier(.2,.8,.2,1)}
.rv-step.on{opacity:1;transform:none}
.rv-t{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim2);font-weight:800}
.rv-r{font-size:27px;font-weight:900;letter-spacing:-.02em}
.flip{animation:flip 1.05s cubic-bezier(.3,.9,.25,1) both}
@keyframes flip{0%{transform:rotateY(180deg) scale(.7);opacity:0}60%{transform:rotateY(0) scale(1.06);opacity:1}100%{transform:rotateY(0) scale(1)}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.parts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pt{position:absolute;width:5px;height:5px;border-radius:50%;opacity:0;animation:pt 1.6s ease-out forwards}
@keyframes pt{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}

/* ---------- Divers ---------- */
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:150;background:var(--panel);
  border:1px solid var(--line2);border-radius:12px;padding:11px 16px;font-size:13px;font-weight:700;animation:fade .2s}
.sep{height:1px;background:var(--line);margin:11px 0}
.evt{background:var(--panel3);border-left:2px solid var(--acc);border-radius:9px;padding:10px 12px;
  font-size:12.5px;margin-bottom:7px;line-height:1.45}
.evt.bad{border-left-color:var(--bad)}
.evt.ok{border-left-color:var(--acc2)}
.hero{background:linear-gradient(150deg,rgba(40,58,120,.75),rgba(16,24,55,.9));border:1px solid var(--line2);
  border-radius:19px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(49,224,122,.20),transparent 70%)}
.lvlring{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:17px;
  background:conic-gradient(var(--acc) var(--p),rgba(255,255,255,.10) 0);position:relative}
.lvlring:before{content:'';position:absolute;inset:4px;border-radius:50%;background:#101836}
.lvlring span{position:relative;z-index:1}
.slotcard{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.slotcard.empty{border-style:dashed;opacity:.75}

/* ---------- Révélation spéciale (paliers rares) ---------- */
#reveal.special{background:radial-gradient(760px 560px at 50% 45%,#1a1030,#04060d 78%)}
.beam{position:absolute;width:3px;height:0;background:linear-gradient(180deg,transparent,#fff,transparent);
  filter:blur(1px);opacity:0;transition:height .7s ease,opacity .4s}
.beam.on{height:100vh;opacity:.55}
.flash{position:absolute;inset:0;background:#fff;animation:flash .85s ease-out forwards;pointer-events:none;z-index:5}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.bandeau{font-size:11px;font-weight:900;letter-spacing:.3em;padding:7px 16px;border-radius:999px;
  background:linear-gradient(120deg,#f2c14b,#fff6d0);color:#241a02;animation:pop .6s cubic-bezier(.2,1.4,.3,1) both}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.dots{display:flex;gap:7px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--dim2);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.pcard.legendaire{box-shadow:0 20px 60px rgba(242,193,75,.35),0 0 0 1px rgba(255,255,255,.35)}
.pcard.bigreveal{animation:bigreveal 1.1s cubic-bezier(.2,1.2,.25,1) both}
@keyframes bigreveal{0%{transform:scale(.4) rotateY(180deg);opacity:0}55%{transform:scale(1.12) rotateY(0);opacity:1}100%{transform:scale(1)}}

/* ---------- Divers v0.7 ---------- */
.dateline{font-size:11px;color:var(--dim);font-weight:700}
.pill2{display:inline-block;padding:4px 10px;border-radius:999px;font-size:10.5px;font-weight:800;
  background:var(--panel3);border:1px solid var(--line);color:var(--dim)}
.calrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.calrow:first-child{border-top:0}
.calrow.now{background:rgba(49,224,122,.08);border-radius:10px;padding-left:8px;padding-right:8px}
.calrow .w{width:52px;font-size:10px;color:var(--dim2);font-weight:800}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.seg::-webkit-scrollbar{display:none}
.segb{flex:none;padding:8px 13px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
  font-size:12px;font-weight:700;color:var(--dim);white-space:nowrap}
.segb.on{background:linear-gradient(135deg,var(--acc),#12c46a);color:#04210f;border-color:transparent}
.ovbig{font-size:44px;font-weight:900;letter-spacing:-.04em;line-height:1}
.confirm{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:22px;
  background:rgba(4,7,15,.82);backdrop-filter:blur(6px)}
.confirm .box{background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:18px;max-width:340px;width:100%}

/* ---------- v1.0 : calendrier, compétitions, direct ---------- */
.tabbar{grid-template-columns:repeat(6,1fr)}
.tab{font-size:8.5px}
.cal-month{margin-bottom:16px}
.cal-title{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  margin:0 2px 9px;display:flex;justify-content:space-between;align-items:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:9px;color:var(--dim2);text-align:center;font-weight:800;padding-bottom:3px}
.cal-day{aspect-ratio:1;border-radius:9px;background:rgba(255,255,255,.03);border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--dim2);position:relative}
.cal-day.has{background:var(--panel2);border-color:var(--line2);color:var(--txt);font-weight:700}
.cal-day.today{border-color:var(--acc);box-shadow:0 0 0 1px rgba(49,224,122,.35)}
.cal-day .dot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%}
.cal-day .dot.ch{background:var(--acc)} .cal-day .dot.cp{background:var(--gold)}
.cal-day .dot.am{background:var(--acc2)} .cal-day .dot.me{background:#b07ce0}
.cal-day .dot.ba{background:var(--bad)}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.cal-legend span{font-size:10px;color:var(--dim2);display:flex;align-items:center;gap:5px}
.cal-legend i{width:7px;height:7px;border-radius:50%;display:block}

/* Tableau à élimination directe */
.ko-round{margin-bottom:14px}
.ko-round h5{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  border-bottom:2px solid var(--acc2);padding-bottom:6px;display:inline-block}
.ko-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;width:100%;text-align:left}
.ko-card.mine{border-color:rgba(49,224,122,.5);background:linear-gradient(135deg,rgba(49,224,122,.10),rgba(23,196,216,.05))}
.ko-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}
.ko-line .tm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ko-line.win .tm{font-weight:800}
.ko-line.lose .tm{opacity:.5}
.ko-line .sc{font-weight:900;font-size:15px;min-width:22px;text-align:right}
.ko-meta{font-size:10.5px;color:var(--dim2);margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.ko-tab{font-size:10px;color:var(--gold);font-weight:800}

/* Match en direct */
#live{position:fixed;inset:0;z-index:160;overflow:hidden;display:flex;flex-direction:column;
  background:radial-gradient(700px 500px at 50% 0%,#132046,#05070f 75%)}
.live-head{padding:16px;text-align:center;border-bottom:1px solid var(--line)}
.live-score{font-size:40px;font-weight:900;letter-spacing:-.03em;margin-top:6px}
.live-min{font-size:12px;font-weight:800;color:var(--acc);letter-spacing:.14em}
.live-feed{flex:1;overflow-y:auto;padding:14px 16px}
.live-ev{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);animation:fade .25s}
.live-ev .m{width:34px;font-size:11px;font-weight:900;color:var(--dim2)}
.live-ev .x{flex:1;font-size:13px;line-height:1.45}
.live-ev.moi .x{color:var(--txt)}
.live-ev.but .x{color:var(--acc);font-weight:800}
.live-ev.but_contre .x{color:var(--bad)}
.live-ev.jaune .x{color:var(--warn)} .live-ev.rouge .x{color:var(--bad);font-weight:800}
.live-foot{padding:12px 16px 22px;border-top:1px solid var(--line);display:flex;gap:9px}
.statutpill{font-size:9.5px;font-weight:900;letter-spacing:.12em;padding:3px 9px;border-radius:999px;
  background:linear-gradient(120deg,var(--gold),#ffe08a);color:#241a02}

/* ---------- Célébration de trophée ---------- */
#trophee{position:fixed;inset:0;z-index:210;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:24px;text-align:center;background:radial-gradient(700px 520px at 50% 45%,#2a2008,#05070f 78%)}
.tr-halo{position:absolute;width:360px;height:360px;border-radius:50%;filter:blur(70px);
  background:rgba(242,193,75,.55);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:.75;transform:scale(1.08)}}
.tr-cup{font-size:96px;position:relative;animation:cup 1.2s cubic-bezier(.2,1.4,.3,1) both;
  filter:drop-shadow(0 12px 32px rgba(242,193,75,.6))}
@keyframes cup{0%{transform:scale(.2) rotate(-25deg);opacity:0}60%{transform:scale(1.18) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.tr-titre{position:relative;font-size:23px;font-weight:900;letter-spacing:-.02em;margin-top:10px;
  background:linear-gradient(120deg,#fff6d0,#f2c14b);-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:fade .8s .4s both}
.tr-club{position:relative;font-size:13px;color:var(--dim);animation:fade .8s .6s both}

/* ---------- Barre d'onglets : visibilité garantie ---------- */
#app{padding-bottom:104px}
.tabbar{display:none;grid-template-columns:repeat(6,1fr);gap:2px;
  padding:8px 4px calc(12px + env(safe-area-inset-bottom,0px));
  background:rgba(7,11,24,.985);border-top:1px solid var(--line2);z-index:90}
.tabbar.visible{display:grid !important}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:5px 1px;min-height:46px;border-radius:10px;color:var(--dim2);font-weight:800}
.tab .ic{font-size:15px;line-height:1}
.tab .lb{font-size:9px;letter-spacing:.02em;text-transform:none;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab.on{color:var(--acc);background:rgba(255,255,255,.05)}
.bo-etapes{position:relative;text-align:center}
.bo-nom{font-size:22px;font-weight:900;margin-top:10px;color:var(--dim)}
</style>

   CORE — RNG déterministe, distributions, dates, helpers
   ============================================================ */

function hashStr(s) {
  let h = 2166136261 >>> 0; s = String(s);
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* Générateur nommé : même seed + même clé = même suite. Reproductible pour le debug. */
function rngFrom(...parts) { return mulberry32(hashStr(parts.join('|'))); }

function ri(r, a, b) { return a + Math.floor(r() * (b - a + 1)); }
function rf(r, a, b) { return a + r() * (b - a); }
function pick(r, arr) { return arr[Math.min(arr.length - 1, Math.floor(r() * arr.length))]; }
function shuffled(r, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pickN(r, arr, n) { return shuffled(r, arr).slice(0, Math.min(n, arr.length)); }

/* Loi triangulaire : min, max, mode exprimé en fraction [0,1] de la plage. */
function triangular(r, min, max, modeFrac) {
  const c = min + (max - min) * modeFrac, u = r();
  const f = (c - min) / (max - min);
  return u < f
    ? min + Math.sqrt(u * (max - min) * (c - min))
    : max - Math.sqrt((1 - u) * (max - min) * (max - c));
}
/* Loi normale tronquée, utilisée pour les attributs. */
function gauss(r, mu, sd) {
  let u = 0, v = 0;
  while (u === 0) u = r();
  while (v === 0) v = r();
  return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function round1(v) { return Math.round(v * 10) / 10; }
function round2(v) { return Math.round(v * 100) / 100; }

/* Tirage pondéré sur [{p:...}] */
function weightedPick(r, items, key) {
  const total = items.reduce((s, it) => s + (key ? it[key] : it.p), 0);
  let x = r() * total;
  for (const it of items) { x -= (key ? it[key] : it.p); if (x <= 0) return it; }
  return items[items.length - 1];
}

/* Poisson par la méthode de Knuth (petits lambda uniquement, suffisant ici) */
function poisson(r, lambda) {
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do { k++; p *= r(); } while (p > L);
  return k - 1;
}

const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MOIS_C = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];

/* Semaine 0 = 1re semaine d'août de l'année de début de saison. */
function weekToDate(seasonStartYear, week) {
  const d = new Date(Date.UTC(seasonStartYear, 7, 1));
  d.setUTCDate(d.getUTCDate() + week * 7);
  return d;
}
function fmtDate(d) { return `${d.getUTCDate()} ${MOIS_C[d.getUTCMonth()]} ${d.getUTCFullYear()}`; }
function fmtDateLong(d) { return `${d.getUTCDate()} ${MOIS[d.getUTCMonth()]} ${d.getUTCFullYear()}`; }

function ageAt(birthISO, dateObj) {
  const b = new Date(birthISO);
  let a = dateObj.getUTCFullYear() - b.getUTCFullYear();
  const m = dateObj.getUTCMonth() - b.getUTCMonth();
  if (m < 0 || (m === 0 && dateObj.getUTCDate() < b.getUTCDate())) a--;
  return a;
}

/* Interpolation sur une courbe [{a,m}] triée par a. */
function curveAt(curve, x) {
  if (x <= curve[0].a) return curve[0].m;
  const last = curve[curve.length - 1];
  if (x >= last.a) return last.m;
  for (let i = 0; i < curve.length - 1; i++) {
    const A = curve[i], B = curve[i + 1];
    if (x >= A.a && x <= B.a) {
      const t = (x - A.a) / (B.a - A.a);
      return A.m + (B.m - A.m) * t;
    }
  }
  return last.m;
}

/* ============================================================
   PLAYER — générale, attributs, expérience, points
   ------------------------------------------------------------
   Principe central : la générale n'est PAS recalculée à partir des
   attributs. C'est une valeur stockée qui ne bouge que lorsque des
   points sont dépensés, et uniquement sur les attributs qui comptent
   au poste occupé. Monter la défense d'un buteur ne fera jamais
   monter sa générale.
   ============================================================ */

function drawRarity(rng) { return weightedPick(rng, CFG.RARITIES, 'p'); }
function drawXpMul(rng, rarity) { return round2(rf(rng, rarity.xp[0], rarity.xp[1])); }

/* Estimation de générale atteignable.
   Elle part de la carte, mais tient compte de deux choses qui étaient
   ignorées : la générale de départ (on n'estime jamais un plafond
   inférieur ou à peine supérieur à ce que le joueur vaut déjà) et la
   division de départ (commencer haut, c'est finir plus haut). */
function estimRange(rng, rarity, age, niveauDepart, divKey) {
  const [lo, hi] = rarity.estim;
  const mid = triangular(rng, lo, hi, 0.5);
  const jeune = age <= 18 ? 2 : age >= 22 ? -1.5 : 0;
  const div = divKey ? divDef(divKey) : null;
  /* Un joueur créé en Ligue 2 a déjà une base bien supérieure à celle
     d'un joueur de Régional : son horizon suit. */
  const bonusDiv = div ? div.startBonus * 0.8 : 0;
  const base = mid + jeune + bonusDiv;
  /* Plancher : la carte ne peut pas promettre moins que le niveau
     actuel augmenté d'une marge minimale liée à son palier. */
  const margeMini = 4 + rarity.tier * 1.6;
  const bas = Math.max(base - 3, (niveauDepart || 40) + margeMini);
  const haut = Math.max(base + 4, bas + 5);
  return [Math.round(clamp(bas, 40, 97)), Math.round(clamp(haut, 45, 99))];
}

/* Générale de départ : croît avec l'âge et surtout avec la division
   dans laquelle on commence. Un joueur créé directement en Ligue 1
   est déjà un joueur confirmé ; un joueur créé en Régional 2 part de
   très bas. Le plafond suit la division pour rester cohérent.      */
function startOverall(rng, age, divKey) {
  const div = divDef(divKey);
  const base = 44 + (age - 16) * 1.6 + div.startBonus;
  const plafond = clamp(div.standard + 6, 45, 92);
  return clamp(Math.round(base + gauss(rng, 0, 2.4)), 36, plafond);
}

/* ---------- Contribution d'un attribut à la générale ----------
   Proportionnelle à son importance au poste. En dessous du seuil,
   l'attribut est utile en match mais ne fait pas monter la générale. */
function ovGain(pos, k) {
  const w = CFG.POS_WEIGHTS[pos];
  if (!w[k]) return 0;
  const rel = w[k] / Math.max(...Object.values(w));
  if (rel < CFG.OVERALL.seuilUtile) return 0;
  return round2(CFG.OVERALL.gainMax * rel);
}

/* ---------- Génération des attributs ----------
   Cohérence par poste ET par famille : un attaquant démarre avec de
   vraies stats offensives et des stats défensives faibles ; un
   défenseur l'inverse ; un gardien a ses attributs spécifiques.     */
const LINE_GROUP_BIAS = {
  GB:  { gb: 1.00, dri: 0.62, tir: 0.34, pas: 0.62, def: 0.50, vit: 0.60, phy: 0.72 },
  DEF: { gb: 0,    dri: 0.72, tir: 0.50, pas: 0.74, def: 1.00, vit: 0.84, phy: 0.92 },
  MIL: { gb: 0,    dri: 0.90, tir: 0.72, pas: 1.00, def: 0.78, vit: 0.80, phy: 0.84 },
  ATT: { gb: 0,    dri: 0.96, tir: 1.00, pas: 0.80, def: 0.44, vit: 0.94, phy: 0.80 },
};

function tailleMods(taille, pos) {
  const T = CFG.TAILLE, m = {};
  if (pos === 'GB') {
    const d = taille - T.gbReference;
    m.gb_aerien = d * T.gbAerien;      // grand : meilleur dans les airs
    m.gb_vite = -d * T.gbReflexes;     // grand : moins vif au sol
  } else {
    const d = taille - 178;
    m.aerien = d * T.champAerien;
    m.agile = -d * T.champAgilite;
  }
  return m;
}

function genAttrs(rng, pos, profileKey, cible, taille) {
  const w = CFG.POS_WEIGHTS[pos];
  const line = posDef(pos).line;
  const bias = LINE_GROUP_BIAS[line];
  const prof = CFG.PROFILES.find(p => p.k === profileKey) || CFG.PROFILES[6];
  const isGK = pos === 'GB';
  const maxW = Math.max(...Object.values(w));
  const tm = tailleMods(taille, pos);
  const attrs = {};

  for (const g of CFG.ATTR_GROUPS) {
    if (g.k === 'gb' && !isGK) { for (const a of g.attrs) attrs[a.k] = ri(rng, 8, 20); continue; }
    const gb = bias[g.k];
    for (const a of g.attrs) {
      const rel = (w[a.k] || 0) / maxW;
      /* Base de famille (un attaquant est fort en tir, faible en défense)
         puis surcouche liée au poste précis. */
      let mu = cible * (0.42 + 0.42 * gb + 0.28 * rel);
      if (prof.up.includes(a.k)) mu += 5.5;
      if (prof.down.includes(a.k)) mu -= 5.0;
      if (isGK) {
        if (['gb_degagement', 'gb_placement', 'gb_plongeon'].includes(a.k)) mu += tm.gb_aerien || 0;
        if (['gb_reflexes', 'gb_maniement', 'gb_vitesse'].includes(a.k)) mu += tm.gb_vite || 0;
      } else {
        if (['tete_def', 'saut', 'force'].includes(a.k)) mu += tm.aerien || 0;
        if (['agilite', 'equilibre', 'dribble'].includes(a.k)) mu += tm.agile || 0;
      }
      attrs[a.k] = Math.round(clamp(gauss(rng, mu, 3.8), 12, 92));
    }
  }
  return attrs;
}

function createPlayer(opts) {
  const rng = rngFrom(opts.seed, 'player', opts.rerolls || 0);
  const rarity = opts.forcedRarity ? rarDef(opts.forcedRarity) : drawRarity(rng);
  const niveau = startOverall(rng, opts.age, opts.division);

  const est = estimRange(rng, rarity, opts.age, niveau, opts.division);
  /* La fourchette n'est plus indicative : la générale maximale du
     joueur est tirée dedans, et elle ne sera jamais dépassée. */
  const potentielMax = Math.round(triangular(rng, est[0], est[1], 0.5));
  return {
    id: uid('pl'), potentielMax, estim: est,
    prenom: opts.prenom, nom: opts.nom, naissance: opts.naissance,
    nationalite: opts.nationalite, taille: opts.taille, poids: opts.poids,
    pos: opts.pos, posSec: opts.posSec || null, pied: opts.pied, profil: opts.profil,
    rarete: rarity.k, xpMul: drawXpMul(rng, rarity),
    niveau, niveauDepart: niveau, ovFrac: 0,
    niveauXp: 1, xp: 0, points: 0, xpTotal: 0, pointsGagnes: 0, pointsDepenses: 0,
    attrs: genAttrs(rng, opts.pos, opts.profil, niveau, opts.taille),
    forme: 50, fatigue: 10, moral: 60, reputation: 5, cote: 45,
    suspension: 0, blessure: null,
    hidden: {
      professionnalisme: ri(rng, 25, 90), regularite: ri(rng, 25, 90),
      fragilite: ri(rng, 10, 85), adaptation: ri(rng, 25, 90),
      ambition: ri(rng, 25, 95), intelligence_tac: ri(rng, 25, 90),
      pression: ri(rng, 20, 90), leadership: ri(rng, 10, 85),
    },
    histo: [],
  };
}

/* ---------- Expérience ---------- */
function xpFromMatch(state, res) {
  const p = state.player;
  const div = divDef(clubById(state.clubId).div);
  if (res.minutes <= 0) return Math.round(CFG.XP.base * CFG.XP.banc * p.xpMul * (CFG.XP.posMul[p.pos] || 1));
  const mins = res.minutes / 90;
  const note = clamp((res.note - 4.5) / 2.2, CFG.XP.noteMin, CFG.XP.noteMax);
  const comp = res.tag === 'championnat' ? div.xpMul : div.xpMul * CFG.XP.tournoiMul;
  const bonus = res.buts * 0.10 + res.passes_d * 0.06;
  const posM = CFG.XP.posMul[p.pos] || 1;
  const eco = typeof effetsEconomie === 'function' ? effetsEconomie(state).xpMul : 1;
  return Math.round(CFG.XP.base * mins * note * comp * p.xpMul * posM * eco * (1 + bonus + CFG.TRAIN_XP_BONUS));
}

function addXp(state, amount) {
  const p = state.player;
  const gains = [];
  p.xp += amount; p.xpTotal += amount;
  let guard = 0;
  while (p.xp >= xpNeeded(p.niveauXp) && guard++ < 60) {
    p.xp -= xpNeeded(p.niveauXp);
    p.niveauXp++;
    const pts = pointsForLevel(p.niveauXp);
    p.points += pts; p.pointsGagnes += pts;
    gains.push({ niveau: p.niveauXp, points: pts });
  }
  return gains;
}

/* ---------- Dépense de points ---------- */
function canUpgrade(p, k) {
  /* Potentiel atteint : la générale est bloquée, on ne dépense plus. */
  if (p.potentielMax && p.niveau >= p.potentielMax) return false;
  if (!(k in p.attrs)) return false;
  if (p.pos !== 'GB' && gkAttrs().includes(k)) return false;
  if (p.attrs[k] >= 99) return false;
  return p.points >= upgradeCost(p.attrs[k]);
}
function upgradeAttr(p, k) {
  if (!canUpgrade(p, k)) return null;
  const cout = upgradeCost(p.attrs[k]);
  p.points -= cout; p.pointsDepenses += cout;
  p.attrs[k]++;
  const g = ovGain(p.pos, k);
  const avant = p.niveau;
  p.ovFrac += g;
  const plafond = Math.min(CFG.OVERALL.max, p.potentielMax || CFG.OVERALL.max);
  while (p.ovFrac >= 1 && p.niveau < plafond) { p.ovFrac -= 1; p.niveau++; }
  if (p.niveau >= plafond) p.ovFrac = 0;
  return { attr: k, cout, gain: g, generale: p.niveau, monte: p.niveau > avant };
}
/* Répartition automatique : meilleur rapport gain de générale / coût. */
function autoSpend(p) {
  let n = 0, guard = 0;
  while (p.points > 0 && guard++ < 500) {
    const cands = Object.keys(CFG.POS_WEIGHTS[p.pos])
      .filter(k => canUpgrade(p, k) && ovGain(p.pos, k) > 0)
      .sort((a, b) => (ovGain(p.pos, b) / upgradeCost(p.attrs[b])) - (ovGain(p.pos, a) / upgradeCost(p.attrs[a])));
    if (!cands.length) break;
    if (!upgradeAttr(p, cands[0])) break;
    n++;
  }
  return n;
}

function statusOf(cote) {
  let s = CFG.STATUS[0];
  for (const st of CFG.STATUS) if (cote >= st.min) s = st;
  return s;
}
function nextStatus(cote) {
  return CFG.STATUS.find(s => s.min > cote) || null;
}

function marketValue(state) {
  const p = state.player, club = clubById(state.clubId);
  const age = ageAt(p.naissance, weekToDate(state.seasonStartYear, Math.min(state.week, 39)));
  const nivF = Math.pow(Math.max(0, p.niveau - 40) / 10, 2.6) * 2200;
  const potF = 1 + Math.max(0, p.estim[1] - p.niveau) * 0.030;
  const ageF = age <= 20 ? 1.35 : age <= 23 ? 1.15 : age <= 27 ? 1.0 : age <= 30 ? 0.7 : 0.35;
  const divF = divDef(club.div).niv === 2 ? 1.25 : 1.0;
  return Math.round((nivF * potF * ageF * divF * (0.85 + p.reputation / 200)) / 500) * 500;
}


/* ============================================================
   WORLD — poules, calendrier, tournois amicaux avec tableau
   ============================================================ */

/* Force sportive d'un club, exprimée sur la même échelle que la
   générale du joueur : la générale a donc un impact direct. */
function clubStrength(state, clubId) {
  const c = clubById(clubId);
  const rng = rngFrom(state.seed, 'strength', state.season, clubId);
  const div = divDef(c.div || 'R2');
  /* Réputation moyenne de la division, pour situer le club en son sein. */
  const pairs = clubsOf(div.k);
  const moyenne = pairs.length ? pairs.reduce((a, x) => a + x.rep, 0) / pairs.length : c.rep;
  const base = div.standard - 4 + (c.rep - moyenne) * 0.55;
  return round1(clamp(base + gauss(rng, 0, 2.4), 40, 92));
}

function initLeague(state, div) {
  const clubs = clubsOf(div);
  const table = {};
  for (const c of clubs) table[c.id] = { id: c.id, j: 0, g: 0, n: 0, p: 0, bp: 0, bc: 0, pts: 0, force: clubStrength(state, c.id) };
  return { div, table, fixtures: genFixtures(state, clubs.map(c => c.id), div) };
}

function genFixtures(state, ids, tag) {
  const rng = rngFrom(state.seed, 'fixtures', state.season, tag);
  const t = shuffled(rng, ids);
  const n = t.length;
  const rounds = [];
  const fixed = t[0], rot = t.slice(1);
  for (let r = 0; r < n - 1; r++) {
    const day = [];
    const arr = [fixed, ...rot];
    for (let i = 0; i < n / 2; i++) {
      const a = arr[i], b = arr[n - 1 - i];
      day.push(r % 2 === 0 ? { h: a, a: b } : { h: b, a: a });
    }
    rounds.push(day);
    rot.unshift(rot.pop());
  }
  return [...rounds, ...rounds.map(d => d.map(m => ({ h: m.a, a: m.h })))];
}

/* ---------- Calendrier : liste ordonnée d'échéances ----------
   Une entrée = un rendez-vous. Un tournoi n'est plus expédié en une
   fois : chaque tour est une échéance distincte, à une semaine
   différente. Les tournois de préparation sont rares, pas
   hebdomadaires.                                                   */
function buildCalendar(state) {
  const rng = rngFrom(state.seed, 'calendar', state.season);
  const club = clubById(state.clubId);
  const cal = [];
  let w = 1;
  state.tournoisPlan = state.tournoisPlan || [];
  const plans = [];

  function ajouteTournoi(tdef, semaineDebut) {
    const T = buildTournoi(state, tdef, plans.length);
    plans.push(T);
    let ws = semaineDebut;
    T.tours.forEach((tour, i) => {
      cal.push({ type: 'tournoi', tid: T.id, tour: i, w: ws, label: `${T.nom} — ${tour.nom}` });
      ws += 2;
    });
    return ws;
  }

  cal.push({ type: 'mercato', w, label: "Intersaison — marché amateur", fenetre: 'ete' });
  w += 1;

  /* Préparation : au plus un tournoi, et pas systématiquement. */
  const invit = 0.30 + club.rep / 200;
  if (rng() < invit) {
    const t = pick(rng, TOURNOIS.filter(x => x.periode === 'preseason'));
    w = ajouteTournoi(t, w + 1) + 1;
  } else w += 2;

  /* Coupes : les tours s'intercalent entre les journées de
     championnat, comme dans un calendrier amateur réel. */
  /* On ne programme QUE le premier tour de chaque coupe : les suivants
     ne sont ajoutés qu'une fois la qualification acquise. Plus de
     rendez-vous fantômes au calendrier pour une compétition dont on
     est déjà éliminé. */
  state.coupes = buildCoupes(state);
  const toursCoupe = state.coupes.map(c => ({ c, i: c.depart }));

  /* Le nombre de journées découle de la taille de la poule. */
  const nClubs = clubsOf(clubById(state.clubId).div).length;
  const nJournees = (nClubs - 1) * 2;
  const mi = Math.ceil(nJournees / 2);
  let coupeIdx = 0;
  for (let j = 1; j <= mi; j++) {
    cal.push({ type: 'championnat', journee: j, w }); w++;
    if (coupeIdx < toursCoupe.length) {
      const tc = toursCoupe[coupeIdx++];
      cal.push({ type: 'coupe', cid: tc.c.id, tour: tc.i, w, label: `${tc.c.nom} — ${tc.c.tours[tc.i].n}` });
      w++;
    }
  }

  cal.push({ type: 'mercato', w, label: "Trêve hivernale — marché amateur", fenetre: 'hiver' });
  w += 1;
  if (rng() < invit * 0.7) {
    const t = pick(rng, TOURNOIS.filter(x => x.periode === 'winter'));
    w = ajouteTournoi(t, w) + 1;
  } else w += 1;

  for (let j = mi + 1; j <= nJournees; j++) {
    cal.push({ type: 'championnat', journee: j, w }); w++;
    if (coupeIdx < toursCoupe.length) {
      const tc = toursCoupe[coupeIdx++];
      cal.push({ type: 'coupe', cid: tc.c.id, tour: tc.i, w, label: `${tc.c.nom} — ${tc.c.tours[tc.i].n}` });
      w++;
    }
  }

  if (rng() < 0.22) { const t = TOURNOIS.find(x => x.periode === 'any'); ajouteTournoi(t, w + 1); }

  state.tournoisPlan = plans;
  cal.sort((a, b) => a.w - b.w);
  return cal;
}

function simAI(rng, fh, fa) {
  const diff = (fh + CFG.MATCH.homeAdv * 6 - fa) / 6;
  const total = CFG.MATCH.baseGoals;
  const share = 1 / (1 + Math.exp(-diff * 0.75));
  return { gh: poisson(rng, total * share), ga: poisson(rng, total * (1 - share)) };
}

function applyResult(table, h, a, gh, ga) {
  const H = table[h], A = table[a];
  H.j++; A.j++; H.bp += gh; H.bc += ga; A.bp += ga; A.bc += gh;
  if (gh > ga) { H.g++; A.p++; H.pts += 3; }
  else if (gh < ga) { A.g++; H.p++; A.pts += 3; }
  else { H.n++; A.n++; H.pts++; A.pts++; }
}

function playJournee(state, league, journee, skipClubId) {
  const day = league.fixtures[journee - 1];
  if (!day) return null;
  const rng = rngFrom(state.seed, 'day', state.season, league.div, journee);
  let mine = null;
  for (const m of day) {
    if (skipClubId && (m.h === skipClubId || m.a === skipClubId)) { mine = m; continue; }
    const r = simAI(rng, league.table[m.h].force, league.table[m.a].force);
    applyResult(league.table, m.h, m.a, r.gh, r.ga);
  }
  return mine;
}

function standings(league) {
  return Object.values(league.table).sort((a, b) =>
    b.pts - a.pts || (b.bp - b.bc) - (a.bp - a.bc) || b.bp - a.bp || clubById(a.id).n.localeCompare(clubById(b.id).n));
}

/* ---------- Tournoi amical : construction du tableau ----------
   4 équipes -> demi-finales + finale (et petite finale ignorée).
   1 tour     -> match unique (gala).                              */
function buildTournoi(state, t, idx) {
  const rng = rngFrom(state.seed, 'tour', state.season, idx, t.k);
  const me = clubById(state.clubId);
  const pool = poolAmicaux(state.clubId).filter(c =>
    t.k === 'gala' ? c.rep > me.rep + 4 : Math.abs(c.rep - me.rep) <= 14);
  const src = pool.length >= 3 ? pool : poolAmicaux(state.clubId);

  const id = 's' + state.season + '_' + idx;
  if (t.tours <= 1) {
    const adv = pick(rng, src);
    return { id, k: t.k, nom: t.n, format: 'unique', saison: state.season, equipes: [state.clubId, adv.id],
      tours: [{ nom: 'Match de gala', matchs: [{ h: state.clubId, a: adv.id, joue: false }] }], termine: false, rang: null };
  }
  const others = pickN(rng, src, 3).map(c => c.id);
  const eq = shuffled(rng, [state.clubId, ...others]);
  return {
    id, k: t.k, nom: t.n, format: 'coupe', saison: state.season, equipes: eq,
    tours: [
      { nom: 'Demi-finales', matchs: [ { h: eq[0], a: eq[1], joue: false }, { h: eq[2], a: eq[3], joue: false } ] },
      { nom: 'Finale', matchs: [] },
    ],
    termine: false, rang: null,
  };
}

/* ---------- Fin de saison : montées et descentes ---------- */
/* ---------- Fin de saison sur toute la pyramide ----------
   Chaque paire de divisions voisines échange ses promus et ses
   relégués, plus le vainqueur du barrage d'accession. */
function endOfSeason(state, barrageResult) {
  /* Chaque pays a sa propre pyramide : les échanges de division se
     font à l'intérieur d'un même pays, jamais entre la France et
     l'Angleterre. */
  const promus = [], relegues = [], champions = {}, classements = {};
  for (const d of CFG.DIVISIONS) classements[d.k] = standings(state.leagues[d.k]);
  for (const pays of CFG.PAYS) {
    const ordre = CFG.DIVISIONS.filter(d => d.pays === pays.k).sort((a, b) => a.niv - b.niv);
    for (let i = 0; i < ordre.length - 1; i++) {
      const bas = ordre[i], haut = ordre[i + 1];
      const sB = classements[bas.k], sH = classements[haut.k];
      const montent = sB.slice(0, bas.promus).map(x => x.id);
      const descendent = sH.slice(-haut.relegues).map(x => x.id);
      if (barrageResult && barrageResult.divBas === bas.k) {
        if (barrageResult.vainqueur === barrageResult.clubBas) { montent.push(barrageResult.clubBas); descendent.push(barrageResult.clubHaut); }
      }
      const n = Math.min(montent.length, descendent.length);
      for (const id of montent.slice(0, n)) { clubById(id).div = haut.k; promus.push(id); }
      for (const id of descendent.slice(0, n)) { clubById(id).div = bas.k; relegues.push(id); }
    }
  }
  for (const d of CFG.DIVISIONS) champions[d.k] = classements[d.k][0].id;
  return { promus, relegues, champions, classements };
}

function endOfSeasonInutile(state, barrageResult) {
  const ordre = CFG.DIVISIONS.slice().sort((a, b) => a.niv - b.niv);
  const mouvements = [];
  const classements = {};
  for (const d of ordre) classements[d.k] = standings(state.leagues[d.k]);

  for (let i = 0; i < ordre.length - 1; i++) {
    const bas = ordre[i], haut = ordre[i + 1];
    const sB = classements[bas.k], sH = classements[haut.k];
    const montent = sB.slice(0, bas.promus).map(x => x.id);
    const descendent = sH.slice(-haut.relegues).map(x => x.id);
    /* Le barrage ne concerne que la paire où il a été disputé. */
    if (barrageResult && barrageResult.divBas === bas.k) {
      if (barrageResult.vainqueur === barrageResult.clubBas) { montent.push(barrageResult.clubBas); descendent.push(barrageResult.clubHaut); }
    }
    /* Les effectifs doivent rester égaux d'une division à l'autre. */
    const n = Math.min(montent.length, descendent.length);
    mouvements.push({ bas: bas.k, haut: haut.k, montent: montent.slice(0, n), descendent: descendent.slice(0, n) });
  }
  const promus = [], relegues = [];
  for (const m of mouvements) {
    for (const id of m.montent) { clubById(id).div = m.haut; promus.push(id); }
    for (const id of m.descendent) { clubById(id).div = m.bas; relegues.push(id); }
  }
  const champions = {};
  for (const d of ordre) champions[d.k] = classements[d.k][0].id;
  return { promus, relegues, champions, classements };
}

/* Barrage d'accession : 3e de la division du joueur contre l'avant-
   dernier de la division du dessus (ou l'inverse si le joueur évolue
   dans la division supérieure). Retourne null si le joueur n'est pas
   concerné : le barrage se joue alors sans lui, en coulisses. */
function barrageDuel(state) {
  const maDiv = divDef(clubById(state.clubId).div);
  const ordre = CFG.DIVISIONS.filter(d => d.pays === maDiv.pays).sort((a, b) => a.niv - b.niv);
  const idx = ordre.findIndex(d => d.k === maDiv.k);
  const paires = [];
  if (idx > 0) paires.push([ordre[idx - 1], ordre[idx]]);
  if (idx < ordre.length - 1) paires.push([ordre[idx], ordre[idx + 1]]);
  for (const [bas, haut] of paires) {
    const sB = standings(state.leagues[bas.k]), sH = standings(state.leagues[haut.k]);
    const a = sB[CFG.BARRAGE.placeR2 - 1], b = sH[sH.length - haut.relegues - 1];
    if (!a || !b) continue;
    if (a.id === state.clubId || b.id === state.clubId) {
      return { clubBas: a.id, clubHaut: b.id, divBas: bas.k, divHaut: haut.k };
    }
  }
  return null;
}

function resetDivisions() {
  for (const c of CLUBS) c.div = null;
  for (const k in POULES) for (const id of POULES[k]) { const c = clubById(id); if (c) c.div = k; }
}


/* ============================================================
   MATCH — sélection, simulation, note. La générale pèse réellement.
   ============================================================ */

function levelGap(state) {
  return state.player.niveau - divDef(clubById(state.clubId).div).standard;
}

/* Effet du gabarit en match. Pour un gardien, la taille est un vrai
   paramètre : un grand gardien couvre mieux son but et domine les
   centres, un petit gardien est plus vif mais souffre dans les airs.
   Le rendu dépend du style de l'adversaire, simulé ici par un aléa. */
function tailleEffetGB(p, rng) {
  const d = p.taille - CFG.TAILLE.gbReference;
  const aerien = rng() < 0.5;            // adversaire porté sur le jeu aérien
  const base = d * CFG.TAILLE.gbMatch;
  return aerien ? base : -base * 0.55;
}

/* ---------- Concurrent direct ----------
   Vous n'êtes plus sélectionné par un tirage opaque : vous avez un
   concurrent identifié à votre poste. Si vous êtes devant lui, vous
   jouez. L'écart détermine le temps de jeu, la cote et la forme font
   l'appoint, et il reste une part d'imprévu propre au coach.       */
function genConcurrent(state) {
  const club = clubById(state.clubId);
  const div = divDef(club.div || 'R2');
  const rng = rngFrom(state.seed, 'concurrent', state.season, club.id, state.player.pos);
  const pairs = clubsOf(div.k);
  const moyenne = pairs.length ? pairs.reduce((a, x) => a + x.rep, 0) / pairs.length : club.rep;
  /* Un club mieux coté que la moyenne de sa division a un titulaire
     plus solide au poste. */
  const niveau = Math.round(clamp(div.standard - 2 + (club.rep - moyenne) * 0.45 + gauss(rng, 0, 3.0), 30, 95));
  const age = ri(rng, 21, 33);
  return {
    nom: `${pick(rng, PRENOMS)} ${pick(rng, NOMS)}`,
    niveau, age, forme: ri(rng, 40, 65),
    pos: state.player.pos,
  };
}

/* Écart d'évaluation entre le joueur et son concurrent. */
function ecartSelection(state, rng, amical) {
  const p = state.player;
  const c = state.concurrent;
  if (!c) return 0;
  let e = p.niveau - c.niveau;
  e += (p.cote - 50) * CFG.SELECTION.poidsCote;
  e += (p.forme - c.forme) * CFG.SELECTION.poidsForme;
  if (p.fatigue > 78) e -= 3.5; else if (p.fatigue > 60) e -= 1.5;
  if (amical) e += 3;                       // le coach fait tourner en amical
  if (rng) e += gauss(rng, 0, CFG.SELECTION.aleaHebdo);
  return round1(e);
}

function selectPlayer(state, rng, amical) {
  const p = state.player;
  if (p.blessure && p.blessure.semaines > 0) return { role: 'blesse', minutes: 0, ecart: null };
  if (p.suspension > 0) return { role: 'suspendu', minutes: 0, ecart: null };
  if (!state.concurrent) state.concurrent = genConcurrent(state);

  const e = ecartSelection(state, rng, amical);
  const cl = clamp(e, -CFG.SELECTION.ecartMax, CFG.SELECTION.ecartMax);

  if (e >= CFG.SELECTION.ecartTitulaire) {
    /* Titulaire, sauf rotation ponctuelle. */
    if (rng() < CFG.SELECTION.rotationChance * (p.fatigue > 70 ? 1.8 : 1)) {
      return { role: 'entrant', minutes: ri(rng, 18, 40), ecart: cl };
    }
    let minutes = 90;
    if (e < 2 && rng() < 0.35) minutes = ri(rng, 60, 85);         // remplacé en cours de match
    else if (rng() < 0.18) minutes = ri(rng, 70, 89);
    if (p.fatigue > 72) minutes = Math.round(minutes * 0.85);
    return { role: 'titulaire', minutes: clamp(minutes, 20, 90), ecart: cl };
  }
  /* Derrière le concurrent : on entre en jeu d'autant plus souvent
     que l'écart est faible. */
  const chanceEntrer = clamp(0.72 + e * 0.06, 0.18, 0.9);
  if (rng() < chanceEntrer) return { role: 'entrant', minutes: clamp(Math.round(ri(rng, 12, 34) + e), 5, 45), ecart: cl };
  if (e > -7) return { role: 'banc', minutes: 0, ecart: cl };
  return { role: 'non_convoque', minutes: 0, ecart: cl };
}

/* Poids du joueur dans la force collective : un très bon joueur tire
   vraiment son équipe vers le haut, un joueur trop faible la pénalise. */
function playerImpact(state, minutes, teamForce) {
  const p = state.player;
  if (minutes <= 0) return 0;
  const perso = p.niveau * (0.92 + p.forme / 600);
  return clamp((perso - teamForce) * 0.16 * (minutes / 90), -2.2, 3.0);
}

function forceOf(state, clubId) {
  const lg = state.leagues[clubById(clubId).div];
  if (lg && lg.table[clubId]) return lg.table[clubId].force;
  return clubStrength(state, clubId);
}

function simMatch(state, fixture, opts) {
  opts = opts || {};
  const rng = rngFrom(state.seed, 'match', state.season, opts.tag2 || 0, fixture.h, fixture.a, state.matchIndex || 0);
  const p = state.player;
  const home = fixture.h === state.clubId;
  const advId = home ? fixture.a : fixture.h;

  const sel = selectPlayer(state, rng, !!opts.amical);
  const minutes = sel.minutes;
  const fTeam = forceOf(state, state.clubId);
  const fMe = fTeam + playerImpact(state, minutes, fTeam);
  const fAdv = forceOf(state, advId);
  const r = simAI(rng, home ? fMe : fAdv, home ? fAdv : fMe);

  const res = {
    tag: opts.tag || 'championnat', label: opts.label || null,
    journee: opts.journee || null, season: state.season, date: opts.date || null,
    home, adversaire: advId, gPour: home ? r.gh : r.ga, gContre: home ? r.ga : r.gh,
    role: sel.role, minutes,
    buts: 0, passes_d: 0, tirs: 0, tirs_cadres: 0, passes: 0, passes_reussies: 0,
    duels: 0, duels_gagnes: 0, tacles: 0, interceptions: 0, fautes: 0,
    jaune: 0, rouge: 0, arrets: 0, note: null, xp: 0, homme: false,
  };

  if (minutes > 0) {
    const inv = INVOLVE[p.pos], m = minutes / 90;
    const gap = levelGap(state);
    const perf = clamp(gauss(rng, 1 + clamp(gap / 40, -0.30, 0.34), 0.25), 0.35, 1.95);
    const form = 0.85 + p.forme / 330;

    /* Le volume offensif dépend aussi de la solidité adverse : on tire
       moins face à un bloc supérieur, davantage face à une équipe
       dominée. */
    const fAdvRel = clamp((forceOf(state, advId) - divDef(clubById(state.clubId).div).standard) / 22, -0.35, 0.35);
    res.tirs = Math.max(0, Math.round(gauss(rng, inv.tirs * m * form * (0.7 + p.niveau / 130) * (1 - fAdvRel), 0.9)));
    for (let i = 0; i < res.tirs; i++) if (rng() < clamp(0.28 + p.attrs.finition / 250, 0.2, 0.62)) res.tirs_cadres++;
    for (let i = 0; i < Math.min(res.gPour, res.tirs_cadres); i++)
      if (rng() < clamp(inv.but * m * (p.attrs.finition / 40) * perf, 0, 0.9)) res.buts++;
    for (let i = 0; i < Math.max(0, res.gPour - res.buts); i++)
      if (rng() < clamp(inv.passeD * m * ((p.attrs.vision + p.attrs.passe_courte) / 80) * perf, 0, 0.75)) res.passes_d++;

    const volume = (p.pos === 'GB' ? 22 : 28 + (CFG.POS_WEIGHTS[p.pos].passe_courte || 3) * 1.6) * m;
    res.passes = Math.max(3, Math.round(gauss(rng, volume, 6)));
    res.passes_reussies = Math.round(res.passes * clamp(0.52 + p.attrs.passe_courte / 250 + (perf - 1) * 0.1 - fAdvRel * 0.12, 0.38, 0.96));

    res.duels = Math.max(0, Math.round(gauss(rng, inv.duels * m * (1 + fAdvRel * 0.5), 2)));
    const duelSkill = p.pos === 'GB' ? 60 : (p.attrs.force + p.attrs.agilite + p.attrs.equilibre) / 3;
    for (let i = 0; i < res.duels; i++)
      if (rng() < clamp(0.30 + duelSkill / 210 + (perf - 1) * 0.12 - fAdvRel * 0.25, 0.15, 0.85)) res.duels_gagnes++;

    res.tacles = Math.max(0, Math.round(gauss(rng, inv.tacles * m, 1)));
    res.interceptions = Math.max(0, Math.round(gauss(rng, inv.inter * m, 1)));
    res.fautes = Math.max(0, Math.round(gauss(rng, (1.0 + p.attrs.agressivite / 75) * m, 0.9)));
    if (p.pos === 'GB') {
      const eff = tailleEffetGB(p, rng);
      res.tailleEffet = round2(eff);
      res.arrets = Math.max(0, Math.round(gauss(rng, 3.2 * m + res.gContre * 0.6 + eff * 2.2, 1.2)));
      /* Un gardien mal dimensionné encaisse davantage, et inversement. */
      if (eff < -0.12 && rng() < Math.min(0.5, -eff * 1.6)) res.gContre++;
      else if (eff > 0.12 && res.gContre > 0 && rng() < Math.min(0.5, eff * 1.6)) res.gContre--;
      res.cleanSheet = res.gContre === 0 && res.minutes >= 60;
    }

    if (rng() < clamp(res.fautes * 0.035, 0, 0.22)) res.jaune = 1;
    if (res.jaune && rng() < 0.020) { res.jaune = 2; res.rouge = 1; }
    else if (rng() < 0.0018) res.rouge = 1;

    res.note = matchRating(state, res, perf);
    res.homme = res.note >= 8.0;
  }
  res.xp = xpFromMatch(state, res);
  return res;
}

function matchRating(state, r, perf) {
  const p = state.player;
  const line = posDef(p.pos).line;
  let n = CFG.MATCH.noteBase + (perf - 1) * 1.6 + (r.minutes >= 60 ? 0.1 : -0.15);
  n += r.buts * (line === 'ATT' ? 1.05 : line === 'MIL' ? 1.25 : 1.5);
  n += r.passes_d * 0.85;
  const prec = r.passes ? r.passes_reussies / r.passes : 0.7;
  n += (prec - 0.75) * (line === 'MIL' ? 3.2 : 1.8);
  const dw = r.duels ? r.duels_gagnes / r.duels : 0.5;
  n += (dw - 0.5) * (line === 'DEF' ? 3.0 : line === 'MIL' ? 2.0 : 1.2);
  if (line === 'DEF' || p.pos === 'MDC') {
    n += (r.interceptions + r.tacles) * 0.10;
    n += r.gContre === 0 ? 0.55 : r.gContre >= 3 ? -0.7 : r.gContre === 2 ? -0.3 : 0;
  }
  if (p.pos === 'GB') {
    n += r.arrets * 0.12;
    n += r.gContre === 0 ? 0.62 : r.gContre >= 3 ? -1.15 : r.gContre === 2 ? -0.5 : 0;
  }
  if (line === 'ATT' && r.minutes >= 65 && !r.buts && !r.passes_d) n -= 0.45;
  n -= r.jaune ? 0.25 : 0;
  n -= r.rouge ? 1.6 : 0;
  n -= r.fautes * 0.05;
  n += r.gPour > r.gContre ? 0.3 : r.gPour < r.gContre ? -0.3 : 0;
  /* L'adéquation des attributs au poste pèse directement sur la note :
     un joueur dont les qualités ne correspondent pas à son rôle est
     mal noté même s'il gagne des duels par ailleurs. */
  const w = CFG.POS_WEIGHTS[p.pos];
  let sw = 0, tw = 0;
  for (const k in w) { sw += (p.attrs[k] || 40) * w[k]; tw += w[k]; }
  n += clamp(((sw / tw) - p.niveau) / 18, -0.9, 0.9);
  return clamp(round1(n), 2.0, 10.0);
}

/* ---------- Décisions en cours de match ----------
   Proposées quand le joueur est sur le terrain : un choix d'attitude
   qui infléchit réellement sa prestation. */
const ACTIONS_MATCH = [
  { k: 'tenter', n: 'Tenter ma chance', desc: 'Prendre les initiatives, quitte à se rater.',
    eff: { tirs: 2, buts: 0.35, note: -0.15, fatigue: 4 } },
  { k: 'jouer_simple', n: 'Jouer simple', desc: 'Sécuriser, ne rien forcer.',
    eff: { passes: 0.08, note: 0.2, buts: -0.15 } },
  { k: 'presser', n: 'Presser haut', desc: 'Harceler le porteur, coûteux physiquement.',
    eff: { duels: 3, interceptions: 1, fatigue: 9, note: 0.1 } },
  { k: 'economiser', n: 'Gérer son effort', desc: 'Préserver les jambes pour la fin de match.',
    eff: { fatigue: -6, note: -0.1, tirs: -1 } },
  { k: 'provoquer', n: 'Provoquer l\'adversaire', desc: 'Prendre le dessus mentalement, au risque du carton.',
    eff: { duels: 2, carton: 0.22, note: 0.15 } },
];

function proposerActionMatch(state, res) {
  if (res.minutes < 25) return null;
  const rng = rngFrom(state.seed, 'actionMatch', state.season, state.calIndex);
  if (rng() > 0.55) return null;
  const choix = pickN(rng, ACTIONS_MATCH, 3);
  return { options: choix.map((a, i) => ({ i, k: a.k, n: a.n, desc: a.desc, eff: resumeEffet(a.eff) })) };
}

/* Résumé lisible des conséquences, affiché AVANT le choix. */
function resumeEffet(eff) {
  const bouts = [];
  if (eff.tirs) bouts.push(`${eff.tirs > 0 ? '+' : ''}${eff.tirs} tir(s)`);
  if (eff.buts) bouts.push(`${eff.buts > 0 ? '+' : ''}${Math.round(eff.buts * 100)} % de réussite devant le but`);
  if (eff.passes) bouts.push(`${eff.passes > 0 ? '+' : ''}${Math.round(eff.passes * 100)} % de précision`);
  if (eff.duels) bouts.push(`${eff.duels > 0 ? '+' : ''}${eff.duels} duel(s)`);
  if (eff.interceptions) bouts.push(`+${eff.interceptions} interception`);
  if (eff.fatigue) bouts.push(`${eff.fatigue > 0 ? '+' : ''}${eff.fatigue} fatigue`);
  if (eff.note) bouts.push(`${eff.note > 0 ? '+' : ''}${eff.note.toFixed(2)} de note`);
  if (eff.carton) bouts.push(`${Math.round(eff.carton * 100)} % de risque de carton`);
  return bouts.join(' · ');
}

function appliquerActionMatch(state, res, k) {
  const a = ACTIONS_MATCH.find(x => x.k === k);
  if (!a) return null;
  const p = state.player;
  const rng = rngFrom(state.seed, 'actionEff', state.season, state.calIndex, k);
  const e = a.eff;
  if (e.tirs) res.tirs = Math.max(0, res.tirs + e.tirs);
  if (e.duels) res.duels += e.duels;
  if (e.interceptions) res.interceptions += e.interceptions;
  if (e.passes) res.passes_reussies = Math.min(res.passes, Math.round(res.passes_reussies * (1 + e.passes)));
  if (e.buts > 0 && res.tirs > 0 && rng() < e.buts * (p.attrs.finition / 70)) { res.buts++; res.gPour++; }
  if (e.buts < 0 && res.buts > 0 && rng() < -e.buts) { res.buts--; res.gPour = Math.max(0, res.gPour - 1); }
  if (e.carton && rng() < e.carton) res.jaune = Math.max(res.jaune, 1);
  if (e.fatigue) p.fatigue = clamp(p.fatigue + e.fatigue, 0, 100);
  if (e.note) res.note = clamp(round1(res.note + e.note), 2, 10);
  res.action = a.n;
  return { texte: `Vous avez choisi : ${a.n.toLowerCase()}.`, effets: resumeEffet(e) };
}

function applyMatch(state, res) {
  const p = state.player;
  /* Le concurrent vit sa saison : sa forme bouge, et il vieillit
     d'une saison à l'autre. */
  if (state.concurrent) {
    const rc = rngFrom(state.seed, 'conc', state.season, state.calIndex);
    state.concurrent.forme = clamp(state.concurrent.forme + gauss(rc, 0, 6), 20, 90);
  }
  if (res.minutes > 0) {
    p.fatigue = clamp(p.fatigue + res.minutes * 0.28, 0, 100);
    p.forme = clamp(p.forme + (res.note - 6.2) * 3.2, 0, 100);
    p.cote = clamp(p.cote + clamp((res.note - 6.1) * 1.1, -2.5, 2.5) - (res.rouge ? 2.5 : 0), 0, 100);
    p.moral = clamp(p.moral + (res.note - 6.0) * 2 + (res.gPour > res.gContre ? 2 : res.gPour < res.gContre ? -1.5 : 0), 0, 100);
    const poids = res.tag === 'championnat' ? (divDef(clubById(state.clubId).div).niv === 2 ? 0.10 : 0.06) : 0.02;
    p.reputation = clamp(p.reputation + Math.max(0, res.note - 6.4) * poids + res.buts * poids * 1.6, 0, 100);
  } else if (res.role === 'banc' || res.role === 'non_convoque') {
    p.fatigue = clamp(p.fatigue - 6, 0, 100);
    p.moral = clamp(p.moral - (res.role === 'non_convoque' ? 3.5 : 1.5), 0, 100);
    p.cote = clamp(p.cote - 0.25, 0, 100);
  }
  if (res.rouge) p.suspension = 1;
  if (res.jaune >= 1 && res.tag === 'championnat') {
    state.cartons = (state.cartons || 0) + 1;
    if (state.cartons % 5 === 0) p.suspension = Math.max(p.suspension || 0, 1);
  }
  const s = state.stats;
  if (res.tag === 'championnat') {
    if (res.minutes > 0) {
      s.matchs++; s.minutes += res.minutes; s.buts += res.buts; s.passes_d += res.passes_d; s.notes.push(res.note);
      s.tirs += res.tirs; s.tirs_cadres += res.tirs_cadres; s.passes += res.passes; s.passes_reussies += res.passes_reussies;
      s.duels += res.duels; s.duels_gagnes += res.duels_gagnes; s.tacles += res.tacles; s.interceptions += res.interceptions;
      s.jaunes += res.jaune ? 1 : 0; s.rouges += res.rouge ? 1 : 0; s.arrets += res.arrets;
      s.buts_encaisses += res.gContre;
      if (res.cleanSheet) s.clean_sheets++;
      if (res.homme) s.hommes_du_match++;
    }
    if (res.role === 'titulaire') s.titularisations++;
    if (res.role === 'entrant') s.entrees++;
    if (res.role === 'banc' || res.role === 'non_convoque') s.non_utilise++;
  } else if (res.minutes > 0) {
    s.am_matchs++; s.am_minutes += res.minutes; s.am_buts += res.buts; s.am_passes_d += res.passes_d;
  }
  res.gains = addXp(state, res.xp);
  state.historique.push(res);
  return res;
}

function moyenneNote(notes) {
  return notes.length ? round1(notes.reduce((a, b) => a + b, 0) / notes.length) : null;
}


/* ============================================================
   CONTRATS — indemnités, primes, durée, renouvellement
   ------------------------------------------------------------
   À ce niveau de la pyramide, on ne parle pas de salaires
   professionnels : un club de Régional verse des indemnités
   mensuelles et des primes. Les montants restent volontairement
   modestes et n'enrichissent personne.
   ============================================================ */

function salaireEstime(divKey, niveau, statut) {
  const C = CFG.CONTRAT, div = divDef(divKey || 'R2');
  const marge = Math.max(0, niveau - div.standard);
  let s = C.base[div.k] + marge * C.parPointNiveau[div.k];
  if (statut === 'titulaire') s *= 1.25;
  else if (statut === 'concurrence') s *= 0.8;
  return Math.round(s / 10) * 10;
}

function nouveauContrat(state, opts) {
  opts = opts || {};
  const club = clubById(opts.clubId || state.clubId);
  const div = club.div || 'R2';
  const rng = rngFrom(state.seed, 'contrat', state.season, club.id);
  const statut = opts.statut || 'concurrence';
  const duree = opts.duree || pick(rng, CFG.CONTRAT.dureeInitiale);
  return {
    clubId: club.id, division: div,
    salaire: opts.salaire != null ? opts.salaire : salaireEstime(div, state.player.niveau, statut),
    primeMatch: CFG.CONTRAT.primeMatch[div],
    primeBut: CFG.CONTRAT.primeBut[div],
    primeVictoire: CFG.CONTRAT.primeVictoire[div],
    duree, restant: duree, statutPromis: statut,
    signeSaison: state.season, signeAnnee: state.seasonStartYear,
  };
}

function initFinances(state) {
  state.finances = { solde: 0, total: 0, saisonSalaires: 0, saisonPrimes: 0, historique: [] };
}

/* Indemnité mensuelle, versée au fil des semaines. */
function verserSalaire(state, semaines) {
  if (!state.contrat || !state.finances) return 0;
  const parSemaine = state.contrat.salaire / 4.33;
  /* Chez les professionnels, l'agent prélève sa commission sur chaque
     versement, et les sponsors s'ajoutent au revenu. */
  const com = (state.pro && state.pro.agent) ? state.pro.agent.com : 0;
  const sponsorsSem = (typeof revenusSponsors === 'function' ? revenusSponsors(state) : 0) / 52;
  const montant = Math.round((parSemaine * (1 - com) + sponsorsSem) * semaines);
  state.finances.solde += montant;
  state.finances.total += montant;
  state.finances.saisonSalaires += montant;
  return montant;
}

function verserPrimes(state, res) {
  if (!state.contrat || !state.finances) return 0;
  const c = state.contrat;
  let m = 0;
  if (res.minutes > 0) m += c.primeMatch;
  m += res.buts * c.primeBut;
  if (res.gPour > res.gContre && res.minutes > 0) m += c.primeVictoire;
  if (m) { state.finances.solde += m; state.finances.total += m; state.finances.saisonPrimes += m; }
  return m;
}

/* ---------- Proposition de renouvellement ----------
   Le club propose selon ce que le joueur a réellement apporté. Un
   remplaçant qui n'a pas joué peut se voir proposer moins, voire
   ne rien recevoir du tout. */
function propositionRenouvellement(state) {
  const p = state.player, club = clubById(state.clubId);
  const div = club.div || 'R2';
  const st = state.stats;
  const rng = rngFrom(state.seed, 'renouv', state.season, club.id);
  const note = moyenneNote(st.notes) || 5.8;
  const apport = (st.matchs / 20) * 0.5 + (note - 6) * 0.6 + (p.niveau - divDef(div).standard) * 0.05;

  if (apport < -0.55 || (st.matchs <= 3 && p.cote < 30)) return null;   // le club ne prolonge pas
  const statut = apport > 0.7 ? 'titulaire' : apport > 0.15 ? 'rotation' : 'concurrence';
  const base = salaireEstime(div, p.niveau, statut);
  const salaire = Math.round(base * clamp(0.85 + apport * 0.35, 0.7, 1.6) / 10) * 10;
  const duree = pick(rng, CFG.CONTRAT.dureeRenouv);
  return { clubId: club.id, division: div, salaire, statut, duree,
    primeMatch: CFG.CONTRAT.primeMatch[div], primeBut: CFG.CONTRAT.primeBut[div], primeVictoire: CFG.CONTRAT.primeVictoire[div] };
}

/* Négocier une fois : le club peut accepter, rogner, ou se braquer. */
function negocier(state, offre) {
  const p = state.player;
  const rng = rngFrom(state.seed, 'nego', state.season, offre.salaire);
  const poids = (p.cote - 55) / 60 + p.reputation / 90 + (moyenneNote(state.stats.notes) || 6 - 6) * 0.1;
  const r = rng();
  if (r < clamp(0.25 + poids * 0.35, 0.08, 0.75)) {
    return { ok: true, offre: { ...offre, salaire: Math.round(offre.salaire * rf(rng, 1.15, 1.4) / 10) * 10 },
      texte: 'Le club revoit sa proposition à la hausse.' };
  }
  if (r < 0.85) return { ok: false, offre, texte: 'Le club maintient sa proposition telle quelle.' };
  return { ok: false, offre: { ...offre, salaire: Math.round(offre.salaire * 0.92 / 10) * 10, vexe: true },
    texte: "Le club prend mal la demande et revoit son offre à la baisse." };
}

function signerContrat(state, offre) {
  state.contrat = nouveauContrat(state, { clubId: offre.clubId, salaire: offre.salaire,
    duree: offre.duree, statut: offre.statut || offre.statutPromis });
  state.player.cote = clamp(Math.max(state.player.cote, offre.coteDepart || state.player.cote), 0, 100);
  state.sansContrat = false;
  log(state, `Contrat signé avec ${clubById(offre.clubId).n} : ${state.contrat.duree} saison(s), ${state.contrat.salaire} € par mois.`, 'contrat');
  return state.contrat;
}

function contratExpire(state) {
  return !state.contrat || state.contrat.restant <= 0;
}


/* ---------- Négociation d'une offre, critère par critère ----------
   Le club évalue chaque exigence séparément : il peut tout accepter,
   refuser en bloc, ou revenir avec une contre-proposition sur les
   points qu'il juge excessifs.                                      */
function evaluerExigences(state, initiale, demande) {
  const p = state.player;
  const rng = rngFrom(state.seed, 'nego2', state.season, demande.tours || 0, demande.salaire, demande.duree, demande.statut);
  const rangs = { concurrence: 0, rotation: 1, titulaire: 2 };
  const c = clubById(initiale.clubId);
  const std = c.div ? divDef(c.div).standard : 55;
  /* Poids du joueur dans la discussion. */
  const poids = clamp((p.niveau - std) * 0.09 + p.reputation / 120 + (initiale.interet || 40) / 160, -0.6, 1.4);

  let cout = 0;
  const hausse = (demande.salaire - initiale.salaire) / Math.max(1, initiale.salaire);
  if (hausse > 0) cout += hausse * 2.4;
  if (hausse < 0) cout -= 0.3;
  const dRole = (rangs[demande.statut] ?? 0) - (rangs[initiale.statut] ?? 0);
  if (dRole > 0) cout += dRole * 0.85;
  const dDuree = Math.abs(demande.duree - initiale.duree);
  cout += dDuree * 0.18;

  /* Aucune structure n'accepte une demande hors de proportion, quel
     que soit le talent : au-delà du double de l'offre initiale, c'est
     un refus systématique. */
  if (demande.salaire > initiale.salaire * 2.2) {
    return { ok: false, offre: { ...initiale },
      texte: "Le club juge la demande irréaliste et met fin à la discussion." };
  }
  const marge = poids + rf(rng, -0.35, 0.35);
  if (cout <= marge) {
    return { ok: true, offre: { ...demande }, texte: 'Le club accepte vos conditions.' };
  }
  if (cout > marge + 1.3 || (demande.tours || 0) >= 3) {
    /* Refus net : retour à la proposition initiale, et le club se lasse. */
    return { ok: false, offre: { ...initiale }, texte: "Le club refuse et s'en tient à sa proposition initiale." };
  }
  /* Contre-proposition : le club rogne sur ce qui coûte le plus cher. */
  const contre = { ...demande };
  if (hausse > 0) contre.salaire = Math.round((initiale.salaire + (demande.salaire - initiale.salaire) * clamp(marge / cout, 0.2, 0.8)) / 10) * 10;
  if (dRole > 0 && cout > marge + 0.5) contre.statut = initiale.statut;
  if (dDuree > 1) contre.duree = Math.round((initiale.duree + demande.duree) / 2);
  return { ok: false, offre: contre, texte: 'Le club revient avec une contre-proposition.' };
}


/* ============================================================
   ÉVÉNEMENTS — vestiaire, presse, rapports du staff, objectifs
   ============================================================ */

/* ---------- Objectifs fixés par l'entraîneur ---------- */
function setObjectifs(state) {
  const p = state.player, div = divDef(clubById(state.clubId).div);
  const rng = rngFrom(state.seed, 'objectifs', state.season);
  const st = statusOf(p.cote);
  const attendus = st.k === 'cadre' || st.k === 'titu' ? 18 : st.k === 'rotation' ? 12 : 7;
  const objs = [{ k: 'matchs', n: 'Apparitions en championnat', cible: attendus, unite: 'matchs' },
    { k: 'note', n: 'Note moyenne', cible: round1(5.9 + rf(rng, 0, 0.5)), unite: '' }];
  if (p.pos === 'GB') objs.push({ k: 'clean', n: 'Clean sheets', cible: Math.max(2, Math.round(attendus * 0.28)), unite: '' });
  else if (posDef(p.pos).line === 'ATT') objs.push({ k: 'buts', n: 'Buts marqués', cible: Math.max(2, Math.round(attendus * 0.35)), unite: '' });
  else if (posDef(p.pos).line === 'MIL') objs.push({ k: 'decisif', n: 'Buts + passes décisives', cible: Math.max(2, Math.round(attendus * 0.28)), unite: '' });
  else objs.push({ k: 'duels', n: 'Duels gagnés', cible: Math.max(20, attendus * 4), unite: '' });
  state.objectifs = objs.map(o => ({ ...o, atteint: false }));
}

function valeurObjectif(state, k) {
  const s = state.stats;
  switch (k) {
    case 'matchs': return s.matchs;
    case 'note': return moyenneNote(s.notes) || 0;
    case 'clean': return s.clean_sheets;
    case 'buts': return s.buts;
    case 'decisif': return s.buts + s.passes_d;
    case 'duels': return s.duels_gagnes;
    default: return 0;
  }
}

function evalObjectifs(state) {
  const p = state.player;
  const div = clubById(state.clubId).div || 'R2';
  const res = (state.objectifs || []).map(o => {
    const v = valeurObjectif(state, o.k);
    return { ...o, valeur: round1(v), atteint: v >= o.cible };
  });
  const reussis = res.filter(o => o.atteint).length;
  let prime = 0;
  if (res.length && reussis === res.length) {
    p.cote = clamp(p.cote + CFG.OBJECTIFS.bonusCote, 0, 100);
    p.reputation = clamp(p.reputation + CFG.OBJECTIFS.bonusReputation, 0, 100);
    p.moral = clamp(p.moral + CFG.OBJECTIFS.bonusMoral, 0, 100);
    prime = CFG.OBJECTIFS.primeReussite[div];
    if (state.finances) { state.finances.solde += prime; state.finances.total += prime; state.finances.saisonPrimes += prime; }
    log(state, "Tous les objectifs de la saison ont été remplis.", 'objectif');
  } else if (res.length && reussis === 0) {
    p.cote = clamp(p.cote + CFG.OBJECTIFS.malusCote, 0, 100);
    log(state, "Aucun objectif rempli : le staff attend une réaction.", 'objectif');
  }
  return { objectifs: res, reussis, total: res.length, prime };
}

/* ---------- Rapports du staff : révélation des attributs cachés ---------- */
const HIDDEN_LABELS = {
  professionnalisme: { n: 'Professionnalisme', d: "Rigueur au quotidien. Pèse sur la progression et la cote auprès du staff." },
  regularite: { n: 'Régularité', d: 'Constance des performances d\'un match à l\'autre.' },
  fragilite: { n: 'Fragilité', d: 'Prédisposition aux blessures. Plus la valeur est haute, plus le corps lâche.' },
  adaptation: { n: 'Adaptation', d: 'Capacité à s\'intégrer vite dans un nouveau club.' },
  ambition: { n: 'Ambition', d: 'Appétit pour les défis plus relevés.' },
  intelligence_tac: { n: 'Intelligence tactique', d: 'Compréhension des consignes et lecture des situations.' },
  pression: { n: 'Résistance à la pression', d: 'Tenue dans les rencontres importantes.' },
  leadership: { n: 'Leadership', d: "Influence sur le groupe." },
};
function palierHidden(v) { return v >= 80 ? 'très élevé' : v >= 65 ? 'élevé' : v >= 45 ? 'correct' : v >= 30 ? 'limité' : 'faible'; }

function checkScouting(state) {
  const p = state.player;
  state.reveles = state.reveles || [];
  const total = state.saisons.reduce((s, b) => s + b.stats.matchs, 0) + state.stats.matchs;
  const dus = Math.floor(total / CFG.SCOUTING.matchsParRevelation);
  const nouveaux = [];
  for (const k of CFG.SCOUTING.ordre) {
    if (state.reveles.length >= dus) break;
    if (state.reveles.includes(k)) continue;
    state.reveles.push(k);
    nouveaux.push({ k, valeur: p.hidden[k], label: HIDDEN_LABELS[k].n, palier: palierHidden(p.hidden[k]) });
  }
  return nouveaux;
}

/* ---------- Presse locale ---------- */
function pressAfterMatch(state, res) {
  if (res.minutes <= 0) return null;
  /* En semi-professionnel, la presse suit chaque rencontre et la
     moindre contre-performance se retrouve commentée. */
  const mul = (CFG.SEMIPRO.presseMul[(clubById(state.clubId).div && divDef(clubById(state.clubId).div).statut) || 'amateur']) || 1;
  const p = state.player, adv = clubById(res.adversaire), club = clubById(state.clubId);
  const rng = rngFrom(state.seed, 'presse', state.season, state.calIndex);
  const arts = [];
  if (res.buts >= 3) arts.push({ t: 'Triplé', c: `${p.prenom} ${p.nom} a inscrit ${res.buts} buts face à ${adv.n}. Le nom circule bien au-delà du club.` });
  else if (res.buts === 2) arts.push({ t: 'Doublé', c: `Doublé de ${p.nom} contre ${adv.n} : ${club.n} tient son homme du moment.` });
  else if (res.homme) arts.push({ t: 'Homme du match', c: `${p.nom} a été le joueur le plus en vue de la rencontre (note ${res.note.toFixed(1)}).` });
  else if (res.cleanSheet && p.pos === 'GB') arts.push({ t: 'Clean sheet', c: `${p.nom} a gardé sa cage inviolée face à ${adv.n} avec ${res.arrets} arrêts.` });
  else if (res.note < (mul > 1.5 ? 5.2 : 4.6)) arts.push({ t: 'Soirée compliquée', c: `Prestation très en dessous pour ${p.nom} (note ${res.note.toFixed(1)}). Le staff attend une réponse.` });
  if (!arts.length && mul > 1.5 && res.note >= 6.8) arts.push({ t: 'Performance saluée',
    c: `${p.nom} a livré une prestation solide (note ${res.note.toFixed(1)}) face à ${adv.n}.` });
  if (!arts.length) return null;
  const a = pick(rng, arts);
  state.presse = state.presse || [];
  state.presse.unshift({ saison: state.season, date: res.date || '', titre: a.t, texte: a.c });
  if (state.presse.length > 40) state.presse.pop();
  /* Une belle sortie médiatisée fait bouger la réputation. */
  if (res.buts >= 2 || res.homme) p_repBoost(state, 0.6 * mul);
  return state.presse[0];
}
function p_repBoost(state, v) { state.player.reputation = clamp(state.player.reputation + v, 0, 100); }

function tirerEvenement(state) {
  const rng = rngFrom(state.seed, 'evt', state.season, state.calIndex);
  if (rng() > 0.20) return null;
  const dispo = EVENEMENTS.filter(e => {
    if ((state.evtVus || []).includes(e.k + state.season)) return false;
    try { return e.cond(state); } catch (err) { return false; }
  });
  if (!dispo.length) return null;
  const e = weightedPick(rng, dispo.map(x => ({ e: x, p: x.poids })), 'p').e;
  state.evtVus = state.evtVus || [];
  state.evtVus.push(e.k + state.season);
  return { k: e.k, titre: e.titre, texte: e.texte, choix: e.choix.map((c, i) => ({ i, n: c.n })) };
}

function repondreEvenement(state, k, idx) {
  const e = EVENEMENTS.find(x => x.k === k);
  if (!e || !e.choix[idx]) return null;
  const texte = e.choix[idx].eff(state);
  const p = state.player;
  p.cote = clamp(p.cote, 0, 100); p.moral = clamp(p.moral, 0, 100);
  p.forme = clamp(p.forme, 0, 100); p.fatigue = clamp(p.fatigue, 0, 100);
  log(state, `${e.titre} — ${texte}`, 'evenement');
  return texte;
}


/* ============================================================
   L3 — coupes, déclin, fin de carrière
   ============================================================ */

/* ---------- Coupes ----------
   Aucune division supplémentaire : uniquement des compétitions à
   élimination directe. Un tour perdu et la campagne s'arrête, les
   échéances restantes sautent.                                     */
function buildCoupes(state) {
  const rng = rngFrom(state.seed, 'coupes', state.season);
  const club = clubById(state.clubId);
  const coupes = [];
  /* Les coupes portent le nom en vigueur dans le pays du club, et la
     coupe locale n'est ouverte qu'aux divisions concernées. */
  const paysK = (CFG.PAYS.find(x => x.n === club.pays) || { k: 'FR' }).k;
  const noms = CFG.COUPES_PAYS[paysK] || CFG.COUPES_PAYS.FR;
  for (const def of CFG.COUPES) {
    if (def.k === 'reg' && !noms.localDivs.includes(club.div)) continue;
    /* Entrée en lice en coupe nationale calquée sur la réalité : plus
       le club est haut placé, plus il entre tard dans la compétition. */
    const depart = def.k === 'cdf' ? (CFG.ENTREE_COUPE[club.div] || 0) : 0;
    coupes.push({
      id: 'c' + state.season + '_' + def.k, k: def.k,
      nom: def.k === 'cdf' ? noms.nat : noms.local, saison: state.season,
      tourCourant: depart, depart, elimine: false, vainqueur: false,
      rangAtteint: null, matchs: [],
